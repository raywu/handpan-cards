  const C = d.colors;
  const hasBottom = !!g.bottom;
  // Generated decks carry the solver's own extent (ENGINE-SPEC section 11);
  // the built-in geom literals have no ext key, so they keep the derivation.
  const ext = g.ext ? R * g.ext
            : hasBottom ? R * (g.bottom + g.r_bnote + g.n_out) + 14 : R * 1.06;
  // data-ext travels with the interactive layer because the hit radius can only
  // be computed from the MEASURED width, and the sizer needs the viewBox scale
  // to convert CSS pixels into it. The card path emits neither.
  let s = `<svg viewBox="${-ext} ${-ext} ${2*ext} ${2*ext}"${
    interactive ? ` data-ext="${ext}"` : ""} xmlns="http://www.w3.org/2000/svg">`;

  const P = (orb, ang) => [orb * Math.cos(ang * Math.PI / 180), -orb * Math.sin(ang * Math.PI / 180)];

  if (hasBottom)
    s += `<circle r="${R*g.bottom}" fill="none" stroke="#e2e2e2" stroke-width="1.4" stroke-dasharray="4 4"/>`;
  s += `<circle r="${R}" fill="none" stroke="#000" stroke-width="2"/>`;
  if (g.inner_ring)
    s += `<circle r="${R*g.inner_ring}" fill="none" stroke="#000" stroke-width="1"/>`;

  function field(x, y, r, id, isBottom) {
    const st = blue.has(id) ? "root" : green.has(id) ? "tone" : isBottom ? "offb" : "off";
    let out = "";
    if (st === "offb")
      out += `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="3 3"/>`;
    else
      out += `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="#000" stroke-width="1.1"/>`;
    if (st === "root" || st === "tone") {
      out += `<circle cx="${x}" cy="${y}" r="${r*0.87}" fill="none" stroke="${st==="root"?C.root:C.tone}" stroke-width="${r*0.24}"/>`;
      out += `<circle cx="${x}" cy="${y}" r="${r*0.74}" fill="none" stroke="#000" stroke-width="0.9"/>`;
    }
    return out;
  }
  function label(x, y, name, oct, fs, col) {
    return `<text x="${x}" y="${y + fs*0.34}" text-anchor="middle" fill="${col}"
      font-family="Nunito Sans, sans-serif" font-size="${fs}">${esc(name)}<tspan
      font-size="${fs*0.66}" dy="${fs*0.18}">${oct}</tspan></text>`;
  }

  const numFs = numSize(R * g.r_note);
  // The ding has no slot in the layout correction, so it is not selectable and
  // is not counted in the "position N of M" a screen reader reads out.
  const selectable = Object.keys(d.fields).filter((f) => d.fields[f][3] !== "ding").length;
  for (const fid in d.fields) {
    const id = +fid;
    const [name, oct, , zone, ang, lab] = d.fields[fid];
    if (zone === "ding") {
      const dy = (g.ding_dy || 0) * R, rr = R * g.r_ding;
      s += field(0, dy, rr, id, false);
      s += label(0, dy, name, oct, labelSize(rr, zone), "#242424");
      continue;
    }
    const isB = zone === "bottom";
    const orb = R * (isB ? g.bottom : zone === "inner" ? g.inner : g.rim);
    const rr  = R * (isB ? g.r_bnote : g.r_note);
    const [x, y] = P(orb, ang);
    s += field(x, y, rr, id, isB);
    const lit = blue.has(id) || green.has(id);
    s += label(x, y, name, oct, labelSize(rr, zone),
               isB && !lit ? "#8a8a8a" : "#242424");
    // numbers
    let nr, col, fs = numFs;
    if (isB) { nr = orb + rr + R * g.n_out; col = "#E27005"; }
    else if (zone === "rim" && g.rim_num_out) { nr = orb + rr + R * g.n_in; col = "#333"; }
    else { nr = orb - rr - R * g.n_in; col = "#333"; }
    const [nx, ny] = P(nr, ang);
    s += `<text x="${nx}" y="${ny + fs*0.34}" text-anchor="middle" fill="${col}"
      font-family="Nunito Sans, sans-serif" font-weight="${isB?600:400}" font-size="${fs}">${lab}</text>`;
    // The ding is skipped above and so never reaches here: it has no slot in
    // the layout correction, so there is nothing to select it FOR.
    if (interactive) {
      const on = sel !== null && String(id) === sel;
      // The ring is its own element rather than a stroke on the hit target: the
      // target's radius is shrunk to whatever keeps it disjoint from its
      // neighbours (panHitRadii), which on a crowded pan is well inside the
      // note it covers. A selection the user cannot line up with a note is not
      // a selection, so the ring is drawn at the NOTE's radius and stays there.
      if (on)
        rings.push(`<circle class="pansel" cx="${x}" cy="${y}" r="${rr * 1.2}"`
          + ` fill="none" stroke="#E27005" stroke-width="${R * 0.016}"`
          + ` pointer-events="none"/>`);
      hits.push(`<circle class="panhit" data-field="${id}" cx="${x}" cy="${y}" r="${rr}"`
        + ` data-r="${rr}" fill="transparent" tabindex="-1" role="button"`
        + ` aria-selected="${on}"${on ? ' data-sel="true"' : ""}`
        + ` aria-label="${escA(name + oct)}, position ${escA(String(lab))} of ${selectable}"/>`);
    }
  }
  // After every field, so a target is never painted under the pan it selects,
  // and the ring under the targets so it can never eat a tap.
  if (interactive) s += `<g class="pansels">${rings.join("")}</g>`
                      + `<g class="panhits">${hits.join("")}</g>`;
  return s + "</svg>";
}

/** The hit radius of EVERY target, in VIEWBOX units, for a pan rendered
 *  `sizePx` across. `pts` is `[[x, y, rDrawn], ...]`; the answer is per target.
 *
 *  Three things this is answering. CSS cannot do it: vector-effect holds a
 *  STROKE against the viewBox scale and has nothing to say about a circle's hit
 *  area, so the radius has to be computed from a size nobody knows until the
 *  SVG is in the document. The 44px floor is not always reachable - Pygmy has
 *  17 selectable fields - so where it is not, NON-OVERLAP WINS: a target that
 *  laps its neighbour silently selects the wrong note, which is a worse failure
 *  than a target that is merely small. And a target is never smaller than the
 *  note it covers: on a sparse pan the drawn ring is wider than 44px, and a
 *  user aiming at a circle they can plainly see must not miss it.
 *
 *  Per target rather than one radius for the whole pan, which matters twice.
 *  It stays provably disjoint - with r_i <= min_j(d_ij)/2 for each i, any pair
 *  has r_i + r_j <= d_ij - while letting a roomy corner of the pan keep a big
 *  target that one tight pair elsewhere would otherwise shrink. And two fields
 *  at the same point zero only each other instead of the entire layer. */
function panHitRadii(ext, sizePx, minPx, pts) {
  const scale = (2 * ext) / sizePx;
  return pts.map((p, i) => {
    let half = Infinity;
    for (let j = 0; j < pts.length; j += 1)
      if (j !== i)
        half = Math.min(half, Math.hypot(p[0] - pts[j][0], p[1] - pts[j][1]) / 2);
    return Math.min(Math.max((minPx / 2) * scale, p[2] || 0), half);
  });
}

/** Size an inserted interactive pan's hit layer from its MEASURED box.
 *
 *  Idempotent: each target's own drawn radius is read back from data-r, never
 *  from the `r` a previous pass wrote, so running again on resize or an
 *  orientation change cannot compound. A layer that has not been laid out yet
 *  measures zero and is left with its rendered radii rather than zeroed. */
/* The hit-target floor, in CSS pixels: the platform minimum for a touch target.
 * A floor and not a promise - panHitRadii caps every target at half the
 * distance to its nearest neighbour, so on a pan with 17 selectable fields at
 * 380px the targets land under it. Stage 1 AC3 settled that trade: a target
 * that laps its neighbour selects the WRONG note, which is worse than a small
 * one. */
const PAN_HIT_MIN_PX = 44;
function sizePanHits(svg, minPx) {
  if (!svg || !svg.getAttribute) return;
  const ext = Number(svg.getAttribute("data-ext"));
  const box = svg.getBoundingClientRect ? svg.getBoundingClientRect() : null;
  // A square viewBox under the default xMidYMid meet renders at the SMALLER of
  // the two dimensions: in a short wide box the pan is sized by the height, and
  // a scale taken from the width alone would make every target too small.
  const size = box ? Math.min(box.width, box.height) : 0;
  if (!ext || !size) return;
  const nodes = [].slice.call(svg.querySelectorAll(".panhit"));
  if (!nodes.length) return;
  const pts = nodes.map((n) => [Number(n.getAttribute("cx")), Number(n.getAttribute("cy")),
                                Number(n.getAttribute("data-r")) || 0]);
  const r = panHitRadii(ext, size, minPx, pts);
  nodes.forEach((n, i) => n.setAttribute("r", String(r[i])));
}

/* ---------------- card faces ---------------- */
// Literal basenames of the already-committed print PDFs (repo root), keyed by
// built-in deck id. Not string-built from d.name/d.id and not stored in
// data/decks.json - see CLAUDE.md's print pipeline and the PR that added
// this: that file's deck keys are owned by the print-pipeline lane and are
// regenerated, so a filename field there would be silently dropped. Only the
// three built-in decks have committed PDFs; a generated/custom deck has none.
/** The print sheet's page geometry, in PDF points, copied from
 *  `tools/hifi.py:35-37` - which is the print spec, not a second opinion.
 *  CSS `pt` is a physical unit in print, so these carry over unchanged.
 *
 *  ONE declaration, read by every layout. The wide sheet is 3x3 and is pinned
 *  by value against `hifi.slots()`; the narrow sheet of D17 is 3x2 and has no
 *  Python oracle to be pinned against, so what holds it honest is that it
 *  derives from these same six numbers (AC-B3). A second copy would agree
 *  today and drift later.
 */
const PRINT_GEOM = { PW: 612, PH: 792, CW: 177.6, CH: 247.2, GX: 12.2, GY: 9.4 };

/** The two page layouts. D17: a narrow viewport drops a ROW, never a column -
 *  the iOS overflow is vertical. Both are 3 columns of the same card.
 *
 *  The gutters live here rather than being read straight from PRINT_GEOM
 *  because they are the only slack the sheet has. B7 on an iPhone 14 (iOS
 *  26.6) printed the narrow sheet sheared at both edges: iOS Safari ignores
 *  `@page{margin:0}` and enforces its own printable area, and 3 columns plus
 *  two 12.2pt gutters is 557.2pt, which fits only a 13.7pt margin. At zero
 *  gutters the same three cards are 532.8pt - still 1.2pt over the 531.6pt
 *  iOS actually grants, which is why the zero-gutter sheet ALSO clipped. The
 *  narrow sheet therefore ROTATES: 494.4pt across and 532.8pt down clears
 *  PRINT_SAFE on both axes, at the card's exact printed size. The owner chose
 *  exact size over scaling the sheet down (2026-09-22).
 *  `constrained` marks the layouts a margin-enforcing platform can select;
 *  `wide` is not one of them (see printLayoutName), so it keeps hifi's
 *  gutters for the platforms that honour `margin:0`.
 */
const PRINT_LAYOUTS = {
  wide: { cols: 3, rows: 3, gx: PRINT_GEOM.GX, gy: PRINT_GEOM.GY },
  narrow: { cols: 3, rows: 2, gx: 0, gy: 0, rotate: true, constrained: true },
};

/** The printable area a platform that ignores `@page` leaves us, per side.
 *  Measured on iPhone 14 / iOS 26.6, US Letter (2026-09-21): the paper is
 *  612pt wide and the drawn content spanned 531.6pt, so the enforced margin
 *  is 40.2pt (0.558in) - NOT the 0.5in the previous oracle assumed. 45pt
 *  carries that measurement with ~12% headroom, because it came from one
 *  device at one scale factor.
 */
/*  Reviewer R3: nothing in the app READS this - layout selection is by UA and
 *  viewport, never by arithmetic against a margin. It is an executable spec
 *  anchor for a device measurement, exported so tests/app.test.js can assert
 *  every constrained layout still fits what the platform actually grants. */
const PRINT_SAFE = { margin: 45 };

/** D16's paper control. Only the PAGE BOX changes: A4 is 297mm against
 *  Letter's 279.4mm, nowhere near the ~97mm a third card row plus its gutter
 *  would need, so paper size and row count are orthogonal controls.
 */
/* No page-box height here. iOS Safari ignores @page entirely, so the paper
   height is a number we cannot know; asserting it made every sheet paginate
   across two physical pages. Only the size keyword survives. */
const PRINT_PAPER = { letter: { css: "letter" }, a4: { css: "A4" } };

/** True for every iOS/iPadOS Safari, which ignores the `@page` at-rule
 *  outright - size, orientation and `margin:0` alike - and enforces a page
 *  box of its own. A UA sniff is the wrong tool and is used anyway: no
 *  feature detection for "does this honour @page" exists.
 */
function isIOS(ua) {
  const s = String(ua || "");
  return /iPad|iPhone|iPod/.test(s) ||
    // iPadOS 13+ reports a desktop Macintosh UA but still has touch points.
    (/Macintosh/.test(s) && typeof navigator !== "undefined" && navigator.maxTouchPoints > 1);
}

/** AC-B5b: slots-per-page is decided ONCE, here. The name this returns picks
 *  a `PRINT_LAYOUTS` entry, `printGridCSS()` turns that into the stylesheet
 *  `#printgeom` carries, and the `@media print` block never re-decides the
 *  width itself - it has no width query and no layout selector at all.
 *  The iOS clause comes FIRST and ignores width: keyed on width alone, an
 *  iPad in portrait (744/768/810/820/834 CSS px) and an iPhone 14 in
 *  landscape (844) both selected the 557.2 x 760.4pt wide sheet on a platform
 *  whose printable box is ~531.6 x 711.6pt - short on both axes, and too tall
 *  for rotation to rescue. Off iOS the app's own 640px breakpoint still
 *  applies; note that `index.html:41` is a TWO-condition query
 *  (`min-width:640px and min-height:700px`), so it and this function
 *  deliberately disagree on a landscape phone.
 */
function printLayoutName(w, ua) {
  if (isIOS(ua)) return "narrow";
  return w >= 640 ? "wide" : "narrow";
}

/** The grid declaration, written from PRINT_GEOM so the stylesheet carries no
 *  card-geometry literal of its own (the same single-definition-site rule
 *  AC-B3 puts on the slot emitter).
 */
function printGridCSS(name, paper) {
  const g = PRINT_GEOM, L = PRINT_LAYOUTS[name], p = PRINT_PAPER[paper] || PRINT_PAPER.letter;
  // Reserve the SHEET's own footprint, never the paper's. A platform that
  // ignores @page owns the page box; a block taller than that box does not
  // clip, it paginates - every sheet becomes two pages, the second carrying
  // the sliced remainder. min-height lets the platform's box supply the rest.
  const sw = L.cols * g.CW + (L.cols - 1) * L.gx;
  const sh = L.rows * g.CH + (L.rows - 1) * L.gy;
  // Rounded: 3 * 247.2 + 2 * 9.4 lands on 760.3999999999999 in binary float,
  // and a stylesheet is text a human reads in devtools.
  const footprint = Math.round((L.rotate ? sw : sh) * 100) / 100;
  return `@page{size:${p.css}; margin:0}\n` +
    `#printroot .printpage{min-height:${footprint}pt}\n` +
    `#printroot .printsheet{grid-template-columns:repeat(${L.cols}, ${g.CW}pt);` +
    `grid-template-rows:repeat(${L.rows}, ${g.CH}pt);` +
    `column-gap:${L.gx}pt; row-gap:${L.gy}pt}\n` +
    (L.rotate ? `#printroot .printsheet{transform:rotate(-90deg)}\n` : "") +
    `#printroot .printscale{width:${PRINT_DESIGN_W}px;` +
    `height:${PRINT_DESIGN_W * g.CH / g.CW}px;` +
    `transform:scale(${g.CW / 72 * 96 / PRINT_DESIGN_W})}`;
}

/** The card list a print sheet is built from, mirroring `tools/hifi.py`
 *  build() (:379-395), which is the print spec.
 *
 *  The full deck opens with a title and a legend card and pads the last page
 *  with BLANK templates; the print-shop sheet is chord cards only and pads
 *  with EMPTY slots, so a shop never prints a blank template nobody asked
 *  for.
 *
 *  `blank_cards` asks for blanks BEYOND that padding. It is a print-overlay
 *  literal, and the overlay lives in tools/decks.py alone: data/decks.json is
 *  what the DECKS line is generated from, and it carries no such key, so no
 *  deck in the browser sets it today and the page padding below is what
 *  actually fills a short last page. The branch stands because the overlay
 *  could move into the canonical file - it is honoured the moment the key
 *  appears, which is what keeps this renderer and the PDF from disagreeing.
 *  Pinned by "blank_cards is honoured when present" in tests/app.test.js.
 *
 *  `slotsPerPage` is an ARGUMENT, never a viewport read: D17 makes it 6 on a
 *  narrow viewport and 9 on a wide one, and one decision point for that
 *  number is what keeps the padding here and the CSS grid from disagreeing
 *  (AC-B5b). A function that read window.innerWidth itself would also stop
 *  being testable without a viewport stub.
 */
/** The static legend copy. It teaches the CARD ANATOMY, not the deck, so it
 *  is the same on every sheet - the decision recorded under "The copy a custom
 *  deck does not have". Mirrors tools/hifi.py legend_card (:490-511).
 */
const PRINT_LEGEND_LINES = [
  "The diagram lights every field whose note is in the chord.",
  "Notes read from the root, in the chord's own spelling order.",
  "The number line is the same notes by their pan index."
];

/** One printCardList() entry as the inner markup of a `.face`.
 *  Chord cards draw through the app's own renderers; the other three kinds
 *  mirror tools/hifi.py title_card (:474), legend_card (:490) and blank_card
 *  (:514). A custom deck has no print-overlay copy, so the canonical seed
 *  string stands in for `sub`, the engine's own warning reasons stand in for
 *  the blurb, and there is no credit line.
 */
function printCardHTML(d, card) {
  if (card.kind === "skip") return "";
  const seed = HPE.core.formatSeed(d.fields);
  if (card.kind === "chord") {
    // Full card anatomy, per CLAUDE.md "Card anatomy": header, chord name,
    // diagram, then the note and number lines. `nameHTML(ch, false)` leaves the
    // size to the print stylesheet - the screen's `big` size is in `vw`, which
    // means nothing on paper.
    return headerHTML(d, card.chord, card.n, true) +
      `<div class="printname">${nameHTML(card.chord, false)}</div>` +
      `<div class="diagwrap">${pan(d, card.chord)}</div>` + linesHTML(d, card.chord);
  }
  if (card.kind === "title") {
    const blurb = (d.warnings || []).map(w => `<div>${esc(w.reason)}</div>`).join("");
    return `<div class="hdr">
      <div class="l">${esc(d.name)}<br><span class="num">${esc(d.sub || seed)}</span></div>
      <div class="r">CHORD CARDS</div></div>
      <div class="diagwrap">${pan(d, null)}</div>
      <div class="printblurb">${blurb}</div>`;
  }
  if (card.kind === "legend") {
    const demo = d.chords[0];
    return `<div class="hdr">
      <div class="l">${esc(d.name)}</div><div class="r">LEGEND</div></div>
      <div class="prompt"><div class="bigname" style="font-size:28px">How to read</div></div>
      <div class="diagwrap">${pan(d, demo)}</div>
      <div class="printkeys">
        <span class="key"><span class="ring" style="border-color:${d.colors.root}"></span>ROOT NOTE</span>
        <span class="key"><span class="ring" style="border-color:${d.colors.tone}"></span>CHORD NOTE</span>
      </div>
      <div class="printblurb">${PRINT_LEGEND_LINES.map(l => `<div>${esc(l)}</div>`).join("")}</div>`;
  }
  // blank: a deck-branded template with two rules to write on.
  return `<div class="hdr"><div class="l">${esc(d.name)}</div></div>
    <div class="diagwrap">${pan(d, null)}</div>
    <div class="lines"><div class="blankrule"></div><div class="blankrule"></div></div>`;
}

function printCardList(d, variant, slotsPerPage) {
  const chords = d.chords.map((ch, i) => ({ kind: "chord", n: i + 1, chord: ch }));
  const shop = variant === "shop";
  const cards = shop ? chords
    : [{ kind: "title" }, { kind: "legend" }].concat(chords,
        Array.from({ length: d.blank_cards || 0 }, () => ({ kind: "blank" })));
  const filler = shop ? "skip" : "blank";
  while (cards.length % slotsPerPage !== 0) cards.push({ kind: filler });
  return cards;
}

/* ---------------- the print CTA (Workstream B) ----------------
 * A custom deck has no pre-built PDF, so it prints through the browser: build
 * the sheet into #printroot, call window.print(), and empty it again. The
 * container is `hidden` and contributes nothing to the practice screen at any
 * other moment (AC-B5).
 */
let printPaper = "letter";
function setPrintPaper(p) { if (PRINT_PAPER[p]) printPaper = p; }

/** The design width the faces are authored at. The printed card is CW points
 *  wide, so the scale factor falls out of PRINT_GEOM and is not a literal of
 *  its own. */
const PRINT_DESIGN_W = 340;

function printSheetHTML(d, variant, name) {
  const L = PRINT_LAYOUTS[name], slots = L.cols * L.rows;
  const cards = printCardList(d, variant, slots);
  let out = "";
  for (let i = 0; i < cards.length; i += slots) {
    const cells = cards.slice(i, i + slots).map(c => {
      const inner = printCardHTML(d, c);
      // A `skip` is an EMPTY slot on the print-shop sheet: the cell holds the
      // grid open and draws nothing.
      return `<div class="printcell">${inner
        ? `<div class="printscale"><div class="face">${inner}</div></div>` : ""}</div>`;
    }).join("");
    out += `<div class="printpage"><div class="printsheet">${cells}</div></div>`;
  }
  return out;
}

/* Idempotent, and it re-queries its own elements every time: this runs from a
   listener registered at boot, when #printroot has not been parsed yet, so a
   captured reference would be null. Clearing an already-empty container is a
   no-op, which is what lets one boot-scope listener serve both the app's CTA
   and a print the user started themselves (Cmd+P, iOS Share -> Print). */
function teardownPrintSheet() {
  const root = document.getElementById("printroot");
  root.innerHTML = "";
  root.hidden = true;
  document.body.classList.remove("printing");
  document.getElementById("printgeom").textContent = "";
}

function openPrintSheet(variant) {
  const root = document.getElementById("printroot");
  try {
    // AC-B5b: the viewport is read ONCE, here, and feeds ONE thing - the
    // stylesheet below. The container carries no layout class: nothing in
    // @media print selects on one, so a class would only be a second decision
    // point free to drift from this one.
    const name = printLayoutName(window.innerWidth, navigator.userAgent);
    document.getElementById("printgeom").textContent = printGridCSS(name, printPaper);
    root.innerHTML = printSheetHTML(deck(), variant, name);
    root.hidden = false;
    document.body.classList.add("printing");
    window.print();
  } catch (e) {
    // Only the throw path tears down synchronously: if print() threw, no print
    // is happening and no afterprint will arrive. The SUCCESS path must NOT
    // clean up here - window.print() blocks on desktop Chrome but returns
    // immediately on iOS Safari, which schedules the print UI asynchronously,
    // so a finally would empty the sheet before iOS rasterized it and print
    // the live app page instead. Teardown belongs to afterprint (boot scope).
    teardownPrintSheet();
    throw e;
  }
}

/* The custom-deck print CTA, as of the client-pdf-emitter plan: the browser is
   no longer asked to print, the page writes the PDF itself and hands it over.
   iOS Safari is the reason - it ignores `@page` entirely (no paper size, no
   orientation, no margins), so the browser-print sheet could never produce the
   62.65 x 87.21 mm card the print spec measures, on the one platform this app
   is used on most.

   `openPrintSheet` below is deliberately left in place and unreferenced by the
   CTA (plan D2): until the owner's device gate says the emitter prints
   correctly on the phone, the old path is the way back.

   The bytes are HPE.pdfcards', a port of tools/hifi.py held glyph for glyph
   against it by tests/test_pdf_parity.py. Nothing about the page layout is
   decided here - only delivery. */
function pdfFileName(d, variant, paper) {
  // tools/decks.py:409-416 names the six shipped files. A custom deck's
  // download joins that shelf rather than inventing a second shape, so a
  // person with both on their desktop can see they are the same kind of thing.
  const stem = d.name.replace(/[^A-Za-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
  const tail = paper === "a4" ? "A4" : "Letter";
  return stem + (variant === "shop" ? "_PRINTER_ONLY_Chords_" : "_Cards_") + tail + ".pdf";
}

function downloadDeckPDF(variant) {
  const d = deck();
  const bytes = HPE.pdfcards.build(HPE.pdfdeck.fromGenerated(d),
                                   { variant, paper: printPaper });
  const url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
  if (isIOS(navigator.userAgent)) {
    // `<a download>` is not honoured by iOS Safari: the tap does nothing at
    // all, no file and no error. Opening the blob hands the PDF to the system
    // viewer, whose Share sheet is how a file gets saved on that platform.
    window.location.href = url;
  } else {
    const a = document.createElement("a");
    a.href = url;
    a.download = pdfFileName(d, variant, printPaper);
    a.click();
  }
  // Revoked on a timer, never in this turn of the event loop: the viewer (and
  // Chrome's own download machinery) reads the URL after this function
  // returns, and revoking early cancels the download with no diagnostic.
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

const PRINT_PDFS = {
  hijaz: { cards: "CSharp_Hijaz_Orion_9_Cards_Letter.pdf", printerOnly: "CSharp_Hijaz_Orion_9_PRINTER_ONLY_Chords_Letter.pdf" },
  pygmy: { cards: "F3_Low_Pygmy_18_Cards_Letter.pdf", printerOnly: "F3_Low_Pygmy_18_PRINTER_ONLY_Chords_Letter.pdf" },
  amara: { cards: "D_Amara_9_Cards_Letter.pdf", printerOnly: "D_Amara_9_PRINTER_ONLY_Chords_Letter.pdf" },
};
function headerHTML(d, ch, n, noPrints) {
  const deg = d.degrees[String(pc(d, ch.roots[0]))] || "";
  // A printed card carries no print row: the buttons are screen furniture and
  // `.prints` is the one part of the header a sheet must drop (B3/AC-B1).
  const pdfs = noPrints ? null : PRINT_PDFS[d.id];
  // A sibling row below .hdr, not a third flex child inside it: .hdr's own
  // box (and so the deck name's available width/line count) is untouched by
  // this feature - see the print-button lane's e2e test.
  // Built-ins link to the PDFs the print pipeline already built; a custom deck
  // has none, so it prints through the browser instead. Same two labels, same
  // position, and the built-in markup is byte-for-byte what it was (AC-B1).
  const prints = noPrints ? "" : pdfs
    ? `<div class="prints" onclick="event.stopPropagation()">
      <a href="${esc(pdfs.cards)}" target="_blank" rel="noopener">FULL DECK PDF</a>
      <a href="${esc(pdfs.printerOnly)}" target="_blank" rel="noopener">PRINT-ONLY PDF</a>
    </div>`
    : `<div class="prints" onclick="event.stopPropagation()">
      <button type="button" onclick="downloadDeckPDF('full')">FULL DECK PDF</button>
      <button type="button" onclick="downloadDeckPDF('shop')">PRINT-ONLY PDF</button>
      <select aria-label="Paper size" onchange="setPrintPaper(this.value)">
        <option value="letter"${printPaper === "letter" ? " selected" : ""}>LETTER</option>
        <option value="a4"${printPaper === "a4" ? " selected" : ""}>A4</option>
      </select>
    </div>`;
  return `<div class="hdr">
    <div class="l">${esc(d.name)}<br><span class="num">#${n}</span>
      ${deg ? `&nbsp;<span class="deg">${esc(deg)}</span>` : ""}</div>
    <div class="r">${esc(ch.subtitle)}</div></div>${prints}`;
}
function nameHTML(ch, big) {
  const len = (ch.main + ch.sup).length;
  const size = big ? `clamp(34px, ${Math.min(19, 120/len)}vw, ${len > 7 ? 64 : 92}px)` : "inherit";
  return `<div class="bigname" style="font-size:${size}">${esc(ch.main)}${ch.sup ? `<sup>${esc(ch.sup)}</sup>` : ""}</div>`;
}
function linesHTML(d, ch) {
  const C = d.colors, rpc = pc(d, ch.roots[0]);
  const seg = (arr, render) => arr.map(render).join(`<span class="sepc"> - </span>`);
  const notes = seg(ch.fields, f => {
    const [nm, oc] = d.fields[f];
    const col = pc(d, f) === rpc ? C.root : C.tone;
    return `<span style="color:${col}">${esc(nm)}<sub>${oc}</sub></span>`;
  });
  const nums = seg(ch.fields, f => {
    const col = pc(d, f) === rpc ? C.root : C.tone;
    return `<span style="color:${col}">${esc(d.fields[f][5])}</span>`;
  });
  const nb = ch.fields.filter(f => d.fields[f][3] === "bottom").length;
  return `<div class="lines">
    ${nb ? `<div class="badge">${nb} BOTTOM NOTE${nb > 1 ? "S" : ""}</div>` : ""}
    <div class="notesline">${notes}</div>
    <div class="numline">${nums}</div></div>`;
}
function render() {
  if (!order.length) return;
  const d = deck(), n = order[idx] + 1, ch = d.chords[order[idx]];
  document.documentElement.style.setProperty("--root", d.colors.root);
  document.documentElement.style.setProperty("--tone", d.colors.tone);
  document.documentElement.style.setProperty("--ga", d.colors.ga);
  document.documentElement.style.setProperty("--gb", d.colors.gb);

  const answer = headerHTML(d, ch, n) +
    `<div class="diagwrap">${pan(d, ch)}</div>` + linesHTML(d, ch);
  const question = headerHTML(d, ch, n) +
    `<div class="prompt">${nameHTML(ch, true)}
     <div class="hint">Tap to reveal the notes</div></div>`;
  const questionB = headerHTML(d, { ...ch, subtitle: "WHICH CHORD IS THIS?" }, n) +
    `<div class="diagwrap">${pan(d, ch)}</div>
     <div class="lines"><div class="hint" style="margin:0 0 12px">Tap to reveal the name</div></div>`;
  const answerB = headerHTML(d, ch, n) +
    `<div class="prompt">${nameHTML(ch, true)}</div>` + linesHTML(d, ch);

  document.getElementById("front").innerHTML = mode === "A" ? question : questionB;
  document.getElementById("back").innerHTML  = mode === "A" ? answer   : answerB;
  document.getElementById("count").textContent = `${idx + 1} / ${order.length}`;
  const cardEl = document.getElementById("card");
  cardEl.classList.toggle("flip", flipped);
  // The flip is a CSS transform, so BOTH faces stay in the DOM and in the
  // accessibility tree unless we say otherwise - which would read the answer
  // out alongside the question. Expose only the face that is showing, and make
  // it the card's description (descendants of role="button" are presentational,
  // so the text has to reach the button by an idref, not by traversal).
  const shown = document.getElementById(flipped ? "back" : "front");
  const away  = document.getElementById(flipped ? "front" : "back");
  away.setAttribute("aria-hidden", "true");
  shown.removeAttribute("aria-hidden");
  // aria-hidden alone does not remove a link from the tab order, and
  // headerHTML() renders .prints into BOTH faces - so a keyboard user would
  // tab into two invisible links, and a screen reader would meet focusable
  // content inside an aria-hidden subtree.
  // Scoped through document, not through the face element: the face is the
  // node whose innerHTML was just replaced, and the unit suite's DOM stub
  // serves selectors from the document only.
  // Widened past `.prints a` for the custom path: a generated deck's controls
  // are <button> and <select>, and an unwidened selector would leave THREE
  // focusable controls inside an aria-hidden subtree - the exact defect this
  // pair of lines was written to prevent, in new element types (AC-B1b).
  const printCtrls = (id) =>
    ["a", "button", "select"].map((t) => `#${id} .prints ${t}`).join(",");
  for (const el of document.querySelectorAll(printCtrls(away.id))) el.tabIndex = -1;
  for (const el of document.querySelectorAll(printCtrls(shown.id))) el.removeAttribute("tabindex");
  cardEl.setAttribute("aria-describedby", shown.id);
}

/* ---------------- deck / order ---------------- */
function setOrder() {
  const n = deck().chords.length;
  order = [...Array(n).keys()];
  if (shuffled) for (let i = n - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]];
  }
  idx = 0; flipped = false;
}
// Built-ins first, then generated decks in the order they were made.
const allDecks = () => [...DECKS, ...Object.values(CUSTOM)];
// [5A] chip labels are capped at 16 characters with an ellipsis.
const CHIP_CAP = 16;
const chipLabel = n => (n.length > CHIP_CAP ? n.slice(0, CHIP_CAP - 1) + "…" : n);

function buildChips() {
  const nav = document.getElementById("decks");
  // "+ ADD" is the strip's FIRST chip. It is MOVED, not rebuilt: innerHTML=""
  // detaches it, and every reference the app holds - its onclick, the element
  // closeScaleSheet() returns focus to - is to THAT node, so it is read out
  // first and put back at the head of the new row. Appending it LAST instead
  // would leave it off-screen at rest on a phone, which is the whole point of
  // it being first (tests/mutants/e_add_chip_appended_last.patch).
  const add = document.getElementById("deck-add");
  nav.innerHTML = "";
  nav.appendChild(add);
  let active = null;
  for (const d of allDecks()) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (d.id === deckId ? " on" : "");
    // Same rule as the mode bar: the .on colour is not state a screen reader
    // can see, so the selected chip says so out loud.
    if (d.id === deckId) b.setAttribute("aria-current", "true");
    b.style.setProperty("--dga", d.colors.ga);
    b.style.setProperty("--dgb", d.colors.gb);
    // [row 218] The one chip with a SECOND action says so. A selected custom
    // chip reopens the sheet in Edit state; a selected built-in does nothing
    // at all, and the two were pixel-identical. The class paints a pencil
    // through ::after - decoration, and deliberately NOT a node, so the chip's
    // text stays the deck's name - and the accessible name says it in words.
    // Only ever on the chip that is BOTH selected and custom: row 262 is a
    // live focus trap on any path that opens Edit from an unselected chip.
    const editable = d.id === deckId && !!CUSTOM[d.id];
    b.innerHTML = `<span class="dot"></span>${esc(chipLabel(d.name))}`;
    if (editable) {
      b.classList.add("editable");
      // chipLabel, not d.name: past CHIP_CAP the chip READS an elided name,
      // and an accessible name built from the full one stops containing the
      // visible string - WCAG 2.5.3 Label-in-Name, which is what Voice
      // Control matches "tap <the words I can see>" against.
      b.setAttribute("aria-label", "Edit " + chipLabel(d.name));
    }
    // [design-review 7A] the ALREADY-SELECTED custom chip is the one and only
    // way into the Edit sheet; every other chip just selects its deck. No
    // context menu, no long press, no swipe.
    b.onclick = () => (d.id === deckId && CUSTOM[d.id])
      ? openEditSheet(CUSTOM[d.id], b)
      : selectDeck(d.id);
    nav.appendChild(b);
    if (d.id === deckId) active = b;
  }
  // The row scrolls, so the selected chip may be off-screen after a rebuild.
  if (active && active.scrollIntoView) active.scrollIntoView({ block: "nearest", inline: "nearest" });
}

/* ---------------- scale sheet ----------------

const PARSE_HINT = "Type your ding first, in brackets - then the top notes, low to high, exactly like the example in the box. Put | before any bottom-shell notes.";
const LAYOUT_HINT = "Layout is a guess. Tap LEFT-FIRST / RIGHT-FIRST if your pan is mirrored.";
const sheet     = document.getElementById("scale-sheet");

// than by id: it is the one thing the iOS keyboard fix below has to move, and

const parseLine = document.getElementById("scale-parse");
const previewBox = document.getElementById("scale-preview");
const msgLine   = document.getElementById("scale-msg");
const refusalLine = document.getElementById("scale-refusal");
const mirrorL   = document.getElementById("scale-mirror-l");
const mirrorR   = document.getElementById("scale-mirror-r");
const swatches  = document.getElementById("scale-swatches");
const genBtn    = document.getElementById("scale-generate");
const addChip   = document.getElementById("deck-add");
// The page header (Stage 2). backBtn is the page's way out AND where focus

const backBtn   = document.getElementById("scale-back");
const titleEl   = document.getElementById("scale-title");

// is modal: nothing behind it is clickable, focusable or read by a screen

const background = [...document.querySelectorAll("header, main, footer")];

let palette = 0;                 // D6 index 0-5
let mirror = false;              // section 13: false = right-first (the default)
let sheetOpen = false;
let editingId = null;            // the custom deck the sheet is editing, or null
let sheetOpener = null;          // the control focus returns to on close

// the auto label must keep it as a real name.
let nameDirty = false;

// permutation over the non-ding fields, in the order layout.solve collects
// them, saying which field takes which solved slot. NULL means ABSENT - the
// generated layout - and never an identity permutation, so a pan that was
// never corrected keeps exactly the share string it had (D5-1, D5-3).
let layoutOrder = null;
// The chosen SLOT, not the chosen field: `order[field] = slot`, so everything
// the controls do (zone blocks, cyclic shifts, swaps) is arithmetic on slots.
// A tap on the pan arrives as a FIELD id and is converted once, in
// selectPanField() - the one place the two can be got the wrong way round.
let layoutSel = 0;
const generated = new Set();     // deck ids generated in this page session

/* The seed row has exactly TWO writers, and each blanks the other. That is
   what makes #scale-parse and #scale-refusal mutually exclusive - and the
   exclusivity is the whole reason they can share ONE reserved line inside
   .fieldrow (see the :empty rule). Leaving it to call order is what shipped
   the 26.59px pan step: three separate call sites each looked locally right.
   A refusal supersedes the parse summary rather than stacking under it. The
   summary says the seed parsed; the refusal says the app will not take it,
   which is the more recent and the more actionable of the two, and the
   summary comes straight back on the next keystroke. */
function showParse(text) {
  refusalLine.textContent = "";
  parseLine.textContent = text;
}
function showRefusal(text) {
  parseLine.textContent = "";

  // reason: the colour is the only channel that separates a refusal from a
  // neutral line at a glance, so forgetting it has to be VISIBLE (and

  // left holding a tier for whatever writes next.
  refusalLine.className = text ? "err" : "";
  refusalLine.textContent = text;
}

/** The one adapter from a result/warning reason to a message tier. Warnings,
 *  success notices and deck-gone messages only - a SEED REFUSAL goes to
 *  showRefusal() instead, because #scale-msg sits below the pan and a refusal
 *  there is below the fold on an iPhone 14 with the keyboard up. */
function say(text, tier) {
  for (const el of [msgLine, announce]) {
    el.className = (el === announce ? "announce" : "") + (tier ? " " + tier : "");
    el.textContent = text;
  }
}

function buildSwatches() {
  swatches.innerHTML = "";
  HPE.select.PALETTES.forEach((p, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "dot" + (i === palette ? " sel" : "");

function setMirror(left) {

  mirrorL.classList.toggle("on", left);
  mirrorR.classList.toggle("on", !left);

  mirrorR.setAttribute("aria-pressed", String(!left));

/** "Ding D3 | 1 A3 2 C4 ..." - the ding, then every field under its label. */
function parseLineText(fields) {
  const ids = Object.keys(fields).map(Number).sort((a, b) => a - b);
  const part = id => {
    const [name, oct, , zone, , label] = fields[id];
    return (zone === "ding" ? "Ding" : label) + " " + name + oct;
  };
  const ding = ids.filter(i => fields[i][3] === "ding");
  const rest = ids.filter(i => fields[i][3] !== "ding");
  const head = ding.map(part).join(" ");
  return rest.length ? head + " | " + rest.map(part).join(" ") : head;
}

/** The D10 parent candidates, in the engine's FIXED list order (section 10). */
function buildDegrees(selected) {
  degSel.innerHTML = "";
  HPE.naming.PARENTS.forEach((p, i) => {
    const o = document.createElement("option");
    o.value = String(i);
    o.textContent = p.name;        // text position, so nothing is interpolated
    degSel.appendChild(o);
  });
