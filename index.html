<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- interactive-widget=resizes-content: when the soft keyboard opens, shrink the
     LAYOUT viewport rather than only the visual one, so 85dvh (the scale
     sheet's cap) shrinks with it and the sheet sits above the keyboard instead
     of behind it (queue row 212). Chromium honours it; browsers that do not
     ignore the token and keep the default resizes-visual, which is why the
     sheet's primary is also sticky rather than relying on this alone. -->
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Handpan Chord Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Bitter:wght@400;700&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#242424; --sep:#8a8a8a; --paper:#ffffff;
  --table:#1a1815; --table2:#26221c;
  --root:#0B7B75; --tone:#DD8F00; --ga:#0B7B75; --gb:#DD8F00;
  --card-w:min(88vw, 46vh, 420px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; font-family:"Nunito Sans", system-ui, sans-serif; color:#eae6df;
  background: radial-gradient(120% 90% at 50% 8%, var(--table2) 0%, var(--table) 62%);
  display:flex; flex-direction:column; align-items:center;
  min-height:100dvh; padding:max(10px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
  user-select:none;
}
header{width:100%; max-width:520px; text-align:center; margin-bottom:6px}
h1{font-family:Marcellus, serif; font-weight:400; font-size:clamp(20px,5.5vw,27px);
   letter-spacing:.04em; margin:2px 0 8px; color:#f4f0e8}
/* The chip row scrolls horizontally and never wraps; auto margins on the end
   chips keep it centred while it fits, without making either end unreachable
   once it overflows. The right edge fades so a cut-off chip reads as "more". */
.decks{display:flex; gap:8px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(90deg,#000 0 calc(100% - 22px), transparent 100%);
  mask-image:linear-gradient(90deg,#000 0 calc(100% - 22px), transparent 100%)}
.decks::-webkit-scrollbar{display:none}
.decks > :first-child{margin-left:auto}
.decks > :last-child{margin-right:auto}
.chip{
  flex:0 0 auto; min-height:44px; display:inline-flex; align-items:center;
  border:1.5px solid transparent; border-radius:999px; padding:7px 13px 6px;
  font:600 11px/1 "Nunito Sans"; letter-spacing:.09em; color:#d5cec2; background:#272219;
  cursor:pointer; position:relative; white-space:nowrap;
}
.chip.add{background:none; border:1.5px dashed #5a5142; color:#a79d8b}
/* + ADD is the only entry point to the custom-deck sheet, and so to the pan
   preview, so it may never scroll out of reach. It therefore sits OUTSIDE the
   scrolling strip, on its own row BELOW it: the strip keeps the full row width
   and scrolls inside it, and + ADD is always on screen at every width.
   The alternative - pinning + ADD over the strip with position:sticky - is
   worse than the bug it fixes. An overlay is only ever on TOP of the chips,
   never beside them, so a deck chip can come to rest underneath it, still
   visible but no longer tappable: elementFromPoint at the visible "D AMARA 9"
   chip returned the pinned button, and tapping it opened the create sheet
   instead of switching decks. Reserving the space is the only arrangement in
   which no chip can rest beneath + ADD, because none of the strip's scrollport
   is under it.
   The reserve is VERTICAL rather than beside the strip because taking the width
   out of the strip is nearly as bad: at 380-390px it narrows the scrollport
   enough to push the last built-in deck entirely outside it. A second row costs
   ~50px of header height, which the card still fits under at 380x780.
   Being in normal flow, + ADD also cannot lag behind iOS momentum scrolling,
   needs no safe-area inset of its own (the row is centred and capped at 520px,
   far inside any notch), and takes no touch-action override, so a swipe that
   starts on it still scrolls the strip. */
.deckrow{display:flex; flex-direction:column; align-items:center; gap:6px;
  width:100%; max-width:520px}
#decks{align-self:stretch}
#deck-add{flex:0 0 auto}
.chip .dot{display:inline-block; width:9px; height:9px; border-radius:50%;
  margin-right:6px; vertical-align:-1px; background:linear-gradient(180deg,var(--dga) 0 50%,var(--dgb) 50% 100%)}
.chip.on{color:#fff; border-image:linear-gradient(180deg,var(--dga) 0 50%,var(--dgb) 50% 100%) 1;
  border-radius:999px; border:1.5px solid var(--dga);
  box-shadow:0 0 0 1px color-mix(in srgb, var(--dgb) 55%, transparent)}
.modebar{display:flex; gap:8px; justify-content:center; margin-top:9px}
.mode{border:1px solid #433b2c; border-radius:8px; background:#211d16; color:#c4bcab;
  font:600 10.5px/1 "Nunito Sans"; letter-spacing:.08em; padding:7px 11px 6px; cursor:pointer}
.mode.on{background:#f1ece1; color:#272219; border-color:#f1ece1}
main{flex:1; display:flex; align-items:center; justify-content:center; width:100%; min-height:0}
.scene{width:var(--card-w); aspect-ratio:63/87; perspective:1400px}
.card{position:relative; width:100%; height:100%; transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.2,.7,.25,1); cursor:pointer}
.card.flip{transform:rotateY(180deg)}
@media (prefers-reduced-motion: reduce){ .card{transition:none} }
.face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:var(--paper); border-radius:12px; overflow:hidden;
  box-shadow:0 12px 34px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.4);
  display:flex; flex-direction:column;
}
.face::before{content:""; position:absolute; inset:0; border-radius:12px; padding:2.5px;
  background:linear-gradient(180deg,var(--ga) 0 50%,var(--gb) 50% 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none}
.back{transform:rotateY(180deg)}
.hdr{display:flex; justify-content:space-between; align-items:flex-start;
  padding:11px 13px 0; color:var(--ink)}
.hdr .l{font:600 9px/1.5 "Nunito Sans"; letter-spacing:.12em; color:var(--ink)}
.hdr .l .num{color:var(--sep); font-weight:400}
.hdr .l .deg{color:var(--root); font-weight:600; letter-spacing:.06em}
.hdr .r{font:600 8px/1.3 "Nunito Sans"; letter-spacing:.11em; color:var(--ink);
  text-align:right; max-width:55%; text-transform:uppercase}
.prompt{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:0 16px 26px}
.bigname{font-family:Marcellus, serif; color:#545454; line-height:.95; text-align:center}
.bigname sup{font-size:.5em; vertical-align:.55em}
.hint{margin-top:14px; font:600 9.5px/1.6 "Nunito Sans"; letter-spacing:.14em; color:#b6ae9f;
  text-transform:uppercase}
.diagwrap{flex:1; display:flex; align-items:center; justify-content:center; min-height:0;
  padding:2px 6px 0}
.diagwrap svg{width:100%; height:100%; max-height:100%}
.lines{padding:0 8px 13px; text-align:center}
.badge{font:600 9px/1 "Nunito Sans"; letter-spacing:.14em; color:#E27005; margin-bottom:6px}
.notesline{font-family:Bitter, serif; font-weight:400;
  font-size:clamp(12px,4.4vw,19px); line-height:1.25; white-space:nowrap}
.numline{font-family:Bitter, serif; font-weight:400;
  font-size:clamp(12px,4.2vw,18px); line-height:1.2; white-space:nowrap}
.notesline sub{font-size:.62em}
.sepc{color:#9a949f}
footer{width:100%; max-width:520px; display:flex; align-items:center;
  justify-content:space-between; gap:10px; margin-top:10px}
button.nav{flex:0 0 auto; width:56px; height:44px; border-radius:10px; border:1px solid #433b2c;
  background:#211d16; color:#eae6df; font-size:18px; cursor:pointer}
button.nav:active{background:#2e281e}
.mid{flex:1; text-align:center}
.count{font:600 11px/1 "Nunito Sans"; letter-spacing:.12em; color:#c4bcab}
.shuffle{margin-top:7px; background:none; border:none; color:#a79d8b; cursor:pointer;
  font:600 9.5px/1 "Nunito Sans"; letter-spacing:.13em; text-transform:uppercase}
.shuffle.on{color:#f1ece1}
:focus-visible{outline:2px solid #e3b25c; outline-offset:2px}

/* ---- the scale sheet (Phase 3) ----
   #scale-sheet is the modal layer: it carries the dialog role and paints the
   backdrop, and its single child is the surface. A tap whose target IS the
   layer is a backdrop tap. */
#scale-sheet{position:fixed; inset:0; z-index:30; background:#0009;
  display:flex; align-items:flex-end; justify-content:center}
[hidden]{display:none !important}
.sheetsurf{width:100%; max-width:520px; background:#1f1b15; border-top:1px solid #433b2c;
  border-radius:18px 18px 0 0; max-height:85dvh; overflow-y:auto;
  padding:14px 14px max(14px, env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:9px}
/* The surface is capped at 85dvh, so on the Edit sheet, in landscape, or with
   a soft keyboard up its content is taller than the cap. Before .sheetbody
   existed the WHOLE surface scrolled, which put the sheet's only primary -
   #scale-generate, last in the flow - below the fold: at 844x390 it started
   245px down, and with a keyboard-shrunk viewport GENERATE CARDS was off-screen
   entirely (queue rows 211, 212). It read as a dead end rather than as
   something scrollable, because scrollTop is 0 on open and iOS overlay
   scrollbars stay invisible until touched.
   So the scroll moved INSIDE: everything above the primary scrolls in
   .sheetbody and the primary (with DELETE THIS DECK, which follows it on the
   Edit path) sits in the fixed remainder below. A reserved footer, not a
   sticky one: a sticky primary would sit ON TOP of the palette swatches at
   rest, which is a covered 44px target and no better than a hidden button.
   min-height:0 is load-bearing - without it a flex item refuses to shrink
   below its content and the footer is pushed out of the cap again.
   .sheetsurf keeps overflow-y:auto as the backstop for the degenerate case
   where the footer alone exceeds the cap. */
.sheetbody{min-height:0; overflow-y:auto;
  display:flex; flex-direction:column; gap:9px}
.sheetlabel{font:600 9.5px/1.5 "Nunito Sans"; letter-spacing:.13em; color:#a79d8b;
  text-transform:uppercase}
/* ---- the preset row (Phase 6). Six seeds, one tap from a parsed scale.
   Secondaries, like every other control that is not #scale-generate: the row
   wraps rather than scrolls, so nothing is off-screen at 380px. */
#scale-presets-row{display:flex; flex-direction:column; gap:9px}
#scale-presets{display:flex; flex-wrap:wrap; gap:6px}
#scale-presets .preset{min-height:44px; padding:6px 10px; cursor:pointer;
  border:1px solid #433b2c; border-radius:8px; background:#151310; color:#c4bcab;
  font-family:Bitter, serif; font-weight:400; font-size:13px}
#scale-box{width:100%; min-height:44px; padding:10px 12px; color:#eae6df;
  font-family:Bitter, serif; font-weight:400; font-size:16px;
  background:#151310; border:1px solid #433b2c; border-radius:8px}
#scale-box.bad{border-color:#E27005}
#scale-parse{font-family:Bitter, serif; font-weight:400; font-size:12px; line-height:1.45;
  color:#c4bcab; overflow-wrap:anywhere}
/* The pan mock sits on a light plate because the pan is drawn in card ink -
   black rim, #242424 labels - and the sheet surface is dark. Capped so the
   whole sheet still fits a 380px phone without the preview pushing GENERATE
   CARDS below the fold. */
#scale-preview{align-self:center; width:100%; max-width:184px; padding:8px;
  border-radius:12px; background:#f1ece1; border:1px solid #433b2c}
#scale-preview svg{display:block; width:100%; height:auto}
#scale-msg{font:400 11.5px/1.45 "Nunito Sans"; min-height:1.45em; color:#c4bcab;
  overflow-wrap:anywhere}
#scale-msg.err, .announce.err{color:#E27005}
#scale-msg.warn, .announce.warn{color:#e3b25c}
#scale-msg.ok, .announce.ok{color:#a4c9a0}
.ctlrow{display:flex; align-items:center; justify-content:space-between; gap:10px;
  flex-wrap:wrap}
.mirror{display:flex; gap:8px}
.mirror .mode{min-height:44px}
#scale-swatches{display:flex; gap:10px; align-items:center}
#scale-swatches .dot{width:14px; height:14px; border-radius:50%; border:none; padding:0;
  position:relative; cursor:pointer;
  background:linear-gradient(180deg,var(--dga) 0 50%,var(--dgb) 50% 100%)}
/* 14px is the spec'd size, so the 44px hit area is an invisible overlay. */
#scale-swatches .dot::after{content:""; position:absolute; left:50%; top:50%;
  width:44px; height:44px; transform:translate(-50%,-50%)}
#scale-swatches .dot.sel{box-shadow:0 0 0 2px #f1ece1}
#scale-generate{width:100%; min-height:44px; border-radius:8px; cursor:pointer;
  border:1px solid #f1ece1; background:#f1ece1; color:#272219;
  font:600 10.5px/1 "Nunito Sans"; letter-spacing:.08em}
#scale-generate:disabled{opacity:.5; cursor:default}
/* ---- Edit state (Phase 4). The rows below are the ONLY difference between
   the create sheet and the Edit sheet; SAVE CHANGES reuses #scale-generate so
   there is never a second primary button on the surface. */
.editrow{display:flex; flex-direction:column; gap:9px}
#scale-name, #scale-degrees{width:100%; min-height:44px; padding:10px 12px; color:#eae6df;
  background:#151310; border:1px solid #433b2c; border-radius:8px}
#scale-name{font-family:Bitter, serif; font-weight:400; font-size:16px}
#scale-degrees{font:400 16px/1.2 "Nunito Sans"}
/* ---- LAYOUT correction (Phase 5). Every control here is a SECONDARY: the
   sheet's only full-width primary stays #scale-generate. The slot list is a
   single tab stop with a roving tabindex, so a keyboard reaches it in one Tab
   and moves inside it with the arrow keys - there is no drag-only path. */
#scale-layout-row .ctlrow{gap:8px}
#scale-slots{display:flex; flex-wrap:wrap; gap:6px}
#scale-slots .slot{min-width:44px; min-height:44px; padding:6px 8px; cursor:pointer;
  border:1px solid #433b2c; border-radius:8px; background:#151310; color:#c4bcab;
  font-family:Bitter, serif; font-weight:400; font-size:13px}
#scale-slots .slot[aria-pressed="true"]{border-color:#f1ece1; color:#f1ece1}
#scale-layout-reset{background:none; border:none; color:#a79d8b; cursor:pointer;
  min-height:44px; padding:0 4px;
  font:600 9.5px/1.5 "Nunito Sans"; letter-spacing:.13em; text-transform:uppercase}
/* Quiet, never a primary: auto width, so the sheet's only full-width button
   stays #scale-generate. */
#scale-delete-row{align-items:center}
#scale-delete{width:auto; min-height:44px; padding:12px 14px; background:none; border:none;
  color:#a79d8b; font:600 9.5px/1.5 "Nunito Sans"; letter-spacing:.13em;
  text-transform:uppercase; cursor:pointer}
.announce{width:100%; max-width:520px; margin-top:8px; text-align:center;
  font:400 11.5px/1.45 "Nunito Sans"; color:#c4bcab; min-height:1.45em}
</style>
</head>
<body>
<header>
  <h1>Handpan Chord Cards</h1>
  <div class="deckrow">
    <nav class="decks" id="decks"></nav>
    <button class="chip add" type="button" id="deck-add" aria-haspopup="dialog">+ ADD</button>
  </div>
  <div class="modebar">
    <button class="mode on" id="modeA">NAME &rarr; NOTES</button>
    <button class="mode" id="modeB">NOTES &rarr; NAME</button>
  </div>
</header>

<main>
  <div class="scene">
    <div class="card" id="card" role="button" aria-label="Flip card" tabindex="0">
      <div class="face front" id="front"></div>
      <div class="face back" id="back"></div>
    </div>
  </div>
</main>

<footer>
  <button class="nav" id="prev" aria-label="Previous card">&larr;</button>
  <div class="mid">
    <div class="count" id="count"></div>
    <button class="shuffle" id="shuffle">Shuffle: off</button>
  </div>
  <button class="nav" id="next" aria-label="Next card">&rarr;</button>
</footer>

<!-- The practice-screen live region. It is a sibling of the landmarks the
     sheet makes inert, so a success message announced as the sheet closes is
     still read out. -->
<div class="announce" role="status" aria-live="polite"></div>

<div id="scale-sheet" role="dialog" aria-modal="true" aria-label="Add a scale" hidden>
  <div class="sheetsurf">
   <!-- The scrolling part. The primary below it is deliberately OUTSIDE, so it
        cannot be pushed under the fold by a tall Edit sheet or a short
        viewport - see .sheetbody in the stylesheet. DOM order is unchanged. -->
   <div class="sheetbody">
    <div class="editrow" id="scale-name-row" hidden>
      <label class="sheetlabel" for="scale-name">DECK NAME</label>
      <input id="scale-name" type="text" autocapitalize="characters" autocorrect="off"
             autocomplete="off" spellcheck="false" maxlength="40">
    </div>
    <!-- Phase 6: six INLINED seeds. A tap fills the box below and nothing else -
         the deck is auto-named from its fields like any typed scale. Create
         path only: from Edit, one tap would overwrite the deck's fields. -->
    <div id="scale-presets-row">
      <span class="sheetlabel" id="scale-presets-label">PRESETS</span>
      <div id="scale-presets" role="group" aria-labelledby="scale-presets-label"></div>
    </div>
    <label class="sheetlabel" for="scale-box">SCALE: DING, THEN TOP NOTES, | BOTTOM NOTES</label>
    <input id="scale-box" type="text" autocapitalize="off" autocorrect="off"
           autocomplete="off" spellcheck="false" enterkeyhint="go"
           placeholder="(D) A C D E F G A C">
    <div id="scale-parse"></div>
    <!-- The pan mock: where the notes actually land - ding, rim zig-zag, inner
         pair, dashed bottom ring in x-ray view - drawn by the SAME pan()
         renderer the cards use, with no chord chosen, so what is previewed
         cannot drift from what GENERATE CARDS produces. -->
    <div id="scale-preview" role="img"
         aria-label="Preview of where the notes sit on the pan" hidden></div>
    <!-- Above the control row, so the soft keyboard never covers it. -->
    <div id="scale-msg" aria-live="polite"></div>
    <!-- D10: the parent-scale override. Edit path only - the create path infers. -->
    <div class="editrow" id="scale-degrees-row" hidden>
      <label class="sheetlabel" for="scale-degrees">DEGREES</label>
      <select id="scale-degrees"></select>
    </div>
    <!-- D5: the generated layout is a guess; this corrects it. Edit path only -
         there is nothing to correct until a pan has been solved. -->
    <div class="editrow" id="scale-layout-row" hidden>
      <span class="sheetlabel" id="scale-layout-label">LAYOUT</span>
      <div class="ctlrow">
        <div class="mirror" role="group" aria-labelledby="scale-layout-label">
          <button class="mode" type="button" id="scale-rot-l"
                  aria-label="Rotate the rim one position back">ROTATE &larr;</button>
          <button class="mode" type="button" id="scale-rot-r"
                  aria-label="Rotate the rim one position on">ROTATE &rarr;</button>
        </div>
        <button id="scale-layout-reset" type="button"
                aria-label="Reset the layout to the generated one">RESET</button>
      </div>
      <div id="scale-slots" role="group"
           aria-label="Notes in layout order. Use the arrow keys to choose one."></div>
      <div class="mirror">
        <button class="mode" type="button" id="scale-move-l"
                aria-label="Move the chosen note one position back">MOVE &larr;</button>
        <button class="mode" type="button" id="scale-move-r"
                aria-label="Move the chosen note one position on">MOVE &rarr;</button>
      </div>
    </div>
   </div>
    <!-- Outside .sheetbody, with the primary: the palette swatches carry their
         44px hit area as an invisible ::after overlay that is LARGER than the
         14px dot, and a scroll container would clip it (a scrolling box cannot
         paint or hit-test outside itself). Keeping the row here also keeps the
         mirror toggle beside the button it affects. DOM order is unchanged. -->
    <div class="ctlrow">
      <div class="mirror">
        <button class="mode" type="button" id="scale-mirror-l" aria-pressed="false">LEFT-FIRST</button>
        <button class="mode on" type="button" id="scale-mirror-r" aria-pressed="true">RIGHT-FIRST</button>
      </div>
      <div id="scale-swatches" role="group" aria-label="Card palette"></div>
    </div>
    <button id="scale-generate" type="button" disabled>GENERATE CARDS</button>
    <div class="editrow" id="scale-delete-row" hidden>
      <button id="scale-delete" type="button">DELETE THIS DECK</button>
    </div>
  </div>
</div>

<!-- The scale engine, inlined verbatim from src/engine/*.js. The app is
     single-file by contract, so these are copies rather than external script
     references: index.html ships with the engine already in it and needs no
     build. Re-sync after an engine change with
     `python3 tools/inline_engine.py`; `python3 tools/validate.py` fails when
     a region has drifted from its module. -->
<!-- engine begin -->
<!-- engine:core begin - synced from src/engine/core.js by tools/inline_engine.py; edit the module, not this copy -->
<script>
/* HPE.core - the D13 seed parser shared by every engine lane and by the app.
 *
 * Plain script, no module wrapper: index.html is a single self-contained file
 * by contract, so this text has to be inlinable verbatim. `var`, not `const`,
 * so the namespace lands on the global object of a node:vm context too.
 *
 * Normative source: docs/ENGINE-SPEC.md sections 1-4, 12, 13, 16 and 17.
 */
var HPE = (typeof HPE !== "undefined") ? HPE : {};

(function (HPE) {
  "use strict";

  /* ---- section 2: the code enum and its reason strings, verbatim -------- */

  var REASONS = {
    NO_DING: {
      kind: "error",
      reason: "No ding. Start with the ding note, e.g. (D) or D/."
    },
    NO_FIFTH: {
      kind: "error",
      reason: "No perfect fifth above the ding <X>. Add a <fifth of X>, or check the ding."
    },
    TOO_MANY_RIM: {
      kind: "error",
      reason: "Too many notes for one pan: at most 11 rim, 2 inner and 6 bottom."
    },
    BAD_NOTE: {
      kind: "error",
      reason: "<X> is not a note. Use names like C, F#, Bb, with an optional octave."
    },
    NEEDS_NEWER_APP: {
      kind: "error",
      reason: "This link needs a newer version of the app. Reload."
    },
    NO_THIRDS: {
      kind: "warning",
      reason: "No 3rds on this pan: only power chords and sus chords."
    }
  };

  var LETTERS = "CDEFGAB";
  var SEMITONES = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  var ACCIDENTAL = { "": 0, "#": 1, b: -1 };

  var RIM_MAX = 11;
  var INNER_MAX = 2;
  var BOTTOM_MAX = 6;
  var TOP_MAX = RIM_MAX + INNER_MAX;

  var NOTE_RE = /^([A-G])(#|b)?([0-9])?$/;
  var INNER_MARK = "/";
  var DEFAULT_OPTIONS = { palette: 0, parent: null, name: "", mirror: false };

  /* ---- small helpers ---------------------------------------------------- */

  function pitchClass(midi) {
    return ((midi % 12) + 12) % 12;

/* ---------------- state ---------------- */
// Two storage keys, deliberately separate. "hpfc" is the small settings object
// (which deck, which mode) and is SHARED with whatever a later feature adds to
// it, so save() reads-modifies-writes rather than replacing it. Saved scales
// are a list, own their own key, and hold the SEED - the canonical scale string
// plus its options - never the built deck, which is derived (D14).
const STORE_KEY = "hpfc";
const SCALES_KEY = "hpfc.scales";
const readStore = key => { try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; } };
let store = readStore(STORE_KEY) || {};
if (typeof store !== "object" || Array.isArray(store)) store = {};
// Both reads are TYPE-guarded, not just truthiness-guarded: "hpfc" is shared,
// so a sibling feature (or a hand-edited value) can leave any JSON type here,
// and a non-string id that reached the boot tail would throw on .indexOf and
// take the share-link handler at the end of the script down with it.
let deckId = typeof store.deck === "string" ? store.deck : "hijaz";
let storedDeck = deckId;              // built-in or custom:; see save()
let mode   = typeof store.mode === "string" ? store.mode : "A";  // A: name->notes, B: notes->name
let shuffled = false;
let order = [], idx = 0, flipped = false;

// Generated decks live here, keyed by deck id, so the DECKS literal above stays
// the three built-ins on one line (tools/validate.py and tests/paths.py both
// need that). deck() resolves a custom id out of the registry; it never builds.
const CUSTOM = Object.create(null);

const deck = () => CUSTOM[deckId] || DECKS.find(d => d.id === deckId) || DECKS[0];
// Any deck id persists, built-in or custom: a custom deck is rebuilt at boot
// from its saved seed, so restoring one is no longer a dangling reference.
// READ-MODIFY-WRITE: "hpfc" is one object shared with whatever else stores
// settings there, so writing our two keys must not drop a sibling's.
const save = () => {
  try {
    const base = readStore(STORE_KEY);
    const next = (base && typeof base === "object" && !Array.isArray(base)) ? base : {};
    next.deck = storedDeck;
    next.mode = mode;
    localStorage.setItem(STORE_KEY, JSON.stringify(next));
  } catch (e) {}
};

/* ---------------- generated decks ---------------- */
// Generation runs ONCE, here, at submit - never inside deck() or render()
// (ENGINE-SPEC section 11). generateDeck returns the engine's result shape
// unchanged: {ok:true, value, warnings} or {ok:false, code, reason}.
const isBuiltIn = id => DECKS.some(d => d.id === id);
const registerDeck = d => (CUSTOM[d.id] = d);
// Queue row 73, the owner's "edit means edit". A field edit necessarily mints a
// new id (D14 hashes the fields), and the OLD deck goes: it is dropped from the
// registry and the replacement is re-inserted AT ITS POSITION, because chip
// order is the registry's insertion order. Re-keying an object in place is not
// possible, so the registry is rebuilt - it holds a handful of entries.
// Queue row 144, belt and braces: the loop below DROPS whatever already sits at
// `next.id`, so the primitive refuses when some OTHER deck sits there - the
// entry generateDeck just wrote for `next` itself is not a collision - instead
// of trusting every caller to have checked first. Today
// the only caller that can collide sits behind the row-131 guard, so this
// changes nothing a user can see; it is here so that a future caller cannot
// reintroduce row 131 silently. Returns whether the replacement happened.
function replaceRegistered(oldId, next) {
  const sitting = next.id !== oldId ? CUSTOM[next.id] : null;
  if (sitting && sitting !== next) return false;
  const was = Object.entries(CUSTOM);
  for (const k of Object.keys(CUSTOM)) delete CUSTOM[k];
  let placed = false;
  for (const [k, v] of was) {
    if (k === oldId) { CUSTOM[next.id] = next; placed = true; }
    else if (k !== next.id) CUSTOM[k] = v;
  }
  if (!placed) CUSTOM[next.id] = next;
  return true;
}
// `guard` is an optional veto consulted with the PARSED seed, between the parse
// and the build: it is how the submit path can refuse a save without a second
// parse, a second build (13A pins exactly one) or any registry write. It returns
// a falsy value to let generation run, or the result to return instead.
function generateDeck(text, options, guard) {
  const seed = HPE.core.parseSeed(text, options);
  if (!seed.ok) return seed;
  const vetoed = guard ? guard(seed.value) : null;
  if (vetoed) return vetoed;
  const built = HPE.select.build(seed.value);
  if (!built.ok) return built;
  // select.build resolves the palette, mirror and parent onto deck.options but
  // consumes the NAME (section 13 makes it the deck's name and drops it from
  // the options). The name is a seed option that has to travel - into the share
  // URL and into the saved record - so the app carries it back, which is why a
  // rename survives a reload while the id, which hashes fields only, does not
  // move (D14).
  if (seed.value.options.name) built.value.options.name = seed.value.options.name;
  // The layout correction (D5-1/D5-2) is the same story one step further on:
  // core.parseSeed's option whitelist drops `order`, and select.build solves the
  // GENERATED layout knowing nothing about it, so the correction is applied here
  // - to the field-to-slot assignment only, which is what layout.solve does with
  // it - and carried back onto the options so it travels. The id hashes the
  // fields alone, so a correction never moves it (D14, D5-5).
  const wanted = options && options.order !== undefined && options.order !== null
    ? options.order : null;
  if (wanted !== null) {
    const moved = HPE.layout.solve({ fields: seed.value.fields, options: {} },
                                   { mirror: !!built.value.options.mirror, order: wanted });
    if (!moved.ok) return moved;
    for (const id of Object.keys(moved.value.fields)) {
      if (built.value.fields[id]) built.value.fields[id][4] = moved.value.fields[id][4];
    }
    built.value.options.order = wanted;
  }
  registerDeck(built.value);
  return built;
}
/* ---------------- share links ---------------- */
// ONE version number, the engine's. Restating it here as a literal would go
// silently wrong the day either side is bumped, and every existing link would
// break, so it is DERIVED and never re-declared.
const SHARE_VERSION = HPE.share.VERSION;
const engineErr = code => ({ ok: false, code, reason: HPE.core.REASONS[code].reason });
// A thin guard over an ALREADY-DECODED numeric version - HPE.share.decode does
// its own version check on the wire format (share.js step 2), so this is the
// guard for versions the app reads back out of storage, never a second parser.
// A version that is not a finite number is untrusted junk, not a newer app: the
// section 2 enum is closed and BAD_NOTE is its rejection for malformed input.
function checkShareVersion(v) {
  if (typeof v !== "number" || !isFinite(v)) {
    return { ok: false, code: "BAD_NOTE",
             reason: HPE.core.REASONS.BAD_NOTE.reason.split("<X>").join(String(v).slice(0, 12)) };
  }
  return v > SHARE_VERSION ? engineErr("NEEDS_NEWER_APP") : { ok: true, value: v };
}

// D14: what travels is the SEED, never the generated deck, so an old link
// renders NEW cards once the engine improves.
const seedOf = d => ({ fields: d.fields, options: d.options });
const SHARE_PREFIX = "#s=";
function shareLink(d) {
  const res = HPE.share.encode(seedOf(d));
  return res.ok
    ? { ok: true, value: location.origin + location.pathname + SHARE_PREFIX + res.value }
    : res;
}
// The app's ONE entry point for an untrusted share string. It rejects rather
// than repairs (the single validator is core.parseSeed, reached through
// share.decode) and surfaces the engine's own reason verbatim - nothing here
// composes a sentence of its own (ENGINE-SPEC sections 1 and 2).
function openShare(text) {
  const res = HPE.share.decode(String(text));
  if (!res.ok) { say(res.reason, "err"); return res; }
  // Generation runs ONCE per restore, here, exactly as submit does (section 11).
  const built = generateDeck(HPE.core.formatSeed(res.value.fields), res.value.options);
  if (!built.ok) { say(built.reason, "err"); return built; }
  rememberScale(res.value);
  selectDeck(built.value.id);
  return built;
}

/* ---------------- saved scales ---------------- */
// A list of seed records under SCALES_KEY, each {v, s, o}: the format version,
// the canonical scale string and the seed options. Rebuilt into CUSTOM at boot,
// so a custom deck survives a reload.
function savedScales() {
  const raw = readStore(SCALES_KEY);
  return Array.isArray(raw) ? raw : [];
}
function writeScales(list) {
  try { localStorage.setItem(SCALES_KEY, JSON.stringify(list)); } catch (e) {}
}
// Queue row 132: an EXISTING record is rewritten AT ITS INDEX, and only a
// genuinely new one is appended. restoreScales rebuilds the registry in list
// order, so the index is the chip position across a reload - filtering the old
// record out and pushing the new one would send an options-only edit to the end
// of the row on the next boot while it sat in place until then.
function rememberScale(seed) {
  const rec = { v: SHARE_VERSION, s: HPE.core.formatSeed(seed.fields), o: seed.options };
  const out = [];
  let placed = false;
  for (const r of savedScales()) {
    if (r && r.s === rec.s) { if (!placed) { out.push(rec); placed = true; } }
    else out.push(r);                     // a duplicate of the key is collapsed
  }
  if (!placed) out.push(rec);
  writeScales(out);
}
// The canonical scale string IS the record's key (D14: the id is its hash), so
// dropping the record is a filter on that string and nothing has to look the
// deck up a second time.
function forgetScale(str) {
  writeScales(savedScales().filter(r => !r || r.s !== str));
}
// Queue row 73: editing the NOTES replaces the deck, so the old record leaves
// storage and the new one takes ITS INDEX - restoreScales rebuilds the registry
// in list order, so the index is what carries the chip position across a
// reload. Appending would move the deck to the end of the row on the next boot
// while it sat in place until then.
function replaceScale(oldStr, seed) {
  const rec = { v: SHARE_VERSION, s: HPE.core.formatSeed(seed.fields), o: seed.options };
  const list = savedScales();
  const at = list.findIndex(r => r && r.s === oldStr);
  if (at < 0) { rememberScale(seed); return; }
  const out = [];
  list.forEach((r, i) => {
    if (i === at) out.push(rec);
    else if (!r || r.s !== rec.s) out.push(r);   // never a duplicate of the new record
  });
  writeScales(out);
}
// Boot must stay resilient: an unusable record is DROPPED, never fatal.
function restoreScales() {
  for (const rec of savedScales()) {
    try {
      if (!rec || typeof rec !== "object" || typeof rec.s !== "string") continue;
      if (!checkShareVersion(rec.v).ok) continue;
      generateDeck(rec.s, rec.o || undefined);
    } catch (e) {}
  }
}

function selectDeck(id) {
  deckId = id;
  storedDeck = id;
  save(); setOrder(); buildChips(); render();
}

/* ---------------- helpers ---------------- */
const pc = (d, f) => d.fields[f][2] % 12;
function chordSets(d, ch) {
  const pcs = new Set(ch.fields.map(f => pc(d, f)));
  const rpc = pc(d, ch.roots[0]);
  const blue = new Set(), green = new Set();
  for (const f in d.fields) {
    const p = pc(d, +f);
    if (p === rpc) blue.add(+f);
    else if (pcs.has(p)) green.add(+f);
  }
  return { blue, green, rpc };
}
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* ---------------- SVG pan ---------------- */

  // uses: no chord has been chosen there, so every field draws in its
  // unlit state. The card path always passes a chord and is unaffected.
  const { blue, green } = ch ? chordSets(d, ch) : { blue: new Set(), green: new Set() };
  const C = d.colors;

  // the built-in geom literals have no ext key, so they keep the derivation.

            : hasBottom ? R * (g.bottom + g.r_bnote + g.n_out) + 14 : R * 1.06;

  if (hasBottom)
    s += `<circle r="${R*g.bottom}" fill="none" stroke="#e2e2e2" stroke-width="1.4" stroke-dasharray="4 4"/>`;
  s += `<circle r="${R}" fill="none" stroke="#000" stroke-width="2"/>`;
  if (g.inner_ring)
    s += `<circle r="${R*g.inner_ring}" fill="none" stroke="#000" stroke-width="1"/>`;

  function field(x, y, r, id, isBottom) {
    const st = blue.has(id) ? "root" : green.has(id) ? "tone" : isBottom ? "offb" : "off";
    let out = "";
    if (st === "offb")
      out += `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="3 3"/>`;
    else
      out += `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="#000" stroke-width="1.1"/>`;
    if (st === "root" || st === "tone") {
      out += `<circle cx="${x}" cy="${y}" r="${r*0.87}" fill="none" stroke="${st==="root"?C.root:C.tone}" stroke-width="${r*0.24}"/>`;
      out += `<circle cx="${x}" cy="${y}" r="${r*0.74}" fill="none" stroke="#000" stroke-width="0.9"/>`;
    }
    return out;
  }
  function label(x, y, name, oct, fs, col) {
    return `<text x="${x}" y="${y + fs*0.34}" text-anchor="middle" fill="${col}"
      font-family="Nunito Sans, sans-serif" font-size="${fs}">${esc(name)}<tspan
      font-size="${fs*0.66}" dy="${fs*0.18}">${oct}</tspan></text>`;
  }

  for (const fid in d.fields) {
    const id = +fid;
    const [name, oct, , zone, ang, lab] = d.fields[fid];
    if (zone === "ding") {
      const dy = (g.ding_dy || 0) * R, rr = R * g.r_ding;
      s += field(0, dy, rr, id, false);
      s += label(0, dy, name, oct, R * g.f_ding * 1.05, "#242424");
      continue;
    }
    const isB = zone === "bottom";
    const orb = R * (isB ? g.bottom : zone === "inner" ? g.inner : g.rim);
    const rr  = R * (isB ? g.r_bnote : g.r_note);
    const [x, y] = P(orb, ang);
    s += field(x, y, rr, id, isB);
    const lit = blue.has(id) || green.has(id);
    s += label(x, y, name, oct, R * (isB ? g.f_bnote : g.f_note) * 1.05,
               isB && !lit ? "#8a8a8a" : "#242424");
    // numbers
    let nr, col, fs = R * g.f_num;
    if (isB) { nr = orb + rr + R * g.n_out; col = "#E27005"; }
    else if (zone === "rim" && g.rim_num_out) { nr = orb + rr + R * g.n_in; col = "#333"; }
    else { nr = orb - rr - R * g.n_in; col = "#333"; }
    const [nx, ny] = P(nr, ang);
    s += `<text x="${nx}" y="${ny + fs*0.34}" text-anchor="middle" fill="${col}"
      font-family="Nunito Sans, sans-serif" font-weight="${isB?600:400}" font-size="${fs}">${lab}</text>`;
  }
  return s + "</svg>";
}

/* ---------------- card faces ---------------- */
function headerHTML(d, ch, n) {
  const deg = d.degrees[String(pc(d, ch.roots[0]))] || "";
  return `<div class="hdr">
    <div class="l">${esc(d.name)}<br><span class="num">#${n}</span>
      ${deg ? `&nbsp;<span class="deg">${esc(deg)}</span>` : ""}</div>
    <div class="r">${esc(ch.subtitle)}</div></div>`;
}
function nameHTML(ch, big) {
  const len = (ch.main + ch.sup).length;
  const size = big ? `clamp(34px, ${Math.min(19, 120/len)}vw, ${len > 7 ? 64 : 92}px)` : "inherit";
  return `<div class="bigname" style="font-size:${size}">${esc(ch.main)}${ch.sup ? `<sup>${esc(ch.sup)}</sup>` : ""}</div>`;
}
function linesHTML(d, ch) {
  const C = d.colors, rpc = pc(d, ch.roots[0]);
  const seg = (arr, render) => arr.map(render).join(`<span class="sepc"> - </span>`);
  const notes = seg(ch.fields, f => {
    const [nm, oc] = d.fields[f];
    const col = pc(d, f) === rpc ? C.root : C.tone;
    return `<span style="color:${col}">${esc(nm)}<sub>${oc}</sub></span>`;
  });
  const nums = seg(ch.fields, f => {
    const col = pc(d, f) === rpc ? C.root : C.tone;
    return `<span style="color:${col}">${esc(d.fields[f][5])}</span>`;
  });
  const nb = ch.fields.filter(f => d.fields[f][3] === "bottom").length;
  return `<div class="lines">
    ${nb ? `<div class="badge">${nb} BOTTOM NOTE${nb > 1 ? "S" : ""}</div>` : ""}
    <div class="notesline">${notes}</div>
    <div class="numline">${nums}</div></div>`;
}
function render() {
  if (!order.length) return;
  const d = deck(), n = order[idx] + 1, ch = d.chords[order[idx]];
  document.documentElement.style.setProperty("--root", d.colors.root);
  document.documentElement.style.setProperty("--tone", d.colors.tone);
  document.documentElement.style.setProperty("--ga", d.colors.ga);
  document.documentElement.style.setProperty("--gb", d.colors.gb);

  const answer = headerHTML(d, ch, n) +
    `<div class="diagwrap">${pan(d, ch)}</div>` + linesHTML(d, ch);
  const question = headerHTML(d, ch, n) +
    `<div class="prompt">${nameHTML(ch, true)}
     <div class="hint">Tap to reveal the notes</div></div>`;
  const questionB = headerHTML(d, { ...ch, subtitle: "WHICH CHORD IS THIS?" }, n) +
    `<div class="diagwrap">${pan(d, ch)}</div>
     <div class="lines"><div class="hint" style="margin:0 0 12px">Tap to reveal the name</div></div>`;
  const answerB = headerHTML(d, ch, n) +
    `<div class="prompt">${nameHTML(ch, true)}</div>` + linesHTML(d, ch);

  document.getElementById("front").innerHTML = mode === "A" ? question : questionB;
  document.getElementById("back").innerHTML  = mode === "A" ? answer   : answerB;
  document.getElementById("count").textContent = `${idx + 1} / ${order.length}`;
  document.getElementById("card").classList.toggle("flip", flipped);
}

/* ---------------- deck / order ---------------- */
function setOrder() {
  const n = deck().chords.length;
  order = [...Array(n).keys()];
  if (shuffled) for (let i = n - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]];
  }
  idx = 0; flipped = false;
}
// Built-ins first, then generated decks in the order they were made.
const allDecks = () => [...DECKS, ...Object.values(CUSTOM)];
// [5A] chip labels are capped at 16 characters with an ellipsis.
const CHIP_CAP = 16;
const chipLabel = n => (n.length > CHIP_CAP ? n.slice(0, CHIP_CAP - 1) + "…" : n);

function buildChips() {
  const nav = document.getElementById("decks");
  nav.innerHTML = "";
  let active = null;
  for (const d of allDecks()) {
    const b = document.createElement("button");
    b.type = "button";

    b.style.setProperty("--dga", d.colors.ga);
    b.style.setProperty("--dgb", d.colors.gb);
    b.innerHTML = `<span class="dot"></span>${esc(chipLabel(d.name))}`;
    // [design-review 7A] the ALREADY-SELECTED custom chip is the one and only
    // way into the Edit sheet; every other chip just selects its deck. No
    // context menu, no long press, no swipe.
    b.onclick = () => (d.id === deckId && CUSTOM[d.id])

  if (active && active.scrollIntoView) active.scrollIntoView({ block: "nearest", inline: "nearest" });
}

];
const LAYOUT_HINT = "Layout is a guess. Tap LEFT-FIRST / RIGHT-FIRST if your pan is mirrored.";
const sheet     = document.getElementById("scale-sheet");
const scaleBox  = document.getElementById("scale-box");
const parseLine = document.getElementById("scale-parse");
const previewBox = document.getElementById("scale-preview");

const nameBox   = document.getElementById("scale-name");

// The Phase 5 LAYOUT section. Secondaries only: the sheet's single primary is

const rotR      = document.getElementById("scale-rot-r");

const moveL     = document.getElementById("scale-move-l");
const moveR     = document.getElementById("scale-move-r");

// The practice screen's own live region; created if the markup lost it, so the

announce.className = "announce";

// The landmarks behind the sheet. inert while it is open, so the modal really
// is modal: nothing behind it is clickable, focusable or read by a screen
// reader, and Generate is the only enabled primary button on the page.
const background = [...document.querySelectorAll("header, main, footer")];

let palette = 0;                 // D6 index 0-5
let mirror = false;              // section 13: false = right-first (the default)
let sheetOpen = false;
let editingId = null;            // the custom deck the sheet is editing, or null
let sheetOpener = null;          // the control focus returns to on close
// Queue row 133: whether the user has TYPED in the name box since the sheet
// prefilled it. String equality against the auto name cannot tell "never
// touched the box" from "typed exactly that", and a user who deliberately types
// the auto label must keep it as a real name.
let nameDirty = false;
// D5. `layoutOrder` is the user's correction of the generated layout: a
// permutation over the non-ding fields, in the order layout.solve collects
// them, saying which field takes which solved slot. NULL means ABSENT - the
// generated layout - and never an identity permutation, so a pan that was
// never corrected keeps exactly the share string it had (D5-1, D5-3).
let layoutOrder = null;
let layoutSel = 0;               // the position the slot list has chosen
// The live preview is painted straight onto the deck behind the sheet, so
// closing without saving has to put the generated angles back.
let layoutPreviewOf = null;
let layoutPreviewFields = null;
const generated = new Set();     // deck ids generated in this page session

/** The one adapter from a result/warning reason to a message tier. */

function buildSwatches() {

// A preset fills the SCALE BOX and nothing else. It sets no deck name and never
// touches nameDirty, so the deck is auto-named by section 13 exactly as a typed
// scale is - which keeps preset LABELS out of the deck-name space entirely.
function applyPreset(p) {
  scaleBox.value = p.seed;
  // The same live parse a keystroke fires: the event the box already listens
  // for, never a second call to the parse logic from here.
  scaleBox.dispatchEvent(new Event("input", { bubbles: true }));

}
// The row is static, so it is built once. Labels go in through textContent -

function setMirror(left) {

  mirrorL.classList.toggle("on", left);
  mirrorR.classList.toggle("on", !left);
  mirrorL.setAttribute("aria-pressed", String(left));
  mirrorR.setAttribute("aria-pressed", String(!left));
}

/** "Ding D3 | 1 A3 2 C4 ..." - the ding, then every field under its label. */
function parseLineText(fields) {
  const ids = Object.keys(fields).map(Number).sort((a, b) => a - b);
  const part = id => {
    const [name, oct, , zone, , label] = fields[id];
    return (zone === "ding" ? "Ding" : label) + " " + name + oct;
  };
  const ding = ids.filter(i => fields[i][3] === "ding");
  const rest = ids.filter(i => fields[i][3] !== "ding");
  const head = ding.map(part).join(" ");
  return rest.length ? head + " | " + rest.map(part).join(" ") : head;
}

/** The D10 parent candidates, in the engine's FIXED list order (section 10). */
function buildDegrees(selected) {
  degSel.innerHTML = "";
  HPE.naming.PARENTS.forEach((p, i) => {
    const o = document.createElement("option");
    o.value = String(i);
    o.textContent = p.name;        // text position, so nothing is interpolated
    degSel.appendChild(o);
  });
  degSel.value = String(selected);
}

/* ---- the LAYOUT correction (D5) ----
 * The generated layout is a GUESS, and LAYOUT_HINT says so; this is how it is
 * corrected. Everything works from the keyboard: ROTATE and MOVE are ordinary
 * buttons, and the slot list is ONE tab stop with a roving tabindex whose arrow
 * keys choose a position - there is no drag-only path to any of it. */

/** The non-ding field ids in the order layout.solve assigns slots. */
function layoutIds(fields) {
  const of = (z) => Object.keys(fields).filter((id) => fields[id][3] === z)
    .sort((a, b) => Number(a) - Number(b));
  return [...of("rim"), ...of("inner"), ...of("bottom")];
}
const identityOrder = (n) => Array.from({ length: n }, (_, i) => i);
/** at[slot] = the field sitting in that slot - the inverse of an order. */
function slotOccupants(order) {
  const at = [];
  order.forEach((slot, i) => { at[slot] = i; });
  return at;
}
function orderFromSlots(at) {
  const out = [];
  at.forEach((field, slot) => { out[field] = slot; });
  return out;
}
/** ABSENT, never the identity: a correction that undoes itself is no correction. */
function setLayoutOrder(next) {
  layoutOrder = next.every((slot, i) => slot === i) ? null : next;
}
const editedDeck = () => (editingId ? CUSTOM[editingId] : null) || null;
/** The half-open slot range of the zone a slot belongs to. */
function zoneBlock(fields, slot) {
  const count = (z) => Object.keys(fields).filter((id) => fields[id][3] === z).length;
  const rim = count("rim");
  const inner = count("inner");
  const n = layoutIds(fields).length;
  for (const [a, b] of [[0, rim], [rim, rim + inner], [rim + inner, n]]) {
    if (slot >= a && slot < b) return [a, b];
  }
  return [0, 0];
}
const wrap = (i, a, span) => a + (((i - a) % span) + span) % span;

/** One control per solved position, showing the note that sits in it. */
function buildSlots() {
  slotsBox.innerHTML = "";
  const d = editedDeck();
  if (!d) return;
  const ids = layoutIds(d.fields);
  const n = ids.length;
  if (layoutOrder && layoutOrder.length !== n) layoutOrder = null;
  if (layoutSel >= n) layoutSel = 0;
  const at = slotOccupants(layoutOrder || identityOrder(n));
  for (let slot = 0; slot < n; slot += 1) {
    const f = d.fields[ids[at[slot]]];
    const note = f[0] + f[1];
    const b = document.createElement("button");
    b.type = "button";
    b.id = "scale-slot-" + slot;
    b.className = "slot";
    b.textContent = note;          // text position: nothing is interpolated
    b.setAttribute("aria-pressed", String(slot === layoutSel));
    b.setAttribute("aria-label", "Position " + (slot + 1) + " of " + n + ", " + note);
    b.tabIndex = slot === layoutSel ? 0 : -1;
    b.onclick = () => { layoutSel = slot; buildSlots(); };
    slotsBox.appendChild(b);
  }
}

/** Solve the pan under the sheet's current mirror and correction. */
function solveSheetLayout(order) {
  const d = editedDeck();
  if (!d) return null;
  const res = HPE.layout.solve({ fields: d.fields, options: {} },
                               { mirror: mirror, order: order });
  return res.ok ? res.value : null;
}

// The preview is the real card behind the sheet, re-rendered: the correction is
// only about WHERE a note sits, so nothing but the angles moves.
function previewLayout() {
  const d = editedDeck();
  if (!d) return;
  if (layoutPreviewOf !== editingId) {
    layoutPreviewOf = editingId;
    layoutPreviewFields = JSON.parse(JSON.stringify(d.fields));
  }
  const solved = solveSheetLayout(layoutOrder);
  if (!solved) return;
  for (const id of Object.keys(solved.fields)) {
    if (d.fields[id]) d.fields[id][4] = solved.fields[id][4];
  }
  render();
}
function dropLayoutPreview() {
  layoutPreviewOf = null;
  layoutPreviewFields = null;
}
function restoreLayoutPreview() {
  const d = layoutPreviewOf ? CUSTOM[layoutPreviewOf] : null;
  if (d && layoutPreviewFields) {
    for (const id of Object.keys(layoutPreviewFields)) {
      if (d.fields[id]) d.fields[id][4] = layoutPreviewFields[id][4];
    }
    render();
  }
  dropLayoutPreview();
}

// ROTATE is a cyclic shift of the RIM (D5-1): the whole ring turns, which is
// what a pan whose zig-zag starts somewhere else actually looks like.
function rotateLayout(by) {
  const d = editedDeck();
  if (!d) return;
  const n = layoutIds(d.fields).length;
  const [a, b] = zoneBlock(d.fields, 0);
  const span = b - a;
  if (span < 2) return;
  const at = slotOccupants(layoutOrder || identityOrder(n));
  const next = at.slice();
  for (let j = a; j < b; j += 1) next[wrap(j + by, a, span)] = at[j];
  setLayoutOrder(orderFromSlots(next));
  if (layoutSel >= a && layoutSel < b) layoutSel = wrap(layoutSel + by, a, span);
  buildSlots();
  previewLayout();
}
// MOVE takes the chosen note to the next position, and whatever was there takes
// its place - a swap, so a note is never lost and the result is always still a
// permutation. It stays inside the note's own zone: a rim note is on the rim.
function moveNote(by) {
  const d = editedDeck();
  if (!d) return;
  const n = layoutIds(d.fields).length;
  const [a, b] = zoneBlock(d.fields, layoutSel);
  const span = b - a;
  if (span < 2) return;
  const to = wrap(layoutSel + by, a, span);
  const at = slotOccupants(layoutOrder || identityOrder(n));
  const held = at[layoutSel];
  at[layoutSel] = at[to];
  at[to] = held;
  setLayoutOrder(orderFromSlots(at));
  layoutSel = to;
  buildSlots();
  previewLayout();
}
function resetLayout() {
  layoutOrder = null;
  layoutSel = 0;
  buildSlots();
  previewLayout();
}

/** The seed options the sheet currently describes. */
function sheetOptions() {
  const o = { palette, mirror };
  if (editingId) {
    o.parent = Number(degSel.value);
    const n = String(nameBox.value || "").trim();
    // The box is PREFILLED, so an UNTOUCHED box on an auto-named deck is
    // treated as ABSENT: otherwise a field edit would pin the old fields' name
    // onto the new deck and the row would show two chips reading the same thing
    // (queue row 73). What counts as untouched is `nameDirty`, not the string -
    // comparing against autoName could not tell a user who deliberately typed
    // the auto label from one who never touched the box (queue row 133). A deck
    // that already carries an EXPLICIT name keeps it either way.
    const d = editedDeck();
    const kept = !!(d && d.options && d.options.name);
    if (n && (nameDirty || kept)) o.name = n;  // validated by core.parseSeed, never here
    if (layoutOrder) o.order = layoutOrder.slice();
  }
  return o;
}

/* ---- the pan preview ----
 * The owner's request: show a mock of the notes on the pan BEFORE committing to
 * generating cards. It is drawn from layout.solve's output alone - no chord
 * selection, no deck build - so the per-keystroke cost is one solve, and it goes
 * through the same pan() the cards use, which is why the preview cannot drift
 * from the real output. */

/** Solve the typed seed under the sheet's mirror. */
function solvePreviewLayout(seed) {
  const res = HPE.layout.solve(seed, { mirror: mirror });
  return res.ok ? res.value : null;
}

function clearPanPreview() {
  previewBox.innerHTML = "";
  previewBox.setAttribute("hidden", "");
}

/** Paint the pan mock for a parsed seed, unhighlighted.
 *
 * CREATE PATH ONLY, for two reasons that agree. The request is about the moment
 * BEFORE committing - from Edit the deck already exists, and previewLayout()
 * repaints its real card live behind the sheet, so a mock there would be a
 * second preview of the same pan. And the Edit sheet already carries the name,
 * degrees and LAYOUT rows: at 380px a mock on top of those pushes the primary
 * button off the screen, which is the one thing a phone sheet may never do. */
function showPanPreview(seed) {
  if (editingId) { clearPanPreview(); return; }
  const solved = solvePreviewLayout(seed);
  if (!solved) { clearPanPreview(); return; }
  const p = HPE.select.PALETTES[palette] || HPE.select.PALETTES[0];
  // A chordless deck shape: pan() reads geom, fields and colours, and with no
  // chord it lights nothing, so the colours are only ever a fallback.
  previewBox.innerHTML = pan(
    { geom: solved.geom, fields: solved.fields, colors: { root: p.root, tone: p.tone } },
    null);
  previewBox.removeAttribute("hidden");
}

/** Re-parse on every input: the parse line, the outline and Generate follow. */
function updateParse() {
  const text = String(scaleBox.value || "");
  if (!text.trim()) {
    parseLine.textContent = PARSE_HINT;
    scaleBox.classList.remove("bad");
    genBtn.disabled = true;
    clearPanPreview();
    say("", "");
    return;
  }
  const res = HPE.core.parseSeed(text, sheetOptions());
  if (res.ok) {
    parseLine.textContent = parseLineText(res.value.fields);
    scaleBox.classList.remove("bad");
    genBtn.disabled = false;
    showPanPreview(res.value);
    say("", "");
  } else {
    parseLine.textContent = "";
    scaleBox.classList.add("bad");
    genBtn.disabled = true;
    clearPanPreview();
    say(res.reason, "err");
  }
}

/** Show or hide the three Edit-only rows and relabel the single primary. */
function setSheetMode(edit) {
  for (const el of [nameRow, degRow, layoutRow, delRow]) {
    if (edit) el.removeAttribute("hidden"); else el.setAttribute("hidden", "");
  }
  // The presets are the mirror image: create-only. From Edit, one tap would
  // overwrite the deck's fields, which is the collision path row 131 closed.
  if (edit) presetRow.setAttribute("hidden", ""); else presetRow.removeAttribute("hidden");
  genBtn.textContent = edit ? "SAVE CHANGES" : "GENERATE CARDS";
  sheet.setAttribute("aria-label", edit ? "Edit this scale" : "Add a scale");
}
function showSheet(opener) {
  sheetOpener = opener || addChip;
  sheet.removeAttribute("hidden");
  sheetOpen = true;
  for (const el of background) { el.inert = true; el.setAttribute("aria-hidden", "true"); }
  updateParse();
  scaleBox.focus();
}
// The create path. Everything is reset, so an Edit never leaks its seed, its
// palette or its mirror into the next "+ ADD".
function openScaleSheet(opener) {
  editingId = null;
  setSheetMode(false);
  scaleBox.value = "";
  nameBox.value = "";
  nameDirty = false;
  palette = 0;
  buildSwatches();
  setMirror(false);
  layoutOrder = null;
  layoutSel = 0;
  buildSlots();
  showSheet(opener);
}
// The Edit path [design-review 7A]: the SAME sheet, prefilled from the deck
// already in the registry.
function openEditSheet(d, opener) {
  editingId = d.id;
  setSheetMode(true);
  nameBox.value = d.name;
  nameDirty = false;                                 // prefilled, not typed
  scaleBox.value = HPE.core.formatSeed(d.fields);     // 8A: the canonical string
  palette = d.options.palette;
  buildSwatches();
  setMirror(!!d.options.mirror);
  buildDegrees(d.options.parent);
  // The correction is a seed option like the others, so Edit shows the one the
  // deck already carries and RESET is what clears it.
  layoutOrder = Array.isArray(d.options.order) ? d.options.order.slice() : null;
  layoutSel = 0;
  buildSlots();
  showSheet(opener);
  // [eng-review 2, 2A] warnings have ONE producer and were copied onto the deck
  // at generation time; the Edit sheet reads them and never rebuilds to re-derive.
  const warned = (d.warnings || []).map(w => w.reason);
  if (warned.length) say(warned.join(" "), "warn");
}
function closeScaleSheet() {
  if (!sheetOpen) return;
  sheet.setAttribute("hidden", "");
  sheetOpen = false;
  // Escape and the backdrop are "without saving", and the preview was painted
  // on the real deck, so it has to come back off.
  restoreLayoutPreview();
  editingId = null;
  for (const el of background) { el.inert = false; el.removeAttribute("aria-hidden"); }
  (sheetOpener || addChip).focus();
  sheetOpener = null;
}

// Removing a deck the user is LOOKING AT would otherwise leave the practice
// screen on a deck that no longer exists, so it falls back to the first
// built-in and says so. That sentence is UI copy, not an engine reason: the
// section 2 code enum is closed and has no code for "you deleted this".
function deleteDeck(id) {
  const d = CUSTOM[id];
  if (!d) return;
  const gone = d.name;
  const wasSelected = deckId === id;
  delete CUSTOM[id];
  forgetScale(HPE.core.formatSeed(d.fields));
  if (editingId === id) closeScaleSheet();
  if (!wasSelected) { buildChips(); return; }
  selectDeck(DECKS[0].id);
  say("Removed " + gone + ". Showing " + deck().name + ".", "warn");
}

function runGenerate() {
  if (genBtn.disabled) return;
  const label = genBtn.textContent;
  genBtn.textContent = editingId ? "SAVING" : "GENERATING";
  genBtn.disabled = true;
  scaleBox.setAttribute("readonly", "");
  say("", "");

  // ONE generation per submit, on the create path and the Edit path alike
  // (13A): a save re-parses and rebuilds exactly once, and D14 keeps the id
  // when the canonical seed is unchanged, so the deck is replaced in place.
  const known = new Set(Object.keys(CUSTOM));
  // Queue row 73: what the OLD record becomes is decided here, before the id
  // can move. The seed string is read now because the registry entry is gone by
  // the time storage is written.
  const wasId = editingId;
  const wasSeed = editedDeck() ? HPE.core.formatSeed(editedDeck().fields) : null;
  // Queue row 131, the owner's decision: an EDIT whose new fields hash to an id
  // a DIFFERENT custom deck already holds is REFUSED. Without this the deck at
  // that id is silently overwritten and its name, palette and mirror are gone.
  // The veto runs between the parse and the build - before generateDeck can
  // register anything over the victim, and without a second build (13A) - and
  // the id comes from D14, the hash of the fields alone, so nothing has to be
  // built to find it out. It cannot fire on the ADD path (no wasId there:
  // generating an existing seed is the benign dedupe-by-id, "same scale, same
  // deck"), nor on an options-only edit or an unchanged re-save (the id does
  // not move), nor on a field edit to a scale no other deck holds.
  let taken = null;
  const res = generateDeck(String(scaleBox.value || ""), sheetOptions(), (seed) => {
    if (!wasId) return null;
    const id = HPE.core.deckId(seed.fields);
    if (id === wasId || !CUSTOM[id]) return null;
    taken = CUSTOM[id];
    return { ok: false };
  });

  scaleBox.removeAttribute("readonly");
  genBtn.textContent = label;
  if (taken) {
    // UI copy, like the delete fallback above it - NOT an engine reason. The
    // section 2 code enum is closed and has no code for "that scale is taken",
    // so this composes no sentence that could pass for one and carries no code.
    scaleBox.classList.add("bad");
    say("Another deck already uses this scale.", "err");
    return;
  }
  if (!res.ok) {
    scaleBox.classList.add("bad");
    say(res.reason, "err");
    return;
  }
  const d = res.value;
  // "Edit means edit" (queue row 73). D14 could not keep the id across a field
  // change, so the deck is REPLACED instead: the old entry leaves the registry
  // and the new one takes its chip position. An options-only edit never gets
  // here - the id is unchanged and generateDeck already replaced it in place.
  const replaced = !!wasId && d.id !== wasId;
  if (replaced) replaceRegistered(wasId, d);
  // [eng-review 2, 2A] the warnings are read off the deck the SAME generation
  // produced; nothing is rebuilt to re-derive them.
  const warned = (d.warnings || []).map(w => w.reason);
  let text = (replaced || known.has(d.id))
    ? `Updated ${d.name}` : `${d.chords.length} cards generated`;
  if (!generated.has(d.id)) { generated.add(d.id); text += " " + LAYOUT_HINT; }
  if (warned.length) text += " " + warned.join(" ");

  // The save REPLACED the deck the preview was painted on, so there is nothing
  // left to put back: dropping the snapshot keeps closeScaleSheet from undoing
  // the correction it just committed.
  dropLayoutPreview();
  closeScaleSheet();
  if (replaced) replaceScale(wasSeed, seedOf(d)); else rememberScale(seedOf(d));
  selectDeck(d.id);
  say(text, warned.length ? "warn" : "ok");
  genBtn.disabled = false;
}

buildPresets();
addChip.onclick = () => openScaleSheet(addChip);
genBtn.onclick = runGenerate;
delBtn.onclick = () => { if (editingId) deleteDeck(editingId); };
// The mirror is the choice the pan preview exists to make visible, so each
// button re-solves the preview through the same parse path a keystroke uses.
mirrorL.onclick = () => { setMirror(true); updateParse(); };
mirrorR.onclick = () => { setMirror(false); updateParse(); };
rotL.onclick = () => rotateLayout(-1);
rotR.onclick = () => rotateLayout(1);
moveL.onclick = () => moveNote(-1);
moveR.onclick = () => moveNote(1);
resetBtn.onclick = resetLayout;
// The roving tabindex: one Tab reaches the slot list, the arrows move inside it.
slotsBox.addEventListener("keydown", (e) => {
  const n = slotsBox.children.length;
  if (!n) return;
  let to;
  if (e.key === "ArrowRight" || e.key === "ArrowDown") to = (layoutSel + 1) % n;
  else if (e.key === "ArrowLeft" || e.key === "ArrowUp") to = (layoutSel + n - 1) % n;
  else if (e.key === "Home") to = 0;
  else if (e.key === "End") to = n - 1;
  else return;
  e.preventDefault();
  layoutSel = to;
  buildSlots();
  slotsBox.children[layoutSel].focus();
});
scaleBox.addEventListener("input", updateParse);
// The name is a seed option, so an unusable one is rejected by core.parseSeed
// through the same parse line every other input goes through.
nameBox.addEventListener("input", () => { nameDirty = true; updateParse(); });
degSel.addEventListener("change", updateParse);
scaleBox.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); runGenerate(); } });
// A tap whose target IS the layer is a tap on the backdrop, never on the sheet.
sheet.addEventListener("click", e => { if (e.target === sheet) closeScaleSheet(); });
// Tab is trapped inside: the sheet's own controls, in visual order.
sheet.addEventListener("keydown", e => {
  if (e.key !== "Tab") return;
  const stops = [editingId ? nameBox : null,
                 ...(editingId ? [] : [...presetBox.children]),
                 scaleBox, editingId ? degSel : null,
                 editingId ? rotL : null, editingId ? rotR : null,
                 editingId ? resetBtn : null,
                 editingId ? slotsBox.children[layoutSel] : null,
                 editingId ? moveL : null, editingId ? moveR : null,
                 mirrorL, mirrorR, ...swatches.children, genBtn,
                 editingId ? delBtn : null]
    .filter(el => el && !el.disabled);
  const i = stops.indexOf(document.activeElement);
  const next = e.shiftKey ? (i <= 0 ? stops.length - 1 : i - 1) : (i === stops.length - 1 ? 0 : i + 1);
  e.preventDefault();
  stops[next].focus();
});

/* ---------------- interaction ---------------- */
const card = document.getElementById("card");
function flip() { flipped = !flipped; render(); }
function step(dir) {
  idx = (idx + dir + order.length) % order.length;
  flipped = false; render();
}
card.addEventListener("click", flip);
card.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); } });
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.getElementById("shuffle").onclick = function () {
  shuffled = !shuffled; setOrder(); render();
  this.textContent = "Shuffle: " + (shuffled ? "on" : "off");
  this.classList.toggle("on", shuffled);
};
document.getElementById("modeA").onclick = () => setMode("A");
document.getElementById("modeB").onclick = () => setMode("B");
function setMode(m) {
  mode = m; flipped = false; save();
  document.getElementById("modeA").classList.toggle("on", m === "A");
  document.getElementById("modeB").classList.toggle("on", m === "B");
  render();
}
document.addEventListener("keydown", e => {
  // While the sheet is open it owns the keyboard: Escape closes it, and an
  // arrow key is cursor movement inside the box, never a card step.
  if (sheetOpen) {
    if (e.key === "Escape") { e.preventDefault(); closeScaleSheet(); }
    return;
  }
  if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
});
let tx = null;
card.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
card.addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 55) step(dx < 0 ? 1 : -1);
}, { passive: true });

/* ---------------- go ---------------- */
sheet.setAttribute("hidden", ""); buildSwatches(); setMirror(mirror); updateParse();
// Saved scales are rebuilt BEFORE the stored deck id is resolved, so a custom
// deck that was selected last session is in the registry by the time deck()
// looks for it.
restoreScales();
const wantedDeck = deckId;
deckId = deck().id; storedDeck = deckId; setOrder(); buildChips(); setMode(mode);
// Two fallbacks, deliberately different. An unknown BUILT-IN id is a stale or
// renamed deck and falls back SILENTLY, as it always has. A missing custom: id
// means the user's own saved scale is gone - deleted, or dropped as corrupt -
// and a silent switch would look like the app lost their deck, so say so.
if (wantedDeck !== deckId && wantedDeck.indexOf("custom:") === 0)
  say("That deck is gone. Showing " + deck().name + ".", "warn");
// A share link in the address bar is consumed once, at boot, through the same
// single entry point; it wins over the stored deck because the user just
// followed it.
if (location.hash.indexOf(SHARE_PREFIX) === 0)
  openShare(location.hash.slice(SHARE_PREFIX.length));
</script>
</body>
</html>
