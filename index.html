}

/* ---- the LAYOUT correction (D5, moved onto the pan in Stage 3) ----
 * The generated layout is a GUESS, and LAYOUT_HINT says so; this is how it is
 * corrected. The pan mock IS the editor: a note is chosen by tapping it, the
 * ring says which one is chosen, and ROTATE and MOVE redraw the mock under the
 * finger. Everything still works from the keyboard - ROTATE, MOVE and RESET are
 * ordinary buttons and the pan is ONE tab stop whose arrow keys walk the
 * selection - so there is no drag-only path to any of it. */

/** The non-ding field ids in the order layout.solve assigns slots. */
function layoutIds(fields) {
  const of = (z) => Object.keys(fields).filter((id) => fields[id][3] === z)
    .sort((a, b) => Number(a) - Number(b));
  return [...of("rim"), ...of("inner"), ...of("bottom")];
}
const identityOrder = (n) => Array.from({ length: n }, (_, i) => i);
/** at[slot] = the field sitting in that slot - the inverse of an order. */
function slotOccupants(order) {
  const at = [];
  order.forEach((slot, i) => { at[slot] = i; });
  return at;
}
function orderFromSlots(at) {
  const out = [];
  at.forEach((field, slot) => { out[field] = slot; });
  return out;
}
/** ABSENT, never the identity: a correction that undoes itself is no correction. */
function setLayoutOrder(next) {
  layoutOrder = next.every((slot, i) => slot === i) ? null : next;
}
const editedDeck = () => (editingId ? CUSTOM[editingId] : null) || null;
/** The half-open slot range of the zone a slot belongs to. */
function zoneBlock(fields, slot) {
  const count = (z) => Object.keys(fields).filter((id) => fields[id][3] === z).length;
  const rim = count("rim");
  const inner = count("inner");
  const n = layoutIds(fields).length;
  for (const [a, b] of [[0, rim], [rim, rim + inner], [rim + inner, n]]) {
    if (slot >= a && slot < b) return [a, b];
  }
  return [0, 0];
}
const wrap = (i, a, span) => a + (((i - a) % span) + span) % span;

/** A correction is a permutation of a FIXED length, so a seed edit that
 *  changes the field count invalidates it. This guard used to live inside
 *  buildSlots(); with the slot list gone it has to run wherever the correction
 *  meets a field set, or a stale correction silently lands on a different pan.
 *  Returns the non-ding count so callers do not re-derive it. */
function syncLayoutOrder(fields) {
  const n = layoutIds(fields).length;
  if (layoutOrder && layoutOrder.length !== n) layoutOrder = null;
  if (layoutSel >= n) layoutSel = 0;
  return n;
}

/** The fields the LAYOUT controls act on: the seed as TYPED, which on an
 *  untouched Edit box is the deck's own (the box is prefilled with
 *  formatSeed(d.fields)). The TYPED seed and not the stored deck, because once
 *  the mock repaints on every keystroke the two can differ, and the controls
 *  must move the pan the user is looking at. */
function layoutFields() {
  const d = editedDeck();
  if (!d) return null;
  const res = HPE.core.parseSeed(String(scaleBox.value || ""), { palette, mirror });
  return res.ok ? res.value.fields : d.fields;
}

/** Choose the note a tap landed on. `.panhit` carries a FIELD id and layoutSel
 *  is a SLOT, and `order[field] = slot` - so this is the conversion, and the
 *  only one. Backwards it selects the wrong note on every deck the user has
 *  already corrected, and exactly the right one on every deck they have not,
 *  which is why it gets a test of its own on a corrected pan. */
function selectPanField(id) {
  const fields = layoutFields();
  if (!fields) return false;
  const n = syncLayoutOrder(fields);
  const i = layoutIds(fields).indexOf(String(id));
  if (i < 0) return false;
  layoutSel = (layoutOrder || identityOrder(n))[i];
  previewLayout();
  return true;
}

/** The field id sitting in the selected slot - what the ring is drawn on. */
function selectedField(fields) {
  const ids = layoutIds(fields);
  const at = slotOccupants(layoutOrder || identityOrder(ids.length));
  return ids[at[layoutSel]];
}

/* The preview is the MOCK, and only the mock (D4). It used to be painted onto
 * the real deck behind the sheet, which meant every abandoned correction had to
 * be unpainted on the way out - a second copy of the fields, a restore path,
 * and a deck that was briefly wrong if anything threw in between. The deck is
 * now untouched until SAVE CHANGES commits `order` like any other seed option,
 * so "Escape leaves the deck byte-identical" is structural rather than
 * something a restore function has to remember to do. */
function previewLayout() {
  if (!editingId) return;
  resyncSheet(true);
}

// ROTATE is a cyclic shift of the SELECTED note's ring (D2): the whole ring
// turns, which is what a pan whose zig-zag starts somewhere else actually looks
// like. The ring is the selection's, not always the rim's - a bottom shell is
// built from below and can start anywhere the rim does not, and before Stage 3
// it could not be rotated at all.
function rotateLayout(by) {
  const fields = layoutFields();
  if (!fields) return;
  const n = syncLayoutOrder(fields);
  const [a, b] = zoneBlock(fields, layoutSel);
  const span = b - a;
  if (span < 2) return;
  const at = slotOccupants(layoutOrder || identityOrder(n));
  const next = at.slice();
  for (let j = a; j < b; j += 1) next[wrap(j + by, a, span)] = at[j];
  setLayoutOrder(orderFromSlots(next));
  layoutSel = wrap(layoutSel + by, a, span);
  previewLayout();
}
// MOVE takes the chosen note to the next position, and whatever was there takes
// its place - a swap, so a note is never lost and the result is always still a
// permutation. It stays inside the note's own zone: a rim note is on the rim.
function moveNote(by) {
  const fields = layoutFields();
  if (!fields) return;
  const n = syncLayoutOrder(fields);
  const [a, b] = zoneBlock(fields, layoutSel);
  const span = b - a;
  if (span < 2) return;
  const to = wrap(layoutSel + by, a, span);
  const at = slotOccupants(layoutOrder || identityOrder(n));
  const held = at[layoutSel];
  at[layoutSel] = at[to];
  at[to] = held;
  setLayoutOrder(orderFromSlots(at));
  layoutSel = to;
  previewLayout();
}
/** Walk the selection one slot, wrapping across the whole pan - the keyboard
 *  equivalent of tapping the next note round. */
function stepLayoutSel(by) {
  const fields = layoutFields();
  if (!fields) return;
  const n = syncLayoutOrder(fields);
  if (!n) return;
  layoutSel = (layoutSel + by + n) % n;
  previewLayout();
}
function resetLayout() {
  layoutOrder = null;
  layoutSel = 0;
  previewLayout();
}

/** The seed options the sheet currently describes. */
function sheetOptions() {
  const o = { palette, mirror };
  if (editingId) {
    o.parent = Number(degSel.value);
    const n = String(nameBox.value || "").trim();
    // The box is PREFILLED, so an UNTOUCHED box on an auto-named deck is
    // treated as ABSENT: otherwise a field edit would pin the old fields' name
    // onto the new deck and the row would show two chips reading the same thing
    // (queue row 73). What counts as untouched is `nameDirty`, not the string -
    // comparing against autoName could not tell a user who deliberately typed
    // the auto label from one who never touched the box (queue row 133). A deck
    // that already carries an EXPLICIT name keeps it either way.
    const d = editedDeck();
    const kept = !!(d && d.options && d.options.name);
    if (n && (nameDirty || kept)) o.name = n;  // validated by core.parseSeed, never here
    if (layoutOrder) o.order = layoutOrder.slice();
  }
  return o;
}

/* ---- the pan preview ----
 * The owner's request: show a mock of the notes on the pan BEFORE committing to
 * generating cards. It is drawn from layout.solve's output alone - no chord
 * selection, no deck build - so the per-keystroke cost is one solve, and it goes
 * through the same pan() the cards use, which is why the preview cannot drift
 * from the real output. */

/** Solve the typed seed under the sheet's mirror, and - on the Edit path - the
 *  correction the LAYOUT controls are building. Passing `order` is what makes
 *  ROTATE and MOVE visible: without it the mock would redraw the GENERATED
 *  layout after every press and the controls would look like they did nothing,
 *  which is the bug this stage exists to fix.
 *  The guard runs first, because a seed edit can change the field count and
 *  layout.solve refuses an order of the wrong length (BAD_NOTE) - which would
 *  show up as a mock that silently stopped repainting. */
function solvePreviewLayout(seed) {
  if (editingId) syncLayoutOrder(seed.fields);
  const res = HPE.layout.solve(seed,
    { mirror: mirror, order: editingId ? layoutOrder : null });
  return res.ok ? res.value : null;
}

/* The pan is role="img" with a name, so a screen reader reads it as content.
 * Three states, three names, because a render that is NOT of what is currently
 * in the box must not claim to be: "current" is the seed as typed, "example" is
 * the placeholder drawn for an empty box, and "held" is the last render kept
 * through an invalid parse so a typo does not throw away the pan being edited.
 * Visually "example" and "held" share one dim treatment (#scale-preview.stale)
 * - the invalid case is already distinguished by the box's orange border and
 * the orange message, so a second visual vocabulary would only be noise. */
const PAN_NAMES = {
  current: "Preview of where the notes sit on the pan",
  example: "Example pan for the placeholder seed",
  held: "Preview of the last seed that parsed",
};

/** The plate is always in the flow on both paths now: it entering and leaving
 * was the biggest of the three things that made the drawer resize while the
 * owner typed. Kept for the one case that still needs it - a placeholder seed
 * that will not parse. */
function clearPanPreview() {
  previewBox.innerHTML = "";
  previewBox.removeAttribute("aria-label");
  previewBox.classList.remove("stale");
  previewBox.setAttribute("hidden", "");
}

// What the plate last drew. Held in a variable rather than read back off the
// accessible name: on the Edit path the name also carries the instruction for
// the arrow keys, so the string is no longer a key into PAN_NAMES.
let panState = "example";
const PAN_EDIT_HINT = " Tap a note to choose it, or use the arrow keys.";
function markPan(state) {
  panState = state;
  previewBox.classList.toggle("stale", state !== "current");
  previewBox.setAttribute("aria-label",
    PAN_NAMES[state] + (editingId ? "." + PAN_EDIT_HINT : ""));
}

/** Paint the pan mock for a parsed seed, unhighlighted. Returns false if the
 * seed has no solvable layout, which leaves whatever is on screen alone.
 *
 * BOTH PATHS. Through Stage 2 this was create-only and the Edit path cleared
 * the plate instead, on the reasoning that previewLayout() was already
 * repainting the real card behind the sheet. That reasoning did not survive
 * contact with the owner: the card behind a full-screen page is not visible at
 * all, so ROTATE and MOVE moved something nobody could see. The mock is now the
 * one place the layout is shown, on both paths, and on Edit it is interactive.
 */
function paintPan(seed, state) {
  const solved = solvePreviewLayout(seed);
  if (!solved) return false;
  const p = HPE.select.PALETTES[palette] || HPE.select.PALETTES[0];
  // A chordless deck shape: pan() reads geom, fields and colours, and with no
  // chord it lights nothing, so the colours are only ever a fallback.
  previewBox.innerHTML = pan(
    { geom: solved.geom, fields: solved.fields, colors: { root: p.root, tone: p.tone } },
    null,
    editingId ? { interactive: true, selected: selectedField(solved.fields) } : null);
  previewBox.removeAttribute("hidden");
  markPan(state);
  if (editingId) sizePanHits(previewBox.querySelector && previewBox.querySelector("svg"),
                             PAN_HIT_MIN_PX);
  return true;
}

function showPanPreview(seed) {
  if (!paintPan(seed, "current")) holdPanPreview();
}

/** An empty box still gets a pan, so the drawer is the same height before the
 * first keystroke as after it. The seed comes from the placeholder ATTRIBUTE
 * rather than a second copy of it in JS: the label, the placeholder and
 * PARSE_HINT are the only teaching of the grammar there is, and this way the
 * example drawn is provably the example shown. */
function showPlaceholderPan() {
  const res = HPE.core.parseSeed(String(scaleBox.placeholder || ""), sheetOptions());
  if (!res.ok || !paintPan(res.value, "example")) clearPanPreview();
}

/** Invalid parse: keep the render but stop it claiming to be current. Mid-word
 * a seed is invalid on most keystrokes, so clearing here would be the resize
 * the owner asked us to remove, one character at a time. */
function holdPanPreview() {
  if (previewBox.hasAttribute("hidden") || !previewBox.innerHTML) {
    showPlaceholderPan();
    return;
  }
  markPan(panState === "example" ? "example" : "held");
}

/* A refusal the SEED cannot re-derive: the collision veto is decided by the
   registry, not by the text in the box, so syncParseState() would clear it.
   Cleared by the next real parse, which is the edit that could fix it. */
let refusal = null;

/** Re-derive the parse line, the box, GENERATE and the message from the seed.
 *  `paint` is false for the one caller that runs inside a pointerdown:
 *  repainting the pan there detaches the `.panhit` the press landed on, the
 *  click retargets to an ancestor, and the delegated handler drops the tap. */
function syncParseState({ paint }) {
  const text = String(scaleBox.value || "");
  if (!text.trim()) {
    showParse(PARSE_HINT);
    scaleBox.classList.remove("bad");
    genBtn.disabled = true;
    if (paint) showPlaceholderPan();
    say("", "");
    return;
  }
  const res = HPE.core.parseSeed(text, sheetOptions());
  if (res.ok) {
    showParse(parseLineText(res.value.fields));
    scaleBox.classList.remove("bad");
    genBtn.disabled = false;
    if (paint) showPanPreview(res.value);
    say("", "");
  } else {
    // showRefusal() blanks the parse line rather than removing it: the CSS
    // leans on the blank too - #scale-parse:empty steps out of the row and
    // #scale-refusal takes the identical box - so a half-typed seed neither
    // jumps the sheet nor costs the fieldrow a second reserved line.
    scaleBox.classList.add("bad");
    genBtn.disabled = true;
    if (paint) holdPanPreview();
    showRefusal(res.reason);
  }
}

/** Re-parse on every input: the parse line, the outline and Generate follow.
 *  An edit is also the one event that can clear a standing refusal. */
function updateParse() {
  refusal = null;
  syncParseState({ paint: true });
}

/** The other seven places the sheet re-derives its own state (opening,
 *  mirror, layout taps, the name box, the degree select, boot) - none of
 *  which can change what a seed hashes to (queue row 115). A standing
 *  collision refusal is the registry's veto, not the parser's, so calling
 *  updateParse() from any of them silently drops a refusal the user has not
 *  addressed. Mirrors disarmDelete()'s own guard (`:4954`), which is why
 *  disarmDelete() is not rewritten to use this - it already avoids the bug. */
function resyncSheet(paint) {
  if (refusal) { showRefusal(refusal); return; }
  syncParseState({ paint });
}

/* ---- iOS keyboard fix (TODOS.md "The iOS keyboard covers GENERATE CARDS
   while typing a seed") ----
   iOS Safari resizes the VISUAL viewport when the soft keyboard opens, not
   the layout viewport #scale-sheet's position:fixed is anchored to:
   window.innerHeight stays put while window.visualViewport.height shrinks
   and its offsetTop can move. Every layout unit the sheet is built from -
   dvh included - is a layout-viewport unit, so nothing in .sheetsurf's own
   CSS can react to the keyboard; the gap between the two viewports is
   exactly how far the sheet has to translate up to stay above it.
   kbOffset() is the pure half of that: given the three viewport numbers,
   the translate distance. It is unit-tested directly (tests/app.test.js),
   and the WIRING around it is covered too: shadowing visualViewport.height
   on the instance and firing a real resize drives applyKbOffset end to end
   in e2e (b.fakeKeyboard in tests/helpers/cdp.js), so the listener, both
   pure functions and both style writes are all under test.
   What CI still cannot verify is the PREMISE - that a real iOS keyboard
   shrinks visualViewport.height - because no CDP soft-keyboard emulation
   exists. That stays an owner-device claim (TODOS.md, queue rows 51/67).
   One more thing no test here can see: the viewport meta above carries
   interactive-widget=resizes-content. On an engine that honours it the
   LAYOUT viewport shrinks instead, innerHeight - vv.height is 0, and this
   whole block correctly does nothing. */
function kbOffset(innerHeight, vvHeight, vvOffsetTop) {
  return Math.max(0, innerHeight - vvHeight - vvOffsetTop);
}
/* The translate is only half the fix. 100dvh is a LAYOUT-viewport unit, so the
   surface keeps its full 844px on an 844pt phone no matter how far the keyboard
   shrinks the visual viewport; lifting an 844px surface by 300px puts its TOP
   at -300px. The reserved footer rides the translate, so
   GENERATE CARDS becomes reachable and the whole thing LOOKS fixed - while
   #scale-box, at the top of the .sheetbody scrollport, goes off-screen. That
   is the state the owner photographed on an iPhone 14 / iOS 26.6: the seed
   field unreachable exactly while typing into it.
   So the surface is also CAPPED to the shrunken viewport, and .sheetbody's
   existing shrink does the rest - the body gives way, the footer stays put,
   and the field stays on screen. 0 means "no override": leave 100dvh alone so
   the no-keyboard case is untouched CSS. The 8px is a visual margin so the
   surface does not sit flush against the keyboard, not spacing between
   children - subpixel viewport heights are worth well under a pixel of it. */
function kbCap(innerHeight, vvHeight) {
  if (innerHeight - vvHeight <= 0) return 0;
  return Math.max(0, Math.round(vvHeight - 8));
}
function applyKbOffset() {
  const vv = window.visualViewport;
  /* Gated on sheetOpen as well as on the two objects. The listeners below are
   * bound for the life of the page and never removed, so without this a
   * resize or scroll arriving AFTER hideSheet() re-applies the lift and the
   * cap to a sheet nobody is looking at - the keyboard dismissing itself as
   * the sheet closes is the ordinary way that happens on iOS (queue rows 55,
   * 88). showSheet() sets sheetOpen before it calls this, and
   * hideSheet() clears it before it resets the two styles, so the open path is
   * unaffected and the teardown is the last word. */
  if (!vv || !sheetSurf || !sheetOpen) return;
  /* vv.height is the VISUAL viewport, which a pinch-zoom shrinks in exactly
   * the way a keyboard does - so without this branch the sheet lifted and
   * capped itself for a reader who was only zooming in (queue row 87).
   * While the scale is up the page makes NO claim: both writes are cleared
   * together. That is a policy, not arithmetic, because no arithmetic gets
   * both halves right here. The surface is laid out at 100dvh, so the moment
   * the page is zoomed it is TALLER than the screen and "keep it above the
   * keyboard" and "leave the zoom alone" stop being simultaneously
   * satisfiable; any formula that splits the difference ends up lifting on one
   * measurement and capping on another, which is what the first version of
   * this fix did (it scaled vv.offsetTop, which is already in layout px, so
   * the lift decayed to zero as the reader panned while the cap went on
   * insisting a keyboard was there).
   * Clearing is safe here only because #scale-box and its siblings are pinned
   * at 16px: iOS auto-zooms a focused input below that, and the fix must not
   * hand itself off exactly when the keyboard opens. At 16px every zoom is two
   * deliberate fingers, and the reader who zoomed can pan.
   * The tolerance is for scales that do not land exactly on 1 coming back from
   * a pinch; a sub-percent residue is not a zoom. */
  const zoomed = vv.scale > 1.01;
  const off = zoomed ? 0 : kbOffset(window.innerHeight, vv.height, vv.offsetTop);
  const cap = zoomed ? 0 : kbCap(window.innerHeight, vv.height);
  /* Written only on change: this handler is bound to visualViewport's `scroll`
   * as well, which fires at frame rate while a zoomed page is panned, and each
   * unconditional style write forces a style recalc for no reason. */
  const t = off > 0 ? `translateY(-${off}px)` : "";
  const m = cap > 0 ? `${cap}px` : "";
  if (sheetSurf.style.transform !== t) sheetSurf.style.transform = t;
  if (sheetSurf.style.maxHeight !== m) sheetSurf.style.maxHeight = m;
}
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", applyKbOffset);
  window.visualViewport.addEventListener("scroll", applyKbOffset);
}

/** Show or hide the three Edit-only rows and relabel the single primary. */
function setSheetMode(edit) {
  disarmDelete();
  for (const el of [nameRow, degRow, layoutRow, delRow]) {
    if (edit) el.removeAttribute("hidden"); else el.setAttribute("hidden", "");
  }
  genBtn.textContent = edit ? "SAVE CHANGES" : "GENERATE CARDS";
  // On the create path the plate is a picture: role="img" with a name, read as
  // content and skipped by Tab. On the Edit path it is a control group holding
  // one button per note, so it takes a group role, a name that says what the
  // arrow keys do, and the single tab stop that reaches it.
  if (edit) {
    previewBox.setAttribute("role", "group");
    previewBox.setAttribute("tabindex", "0");
    previewBox.setAttribute("aria-label", PAN_NAMES[panState] + "." + PAN_EDIT_HINT);
  } else {
    previewBox.setAttribute("role", "img");
    previewBox.removeAttribute("tabindex");
  }
  // The page is named by the title it shows (#scale-title, via
  // aria-labelledby), so there is one string and a sighted user and a screen
  // reader are told the same thing.
  titleEl.textContent = edit ? "Edit this scale" : "Add a scale";
}
/* ---- the page's route (D3) ----
   Add and Edit are destinations, so each is a history entry: the phone's back
   gesture closes the page instead of leaving the app, which is the whole
   reason the hash is involved at all.
   The two halves stay apart on purpose. closeScaleSheet() takes the page down
   and then POPS the entry it pushed; popstate takes the page down and pops
   NOTHING, because the browser has already done it. Wire either one to the
   other's job and back either walks past the app's own entry and leaves the
   site, or leaves a dead entry that swallows the next back press.
   SHARE_PREFIX is "#s=", so these prefixes cannot shadow a share link - but
   that is exactly the kind of "cannot" that stops being true quietly, so it is
   asserted in tests rather than trusted here. */
const ADD_ROUTE  = "#add";
const EDIT_ROUTE = "#edit-";
function sheetRoute() { return editingId ? EDIT_ROUTE + editingId : ADD_ROUTE; }
// True while OUR history entry is on the stack. Not derived from the hash: a
// user can edit the address bar, and the question this answers is "did we push
// something that still needs popping", which only we know.
let sheetRouted = false;

function showSheet(opener) {
  sheetOpener = opener || addChip;
  sheet.removeAttribute("hidden");
  sheetOpen = true;
  for (const el of background) { el.inert = true; el.setAttribute("aria-hidden", "true"); }
  resyncSheet(true);
  applyKbOffset();
  history.pushState({ scalePage: true }, "", sheetRoute());
  sheetRouted = true;
  // The owner's second request: do not steal focus into the box, so the whole
  // page is readable before anything is typed and no soft keyboard covers it.
  // Focus still has to LEAVE the background - it is inert the line above, and
  // a focused element inside an inert subtree strands the keyboard - so it goes
  // to BACK. A button, so no keyboard opens; a real tab stop, so it does not
  // need a tabindex that outlives the page; and first in reading order, so Tab
  // from there walks the page the way it looks.
  backBtn.focus();
}
// The create path. Everything is reset, so an Edit never leaks its seed, its
// palette or its mirror into the next "+ ADD".
function openScaleSheet(opener) {
  editingId = null;
  // A fresh session: a refusal from whatever was last edited must not leak
  // into this one (queue row 115) - showSheet() itself is not allowed to
  // clear it, since it is one of the seven non-seed callers.
  refusal = null;
  setSheetMode(false);
  scaleBox.value = "";
  nameBox.value = "";
  nameDirty = false;
  palette = 0;
  buildSwatches();
  setMirror(false);
  layoutOrder = null;
  layoutSel = 0;
  showSheet(opener);
}
// The Edit path [design-review 7A]: the SAME sheet, prefilled from the deck
// already in the registry.
function openEditSheet(d, opener) {
  editingId = d.id;
  // Same reset as openScaleSheet(): a new Edit session starts with no
  // standing refusal from whatever the sheet last showed (queue row 115).
  refusal = null;
  setSheetMode(true);
  nameBox.value = d.name;
  nameDirty = false;                                 // prefilled, not typed
  scaleBox.value = HPE.core.formatSeed(d.fields);     // 8A: the canonical string
  palette = d.options.palette;
  buildSwatches();
  setMirror(!!d.options.mirror);
  buildDegrees(d.options.parent);
  // The correction is a seed option like the others, so Edit shows the one the
  // deck already carries and RESET is what clears it.
  layoutOrder = Array.isArray(d.options.order) ? d.options.order.slice() : null;
  layoutSel = 0;
  showSheet(opener);
  // [eng-review 2, 2A] warnings have ONE producer and were copied onto the deck
  // at generation time; the Edit sheet reads them and never rebuilds to re-derive.
  const warned = (d.warnings || []).map(w => w.reason);
  if (warned.length) say(warned.join(" "), "warn");
}
/** Take the page down. The DOM half only - the route is the caller's. */
function hideSheet() {
  sheet.setAttribute("hidden", "");
  sheetOpen = false;
  // Queue row 114: the announcer keeps its last text (role="status",
  // aria-live) when the sheet closes, so a rejected seed's error is still
  // there for a screen reader to read out on a page that no longer shows it.
  announce.textContent = "";
  announce.className = "announce";
  // Same hazard, same fix, for the refusal line: #scale-refusal is aria-live
  // and INSIDE the aria-modal dialog, which is the only reason a refusal is
  // reachable by AT at all while the sheet is open - so it is also the thing
  // that would carry a dead refusal into the next open.
  showRefusal("");
  // Undo BOTH keyboard writes before the next open, or a sheet that opens
  // with no keyboard up (e.g. re-opened via keyboard nav) would inherit the
  // previous session's offset for one frame. The cap is the half that used to
  // be left behind (queue row 88): applyKbOffset() writes transform and
  // maxHeight together, so the teardown has to undo them together or the two
  // halves drift apart the moment anything else learns to call hideSheet().
  if (sheetSurf) {
    sheetSurf.style.transform = "";
    sheetSurf.style.maxHeight = "";
  }
  editingId = null;
  for (const el of background) { el.inert = false; el.removeAttribute("aria-hidden"); }
  (sheetOpener || addChip).focus();
  sheetOpener = null;
}
// The app's own way out: BACK, Escape, or a save that finishes. It pops the
// entry showSheet() pushed, so the address bar and the stack end where they
// started and the next back press belongs to whatever came before the page.
function closeScaleSheet() {
  if (!sheetOpen) return;
  const routed = sheetRouted;
  sheetRouted = false;
  hideSheet();
  if (routed) history.back();
}
/* The print sheet's only teardown on the success path. Registered ONCE here,
   not inside openPrintSheet(), so pressing the CTA N times leaves one
   listener rather than N. */
window.addEventListener("afterprint", teardownPrintSheet);

// The browser's way out: the back gesture, or a swipe. The entry is already
// gone, so this only takes the page down.
window.addEventListener("popstate", () => {
  if (!sheetOpen) return;
  sheetRouted = false;
  hideSheet();
});

// Removing a deck the user is LOOKING AT would otherwise leave the practice
// screen on a deck that no longer exists, so it falls back to the first
// built-in and says so. That sentence is UI copy, not an engine reason: the
// section 2 code enum is closed and has no code for "you deleted this".
function deleteDeck(id) {
  const d = CUSTOM[id];
  if (!d) return;
  const gone = d.name;
  const wasSelected = deckId === id;
  delete CUSTOM[id];
  forgetScale(HPE.core.formatSeed(d.fields));
  if (editingId === id) closeScaleSheet();
  if (!wasSelected) { buildChips(); return; }
  selectDeck(DECKS[0].id);
  say("Removed " + gone + ". Showing " + deck().name + ".", "warn");
}

function runGenerate() {
  if (genBtn.disabled) return;
  const label = genBtn.textContent;
  genBtn.textContent = editingId ? "SAVING" : "GENERATING";
  genBtn.disabled = true;
  scaleBox.setAttribute("readonly", "");
  say("", "");

  // ONE generation per submit, on the create path and the Edit path alike
  // (13A): a save re-parses and rebuilds exactly once, and D14 keeps the id
  // when the canonical seed is unchanged, so the deck is replaced in place.
  const known = new Set(Object.keys(CUSTOM));
  // Queue row 73: what the OLD record becomes is decided here, before the id
  // can move. The seed string is read now because the registry entry is gone by
  // the time storage is written.
  const wasId = editingId;
  const wasSeed = editedDeck() ? HPE.core.formatSeed(editedDeck().fields) : null;
  // Queue row 131, the owner's decision: an EDIT whose new fields hash to an id
  // a DIFFERENT custom deck already holds is REFUSED. Without this the deck at
  // that id is silently overwritten and its name, palette and mirror are gone.
  // The veto runs between the parse and the build - before generateDeck can
  // register anything over the victim, and without a second build (13A) - and
  // the id comes from D14, the hash of the fields alone, so nothing has to be
  // built to find it out. It cannot fire on the ADD path (no wasId there:
  // generating an existing seed is the benign dedupe-by-id, "same scale, same
  // deck"), nor on an options-only edit or an unchanged re-save (the id does
  // not move), nor on a field edit to a scale no other deck holds.
  let taken = null;
  const res = generateDeck(String(scaleBox.value || ""), sheetOptions(), (seed) => {
    if (!wasId) return null;
    const id = HPE.core.deckId(seed.fields);
    if (id === wasId || !CUSTOM[id]) return null;
    taken = CUSTOM[id];
    return { ok: false };
  });

  scaleBox.removeAttribute("readonly");
  genBtn.textContent = label;
  if (taken) {
    // UI copy, like the delete fallback above it - NOT an engine reason. The
    // section 2 code enum is closed and has no code for "that scale is taken",
    // so this composes no sentence that could pass for one and carries no code.
    scaleBox.classList.add("bad");
    refusal = "Another deck already uses this scale.";
    showRefusal(refusal);
    return;
  }
  if (!res.ok) {
    scaleBox.classList.add("bad");
    refusal = res.reason;
    showRefusal(refusal);
    return;
  }
  const d = res.value;
  // "Edit means edit" (queue row 73). D14 could not keep the id across a field
  // change, so the deck is REPLACED instead: the old entry leaves the registry
  // and the new one takes its chip position. An options-only edit never gets
  // here - the id is unchanged and generateDeck already replaced it in place.
  const replaced = !!wasId && d.id !== wasId;
  if (replaced) replaceRegistered(wasId, d);
  // [eng-review 2, 2A] the warnings are read off the deck the SAME generation
  // produced; nothing is rebuilt to re-derive them.
  const warned = (d.warnings || []).map(w => w.reason);
  let text = (replaced || known.has(d.id))
    ? `Updated ${d.name}` : `${d.chords.length} cards generated`;
  if (!generated.has(d.id)) { generated.add(d.id); text += " " + LAYOUT_HINT; }
  if (warned.length) text += " " + warned.join(" ");

  closeScaleSheet();
  if (replaced) replaceScale(wasSeed, seedOf(d)); else rememberScale(seedOf(d));
  selectDeck(d.id);
  say(text, warned.length ? "warn" : "ok");
  genBtn.disabled = false;
}

addChip.onclick = () => openScaleSheet(addChip);
// The page's way out. Same handler Escape runs, so there is one close path.
backBtn.onclick = () => closeScaleSheet();
genBtn.onclick = runGenerate;
/* Owner instruction, 2026-09-17: "Delete cards should require a confirmation."
   A second tap on the SAME control rather than a dialog: the pinned footer is
   one row for the reason the .sheetbody comment gives, a dialog would cost it
   height, and Escape - which closes this page - must not be able to dismiss a
   confirmation. The label carries the state, so an armed button never looks
   like an idle one. setSheetMode() disarms on every open, and touching
   anything else on the page disarms it, so a confirmation never outlives the
   tap that gave it. */
const DEL_IDLE = "DELETE THIS DECK";
const DEL_ARMED = "TAP AGAIN TO DELETE";
let delArmed = false;
function disarmDelete() {
  /* Nothing to undo when nothing is armed, and re-deriving anyway would be
     worse than silent: this runs on every pointerdown in the sheet, so an
     unguarded disarm would re-parse the seed on taps that cancelled nothing. */
  if (!delArmed) return;
  delArmed = false;
  delBtn.textContent = DEL_IDLE;
  delBtn.removeAttribute("data-armed");
  // The label and the warning say the same thing, so they stop saying it
  // together - ahead of the `refusal` early-return below, which leaves the
  // rest of the sheet alone on purpose and would otherwise strand this line
  // under an idle button.
  delNote.textContent = "";
  // A standing refusal is not derivable from the seed, so re-deriving would
  // clear a red box and offer SAVE CHANGES for an edit the app still refuses.
  // Put the refusal back over the arming warning and leave the rest alone.
  if (refusal) { showRefusal(refusal); return; }
  // Otherwise re-derive .bad, the refusal line and GENERATE's disabled from
  // the field's CURRENT text, so the three cannot disagree (queue row 91) -
  // WITHOUT repainting the pan, because this runs inside a pointerdown.
  //
  // Do NOT read this call as dead code. Its ROW-91 job is belt and braces
  // now: arming writes only delBtn and #scale-del-note since the refusal
  // moved to #scale-refusal, so there is no longer damage here to repair,
  // and swapping the call for say("") passes every test. But DELETING it
  // outright is NOT a no-op - on a valid seed syncParseState() reaches
  // say("", "") (see the clears near index.html:4700), so the call also
  // clears #scale-msg. Today that means an arm/disarm cycle wipes a standing
  // pan warning (edit a NO_THIRDS deck, tap DELETE, tap away: the "No 3rds
  // on this pan" line is gone). No test asserts either way - see queue row
  // 135 - so a maintainer changing this line is changing UNCOVERED behaviour
  // and owes it a test first. What IS covered: `paint: false`
  // (d_disarm_repaints_the_pan, queue row 91's tap test) and the refusal
  // guard above (d_disarm_clears_the_refusal). The property the re-derive
  // used to protect is asserted from the other side, while DELETE is armed,
  // by d_arming_warning_takes_the_seed_row - the mutant that puts row 91's
  // cause back.
  syncParseState({ paint: false });
}
delBtn.onclick = () => {
  /* Belt and braces, and deliberately NOT mutant-covered (queue row 86, N6).
     Deleting this line reddens nothing, and that is correct rather than a gap:
     no state the app can enter delivers a click here with editingId null.
     delRow carries `hidden` whenever setSheetMode() has run for a null
     editingId - it sets `hidden` one line after `editingId = null` on the add
     path and clears it one line after `editingId = d.id` on the edit path -
     and `[hidden]` above is `display:none !important`, which beats
     `.editrow{display:flex}`. The correspondence is not exact: hideSheet()
     sets `editingId = null` without calling setSheetMode(), so between that
     and the next open delRow is visible markup with a null editingId. It is
     still unclickable, because #scale-sheet itself is `hidden` for the whole
     of that window. Either way a display:none button takes no pointer event
     and no focus, so the only way to reach this branch is a synthetic
     .onclick() call, and a test that made one would be testing the mutant
     rather than the owner. Left in because the lines it depends on sit in two
     other functions. */
  if (!editingId) return;
  /* Disarm BEFORE the delete, not inside it: the state must not outlive the
     deck even when deleteDeck turns out to have nothing to remove, and the
     delete's own message should be the last thing said. */
  if (delArmed) { disarmDelete(); deleteDeck(editingId); return; }
  delArmed = true;
  delBtn.textContent = DEL_ARMED;
  delBtn.setAttribute("data-armed", "");
  const d = CUSTOM[editingId];
  delNote.textContent =
    "Tap again to remove " + (d ? d.name : "this deck") + ". This cannot be undone.";
};
/* Looking away is a decision too, and on a phone the only way to see it is the
   pointer: iOS Safari gives a <button> no focus on tap, so `blur` never fires
   there and the blur handler alone would let an arm survive retyping the seed,
   flipping the mirror and scrolling away. A pointerdown anywhere in the page
   that is not the button itself is the same decision, and it is one the
   owner's device actually makes. The pointerdown that lands ON the button is
   not: it is the confirming tap's own first half. */
sheet.addEventListener("pointerdown", (e) => {
  if (e.target !== delBtn) disarmDelete();
});  // disarmDelete() is a no-op unless armed, so an ordinary tap writes nothing.
delBtn.onblur = disarmDelete;
// The mirror is the choice the pan preview exists to make visible, so each
// button re-solves the preview through the same parse path a keystroke uses.
mirrorL.onclick = () => { setMirror(true); resyncSheet(true); };
mirrorR.onclick = () => { setMirror(false); resyncSheet(true); };
rotL.onclick = () => rotateLayout(-1);
rotR.onclick = () => rotateLayout(1);
moveL.onclick = () => moveNote(-1);
moveR.onclick = () => moveNote(1);
resetBtn.onclick = resetLayout;
// A tap anywhere on the pan chooses the note under it. Delegated to the plate
// rather than bound per target, because the targets are rewritten on every
// repaint and a listener per circle would be re-attached on every keystroke.
previewBox.addEventListener("click", (e) => {
  if (!editingId) return;
  const t = e.target;
  const hit = t && t.closest ? t.closest(".panhit") : null;
  if (!hit) return;
  selectPanField(hit.getAttribute("data-field"));
});
// The pan is ONE tab stop and the arrows walk the selection inside it - the
// same contract the slot list had, on the thing the notes are actually drawn
// on. Home and End go to the ends, so a long pan is two keys wide.
previewBox.addEventListener("keydown", (e) => {
  if (!editingId) return;
  let by;
  if (e.key === "ArrowRight" || e.key === "ArrowDown") by = 1;
  else if (e.key === "ArrowLeft" || e.key === "ArrowUp") by = -1;
  else if (e.key === "Home") by = "home";
  else if (e.key === "End") by = "end";
  else return;
  e.preventDefault();
  if (by === "home") { layoutSel = 0; previewLayout(); }
  else if (by === "end") {
    const fields = layoutFields();
    if (!fields) return;
    layoutSel = Math.max(0, syncLayoutOrder(fields) - 1);
    previewLayout();
  } else stepLayoutSel(by);
});
scaleBox.addEventListener("input", updateParse);
// The name is a seed option, so an unusable one is rejected by core.parseSeed
// through the same parse line every other input goes through.
nameBox.addEventListener("input", () => { nameDirty = true; resyncSheet(true); });
degSel.addEventListener("change", () => resyncSheet(true));
scaleBox.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); runGenerate(); } });
// Tab is trapped inside: the sheet's own controls, in visual order.
sheet.addEventListener("keydown", e => {
  if (e.key !== "Tab") return;
  const stops = [backBtn,
                 editingId ? nameBox : null,
                 scaleBox,
                 editingId ? previewBox : null,
                 editingId ? rotL : null, editingId ? rotR : null,
                 editingId ? moveL : null, editingId ? moveR : null,
                 editingId ? resetBtn : null,
                 editingId ? degSel : null,
                 mirrorL, mirrorR, ...swatches.children, genBtn,
                 editingId ? delBtn : null]
    .filter(el => el && !el.disabled);
  const i = stops.indexOf(document.activeElement);
  const next = e.shiftKey ? (i <= 0 ? stops.length - 1 : i - 1) : (i === stops.length - 1 ? 0 : i + 1);
  e.preventDefault();
  stops[next].focus();
});

/* ---------------- interaction ---------------- */
const card = document.getElementById("card");
function flip() { flipped = !flipped; render(); }
function step(dir) {
  idx = (idx + dir + order.length) % order.length;
  flipped = false; render();
}
card.addEventListener("click", flip);
// Bound to #card, so it fires for keys that BUBBLE from any descendant.
// .prints' onclick="event.stopPropagation()" guards the mouse path only:
// without this target check, Enter on a focused print link is swallowed by
// preventDefault() before the anchor activates - no PDF, and the card flips
// instead, revealing the answer in NAME->NOTES mode.
card.addEventListener("keydown", e => {
  if (e.target && e.target.closest && e.target.closest("a, button")) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
});
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.getElementById("shuffle").onclick = function () {
  shuffled = !shuffled; setOrder(); render();
  this.textContent = "Shuffle: " + (shuffled ? "on" : "off");
  this.classList.toggle("on", shuffled);
};
document.getElementById("modeA").onclick = () => setMode("A");
document.getElementById("modeB").onclick = () => setMode("B");
function setMode(m) {
  mode = m; flipped = false; save();
  // .on is a colour; aria-pressed is the state. Both, always together.
  for (const [id, on] of [["modeA", m === "A"], ["modeB", m === "B"]]) {
    const el = document.getElementById(id);
    el.classList.toggle("on", on);
    el.setAttribute("aria-pressed", on ? "true" : "false");
  }
  render();
}
document.addEventListener("keydown", e => {
  // While the sheet is open it owns the keyboard: Escape closes it, and an
  // arrow key is cursor movement inside the box, never a card step.
  if (sheetOpen) {
    if (e.key === "Escape") { e.preventDefault(); closeScaleSheet(); }
    return;
  }
  if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
});
let tx = null;
card.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
card.addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 55) step(dx < 0 ? 1 : -1);
}, { passive: true });

/* ---------------- go ---------------- */
sheet.setAttribute("hidden", ""); buildSwatches(); setMirror(mirror); resyncSheet(true);
// Saved scales are rebuilt BEFORE the stored deck id is resolved, so a custom
// deck that was selected last session is in the registry by the time deck()
// looks for it.
restoreScales();
const wantedDeck = deckId;
deckId = deck().id; storedDeck = deckId; setOrder(); buildChips(); setMode(mode);
// Two fallbacks, deliberately different. An unknown BUILT-IN id is a stale or
// renamed deck and falls back SILENTLY, as it always has. A missing custom: id
// means the user's own saved scale is gone - deleted, or dropped as corrupt -
// and a silent switch would look like the app lost their deck, so say so.
if (wantedDeck !== deckId && wantedDeck.indexOf("custom:") === 0)
  say("That deck is gone. Showing " + deck().name + ".", "warn");
// A page route in the address bar at boot is a RELOAD of a page, or a link
// someone pasted. Neither reopens it: #edit-<id> names a deck this session may
// not have, and a page restored with no entry behind it is one the back
// gesture cannot leave. So the route is replaced away - replaceState, not
// pushState, or the clean URL becomes an entry of its own and back returns to
// the route that was just rejected.
if (location.hash === ADD_ROUTE || location.hash.indexOf(EDIT_ROUTE) === 0)
  history.replaceState(null, "", location.pathname + location.search);
// A share link in the address bar is consumed once, at boot, through the same
// single entry point; it wins over the stored deck because the user just
// followed it. "#s=" is disjoint from the page routes above, so the two reads
// never see each other's hash.
else if (location.hash.indexOf(SHARE_PREFIX) === 0)
  openShare(location.hash.slice(SHARE_PREFIX.length));
</script>
<!-- The print sheet lives outside <main> so `@media print` can hide the app
     without hiding it. It is `hidden` until the CTA fills it and is emptied
     again afterwards (AC-B5); `aria-hidden` keeps a filled sheet out of the
     accessibility tree even in the instant it is populated. -->
<div id="printroot" hidden aria-hidden="true"></div>
<style id="printgeom"></style>
</body>
</html>
