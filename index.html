<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handpan Chord Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=BioRhyme+Expanded:wght@400;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#242424; --sep:#8a8a8a; --paper:#ffffff;
  --table:#17151b; --table2:#221e28;
  --root:#0097B2; --tone:#00BF63; --ga:#0198B1; --gb:#7DD958;
  --card-w:min(88vw, 46vh, 420px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; font-family:Montserrat, system-ui, sans-serif; color:#e8e4ee;
  background: radial-gradient(120% 90% at 50% 8%, var(--table2) 0%, var(--table) 62%);
  display:flex; flex-direction:column; align-items:center;
  min-height:100dvh; padding:max(10px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
  user-select:none;
}
header{width:100%; max-width:520px; text-align:center; margin-bottom:6px}
h1{font-family:Oranienbaum, serif; font-weight:400; font-size:clamp(20px,5.5vw,27px);
   letter-spacing:.04em; margin:2px 0 8px; color:#f2eff6}
.decks{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.chip{
  border:1.5px solid transparent; border-radius:999px; padding:7px 13px 6px;
  font:600 11px/1 Montserrat; letter-spacing:.09em; color:#cfc9da; background:#241f2c;
  cursor:pointer; position:relative;
}
.chip .dot{display:inline-block; width:9px; height:9px; border-radius:50%;
  margin-right:6px; vertical-align:-1px; background:linear-gradient(90deg,var(--dga),var(--dgb))}
.chip.on{color:#fff; border-image:linear-gradient(90deg,var(--dga),var(--dgb)) 1;
  border-radius:999px; border:1.5px solid var(--dga);
  box-shadow:0 0 0 1px color-mix(in srgb, var(--dgb) 55%, transparent)}
.modebar{display:flex; gap:8px; justify-content:center; margin-top:9px}
.mode{border:1px solid #3a3444; border-radius:8px; background:#1d1923; color:#b9b2c6;
  font:600 10.5px/1 Montserrat; letter-spacing:.08em; padding:7px 11px 6px; cursor:pointer}
.mode.on{background:#efeaf6; color:#241f2c; border-color:#efeaf6}
main{flex:1; display:flex; align-items:center; justify-content:center; width:100%; min-height:0}
.scene{width:var(--card-w); aspect-ratio:63/87; perspective:1400px}
.card{position:relative; width:100%; height:100%; transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.2,.7,.25,1); cursor:pointer}
.card.flip{transform:rotateY(180deg)}
@media (prefers-reduced-motion: reduce){ .card{transition:none} }
.face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:var(--paper); border-radius:12px; overflow:hidden;
  box-shadow:0 12px 34px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.4);
  display:flex; flex-direction:column;
}
.face::before{content:""; position:absolute; inset:0; border-radius:12px; padding:2.5px;
  background:linear-gradient(90deg,var(--ga),var(--gb));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none}
.back{transform:rotateY(180deg)}
.hdr{display:flex; justify-content:space-between; align-items:flex-start;
  padding:11px 13px 0; color:var(--ink)}
.hdr .l{font:600 9px/1.5 Montserrat; letter-spacing:.12em; color:var(--ink)}
.hdr .l .num{color:var(--sep); font-weight:400}
.hdr .l .deg{color:var(--root); font-weight:600; letter-spacing:.06em}
.hdr .r{font:600 8px/1.3 Montserrat; letter-spacing:.11em; color:var(--ink);
  text-align:right; max-width:55%; text-transform:uppercase}
.prompt{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:0 16px 26px}
.bigname{font-family:Oranienbaum, serif; color:#545454; line-height:.95; text-align:center}
.bigname sup{font-size:.5em; vertical-align:.55em}
.hint{margin-top:14px; font:600 9.5px/1.6 Montserrat; letter-spacing:.14em; color:#b5b0bd;
  text-transform:uppercase}
.diagwrap{flex:1; display:flex; align-items:center; justify-content:center; min-height:0;
  padding:2px 6px 0}
.diagwrap svg{width:100%; height:100%; max-height:100%}
.lines{padding:0 8px 13px; text-align:center}
.badge{font:600 9px/1 Montserrat; letter-spacing:.14em; color:#E27005; margin-bottom:6px}
.notesline{font-family:"BioRhyme Expanded", serif; font-weight:400;
  font-size:clamp(12px,4.4vw,19px); line-height:1.25; white-space:nowrap}
.numline{font-family:"BioRhyme Expanded", serif; font-weight:400;
  font-size:clamp(12px,4.2vw,18px); line-height:1.2; white-space:nowrap}
.notesline sub{font-size:.62em}
.sepc{color:#9a949f}
footer{width:100%; max-width:520px; display:flex; align-items:center;
  justify-content:space-between; gap:10px; margin-top:10px}
button.nav{flex:0 0 auto; width:56px; height:44px; border-radius:10px; border:1px solid #3a3444;
  background:#1d1923; color:#e8e4ee; font-size:18px; cursor:pointer}
button.nav:active{background:#2a2434}
.mid{flex:1; text-align:center}
.count{font:600 11px/1 Montserrat; letter-spacing:.12em; color:#b9b2c6}
.shuffle{margin-top:7px; background:none; border:none; color:#9d95ad; cursor:pointer;
  font:600 9.5px/1 Montserrat; letter-spacing:.13em; text-transform:uppercase}
.shuffle.on{color:#efeaf6}
:focus-visible{outline:2px solid #bfa8ff; outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>Handpan Chord Cards</h1>
  <nav class="decks" id="decks"></nav>
  <div class="modebar">
    <button class="mode on" id="modeA">NAME &rarr; NOTES</button>
    <button class="mode" id="modeB">NOTES &rarr; NAME</button>
  </div>
</header>

<main>
  <div class="scene">
    <div class="card" id="card" role="button" aria-label="Flip card" tabindex="0">
      <div class="face front" id="front"></div>
      <div class="face back" id="back"></div>
    </div>
  </div>
</main>

<footer>
  <button class="nav" id="prev" aria-label="Previous card">&larr;</button>
  <div class="mid">
    <div class="count" id="count"></div>
    <button class="shuffle" id="shuffle">Shuffle: off</button>
  </div>
  <button class="nav" id="next" aria-label="Next card">&rarr;</button>
</footer>

<script>
const DECKS = [{"id": "hijaz", "name": "C# HIJAZ 9", "sub": "ORION  -  8 + 1", "colors": {"root": "#E0559A", "tone": "#E2761B", "ga": "#E0559A", "gb": "#E2761B"}, "degrees": {"1": "I", "2": "bII", "6": "iv", "8": "v\u00b0", "11": "bvii"}, "geom": {"rim": 0.745, "r_ding": 0.2, "r_note": 0.19, "inner_ring": 0.355, "f_ding": 0.135, "f_note": 0.128, "f_num": 0.105, "n_in": 0.085, "n_out": 0.0, "r_bnote": 0.0, "f_bnote": 0.0}, "fields": {"0": ["C#", 3, 49, "ding", null, "Ding"], "1": ["G#", 3, 56, "rim", 270, "1"], "2": ["B", 3, 59, "rim", 225, "2"], "3": ["C#", 4, 61, "rim", 315, "3"], "4": ["D", 4, 62, "rim", 180, "4"], "5": ["F", 4, 65, "rim", 0, "5"], "6": ["F#", 4, 66, "rim", 135, "6"], "7": ["G#", 4, 68, "rim", 45, "7"], "8": ["B", 4, 71, "rim", 90, "8"]}, "chords": [{"main": "C#", "sup": "", "subtitle": "C# DUR / C# MAJOR", "fields": [3, 5, 7], "roots": [3]}, {"main": "C#5", "sup": "", "subtitle": "POWER CHORD", "fields": [3, 7], "roots": [3]}, {"main": "C#sus", "sup": "4", "subtitle": "SUSPENDED CHORD", "fields": [3, 6, 7], "roots": [3]}, {"main": "C#", "sup": "7", "subtitle": "C# DOMINANT 7", "fields": [3, 5, 7, 8], "roots": [3]}, {"main": "C#7sus", "sup": "4", "subtitle": "SUSPENDED DOMINANT 7", "fields": [3, 6, 7, 8], "roots": [3]}, {"main": "C#7", "sup": "b9", "subtitle": "HIJAZ SIGNATURE CHORD", "fields": [3, 5, 7, 8, 4], "roots": [3]}, {"main": "Bm", "sup": "", "subtitle": "H MOLL / B MINOR", "fields": [2, 4, 6], "roots": [2]}, {"main": "Bm", "sup": "", "subtitle": "B MINOR - HIGH VOICING", "fields": [8, 4, 6], "roots": [8]}, {"main": "B5", "sup": "", "subtitle": "POWER CHORD", "fields": [2, 6], "roots": [2]}, {"main": "Bm", "sup": "add9", "subtitle": "H MOLL ADD 9 / B MINOR ADD 9", "fields": [2, 4, 6, 3], "roots": [2]}, {"main": "Bm", "sup": "6/9", "subtitle": "H MOLL 6/9 / B MINOR 6/9", "fields": [2, 4, 6, 7, 3], "roots": [2]}, {"main": "G#\u00b0", "sup": "", "subtitle": "VERMINDERT / DIMINISHED", "fields": [1, 2, 4], "roots": [1]}, {"main": "G#m7", "sup": "b5", "subtitle": "HALBVERMINDERT  ( = Bm6 )", "fields": [1, 2, 4, 6], "roots": [1]}, {"main": "F#sus", "sup": "4", "subtitle": "SUSPENDED CHORD", "fields": [6, 8, 3], "roots": [6]}, {"main": "F#maj7sus", "sup": "4", "subtitle": "SUSPENDED MAJOR 7", "fields": [6, 8, 3, 5], "roots": [6]}, {"main": "D\u00b0", "sup": "7", "subtitle": "VERMINDERT 7 / DIMINISHED 7", "fields": [4, 5, 7, 8], "roots": [4]}, {"main": "Dmaj", "sup": "7", "subtitle": "D DUR 7 / D MAJOR 7 (NO 5)", "fields": [4, 6, 3], "roots": [4]}, {"main": "Dmaj7", "sup": "#11", "subtitle": "D MAJOR 7 SHARP 11 (NO 5)", "fields": [4, 6, 3, 7], "roots": [4]}]}, {"id": "pygmy", "name": "F3 LOW PYGMY 18", "sub": "11 + 1 TOP  /  6 BOTTOM", "colors": {"root": "#6D40A3", "tone": "#C9971E", "ga": "#6D40A3", "gb": "#C9971E"}, "degrees": {"5": "i", "8": "III", "10": "iv", "0": "v", "1": "VI", "3": "VII", "7": "ii\u00b0"}, "geom": {"rim": 0.722, "inner": 0.38, "bottom": 1.15, "r_ding": 0.19, "ding_dy": 0.1425, "r_note": 0.1425, "r_bnote": 0.1188, "inner_ring": null, "f_ding": 0.114, "f_note": 0.109, "f_bnote": 0.0931, "f_num": 0.0912, "n_in": 0.052, "n_out": 0.068, "rim_num_out": true}, "fields": {"0": ["F", 3, 53, "ding", null, "Ding"], "1": ["G", 3, 55, "rim", 290, "1"], "2": ["Ab", 3, 56, "rim", 250, "2"], "3": ["C", 4, 60, "rim", 330, "3"], "4": ["Eb", 4, 63, "rim", 210, "4"], "5": ["F", 4, 65, "rim", 10, "5"], "6": ["G", 4, 67, "rim", 170, "6"], "7": ["Ab", 4, 68, "rim", 50, "7"], "8": ["C", 5, 72, "rim", 130, "8"], "9": ["Eb", 5, 75, "rim", 90, "9"], "10": ["F", 5, 77, "inner", 128, "10"], "11": ["G", 5, 79, "inner", 52, "11"], "101": ["C", 3, 48, "bottom", 300, "U1"], "102": ["Db", 3, 49, "bottom", 240, "U2"], "103": ["Eb", 3, 51, "bottom", 0, "U3"], "104": ["Bb", 3, 58, "bottom", 180, "U4"], "105": ["Db", 4, 61, "bottom", 60, "U5"], "106": ["Ab", 5, 80, "bottom", 120, "U6"]}, "chords": [{"main": "Fm", "sup": "", "subtitle": "F MOLL / F MINOR", "fields": [5, 7, 8], "roots": [5]}, {"main": "F5", "sup": "", "subtitle": "POWER CHORD", "fields": [5, 8], "roots": [5]}, {"main": "Fsus", "sup": "4", "subtitle": "SUSPENDED CHORD", "fields": [5, 104, 8], "roots": [5]}, {"main": "Fm", "sup": "7", "subtitle": "F MOLL 7 / F MINOR 7", "fields": [5, 7, 8, 9], "roots": [5]}, {"main": "Fm", "sup": "9", "subtitle": "F MOLL 9 / F MINOR 9", "fields": [5, 7, 8, 9, 11], "roots": [5]}, {"main": "Fm", "sup": "11", "subtitle": "F MINOR 11 - FULL SCALE", "fields": [5, 7, 8, 9, 11, 104], "roots": [5]}, {"main": "Ab", "sup": "", "subtitle": "AS DUR / Ab MAJOR", "fields": [2, 3, 4], "roots": [2]}, {"main": "Ab", "sup": "", "subtitle": "Ab MAJOR - HIGH VOICING", "fields": [7, 8, 9], "roots": [7]}, {"main": "Abmaj", "sup": "7", "subtitle": "AS DUR 7 / Ab MAJOR 7", "fields": [2, 3, 4, 6], "roots": [2]}, {"main": "Abmaj", "sup": "9", "subtitle": "AS DUR 9 / Ab MAJOR 9", "fields": [2, 3, 4, 6, 104], "roots": [2]}, {"main": "Bbm", "sup": "", "subtitle": "B MOLL / Bb MINOR", "fields": [104, 105, 5], "roots": [104]}, {"main": "Bbm", "sup": "7", "subtitle": "B MOLL 7  ( = Db6 )", "fields": [104, 105, 5, 7], "roots": [104]}, {"main": "Cm", "sup": "", "subtitle": "C MINOR - LOW VOICING", "fields": [101, 103, 1], "roots": [101]}, {"main": "Cm", "sup": "", "subtitle": "C MOLL / C MINOR", "fields": [3, 4, 6], "roots": [3]}, {"main": "Cm", "sup": "", "subtitle": "C MINOR - HIGH VOICING", "fields": [8, 9, 11], "roots": [8]}, {"main": "C5", "sup": "", "subtitle": "POWER CHORD", "fields": [3, 6], "roots": [3]}, {"main": "Csus", "sup": "4", "subtitle": "SUSPENDED CHORD", "fields": [3, 5, 6], "roots": [3]}, {"main": "Cm", "sup": "7", "subtitle": "C MOLL 7 / C MINOR 7", "fields": [3, 4, 6, 104], "roots": [3]}, {"main": "Db", "sup": "", "subtitle": "DES DUR / Db MAJOR", "fields": [105, 5, 7], "roots": [105]}, {"main": "Dbmaj", "sup": "7", "subtitle": "DES DUR 7 / Db MAJOR 7", "fields": [105, 5, 7, 8], "roots": [105]}, {"main": "Eb", "sup": "", "subtitle": "Eb MAJOR - LOW VOICING", "fields": [103, 1, 104], "roots": [103]}, {"main": "Eb", "sup": "", "subtitle": "ES DUR / Eb MAJOR", "fields": [4, 6, 104], "roots": [4]}, {"main": "Eb", "sup": "7", "subtitle": "ES DUR 7 / Eb DOMINANT 7", "fields": [103, 1, 104, 105], "roots": [103]}, {"main": "G\u00b0", "sup": "", "subtitle": "VERMINDERT / DIMINISHED", "fields": [1, 104, 105], "roots": [1]}, {"main": "Gm7", "sup": "b5", "subtitle": "HALBVERMINDERT / HALF-DIM", "fields": [1, 104, 105, 5], "roots": [1]}]}, {"id": "amara", "name": "D AMARA 9", "sub": "8 + 1", "colors": {"root": "#0097B2", "tone": "#00BF63", "ga": "#0198B1", "gb": "#7DD958"}, "degrees": {"2": "i", "9": "v", "7": "IV", "0": "bVII", "5": "bIII"}, "geom": {"rim": 0.745, "r_ding": 0.2, "r_note": 0.19, "inner_ring": 0.355, "f_ding": 0.135, "f_note": 0.128, "f_num": 0.105, "n_in": 0.085, "n_out": 0.0, "r_bnote": 0.0, "f_bnote": 0.0}, "fields": {"0": ["D", 3, 50, "ding", null, "Ding"], "1": ["A", 3, 57, "rim", 270, "1"], "2": ["C", 4, 60, "rim", 225, "2"], "3": ["D", 4, 62, "rim", 315, "3"], "4": ["E", 4, 64, "rim", 180, "4"], "5": ["F", 4, 65, "rim", 0, "5"], "6": ["G", 4, 67, "rim", 135, "6"], "7": ["A", 4, 69, "rim", 45, "7"], "8": ["C", 5, 72, "rim", 90, "8"]}, "chords": [{"main": "Dm", "sup": "", "subtitle": "D MOLL / D MINOR", "fields": [3, 5, 7], "roots": [3]}, {"main": "Dm", "sup": "7", "subtitle": "D MOLL 7 / D MINOR 7", "fields": [3, 5, 7, 8], "roots": [3]}, {"main": "D5", "sup": "", "subtitle": "POWER CHORD", "fields": [3, 7], "roots": [3]}, {"main": "Dsus", "sup": "4", "subtitle": "SUSPENDED CHORD", "fields": [3, 6, 7], "roots": [3]}, {"main": "Am", "sup": "", "subtitle": "A MOLL / A MINOR", "fields": [1, 2, 4], "roots": [1]}, {"main": "Am", "sup": "7", "subtitle": "A MOLL 7 / A MINOR 7", "fields": [1, 2, 4, 6], "roots": [1]}, {"main": "A5", "sup": "", "subtitle": "POWER CHORD", "fields": [1, 4], "roots": [1]}, {"main": "Asus", "sup": "4", "subtitle": "SUSPENDED CHORD", "fields": [1, 3, 4], "roots": [1]}, {"main": "G5", "sup": "", "subtitle": "POWER CHORD", "fields": [6, 3], "roots": [6]}, {"main": "Gsus", "sup": "4", "subtitle": "SUSPENDED CHORD", "fields": [6, 2, 3], "roots": [6]}, {"main": "C", "sup": "", "subtitle": "C DUR / C MAJOR", "fields": [2, 4, 6], "roots": [2]}, {"main": "C5", "sup": "", "subtitle": "POWER CHORD", "fields": [2, 6], "roots": [2]}, {"main": "Csus", "sup": "4", "subtitle": "SUSPENDED CHORD", "fields": [2, 5, 6], "roots": [2]}, {"main": "F", "sup": "", "subtitle": "F DUR / F MAJOR", "fields": [5, 7, 8], "roots": [5]}, {"main": "F5", "sup": "", "subtitle": "POWER CHORD", "fields": [5, 8], "roots": [5]}, {"main": "Fmaj", "sup": "7", "subtitle": "F DUR 7 / F MAJOR 7", "fields": [5, 1, 2, 4], "roots": [5]}]}];

/* ---------------- state ---------------- */
let store = {};
try { store = JSON.parse(localStorage.getItem("hpfc") || "{}"); } catch (e) {}
let deckId = store.deck || "hijaz";
let mode   = store.mode || "A";       // A: name->notes, B: notes->name
let shuffled = false;
let order = [], idx = 0, flipped = false;

const deck = () => DECKS.find(d => d.id === deckId) || DECKS[0];
const save = () => { try { localStorage.setItem("hpfc", JSON.stringify({deck: deckId, mode})); } catch (e) {} };

/* ---------------- helpers ---------------- */
const pc = (d, f) => d.fields[f][2] % 12;
function chordSets(d, ch) {
  const pcs = new Set(ch.fields.map(f => pc(d, f)));
  const rpc = pc(d, ch.roots[0]);
  const blue = new Set(), green = new Set();
  for (const f in d.fields) {
    const p = pc(d, +f);
    if (p === rpc) blue.add(+f);
    else if (pcs.has(p)) green.add(+f);
  }
  return { blue, green, rpc };
}
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* ---------------- SVG pan ---------------- */
function pan(d, ch) {
  const g = d.geom, R = 100;
  const { blue, green } = chordSets(d, ch);
  const C = d.colors;
  const hasBottom = !!g.bottom;
  const ext = hasBottom ? R * (g.bottom + g.r_bnote + g.n_out) + 14 : R * 1.06;
  let s = `<svg viewBox="${-ext} ${-ext} ${2*ext} ${2*ext}" xmlns="http://www.w3.org/2000/svg">`;

  const P = (orb, ang) => [orb * Math.cos(ang * Math.PI / 180), -orb * Math.sin(ang * Math.PI / 180)];

  if (hasBottom)
    s += `<circle r="${R*g.bottom}" fill="none" stroke="#e2e2e2" stroke-width="1.4" stroke-dasharray="4 4"/>`;
  s += `<circle r="${R}" fill="none" stroke="#000" stroke-width="2"/>`;
  if (g.inner_ring)
    s += `<circle r="${R*g.inner_ring}" fill="none" stroke="#000" stroke-width="1"/>`;

  function field(x, y, r, id, isBottom) {
    const st = blue.has(id) ? "root" : green.has(id) ? "tone" : isBottom ? "offb" : "off";
    let out = "";
    if (st === "offb")
      out += `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="3 3"/>`;
    else
      out += `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="#000" stroke-width="1.1"/>`;
    if (st === "root" || st === "tone") {
      out += `<circle cx="${x}" cy="${y}" r="${r*0.87}" fill="none" stroke="${st==="root"?C.root:C.tone}" stroke-width="${r*0.24}"/>`;
      out += `<circle cx="${x}" cy="${y}" r="${r*0.74}" fill="none" stroke="#000" stroke-width="0.9"/>`;
    }
    return out;
  }
  function label(x, y, name, oct, fs, col) {
    return `<text x="${x}" y="${y + fs*0.34}" text-anchor="middle" fill="${col}"
      font-family="Montserrat, sans-serif" font-size="${fs}">${esc(name)}<tspan
      font-size="${fs*0.66}" dy="${fs*0.18}">${oct}</tspan></text>`;
  }

  for (const fid in d.fields) {
    const id = +fid;
    const [name, oct, , zone, ang, lab] = d.fields[fid];
    if (zone === "ding") {
      const dy = (g.ding_dy || 0) * R, rr = R * g.r_ding;
      s += field(0, dy, rr, id, false);
      s += label(0, dy, name, oct, R * g.f_ding * 1.05, "#242424");
      continue;
    }
    const isB = zone === "bottom";
    const orb = R * (isB ? g.bottom : zone === "inner" ? g.inner : g.rim);
    const rr  = R * (isB ? g.r_bnote : g.r_note);
    const [x, y] = P(orb, ang);
    s += field(x, y, rr, id, isB);
    const lit = blue.has(id) || green.has(id);
    s += label(x, y, name, oct, R * (isB ? g.f_bnote : g.f_note) * 1.05,
               isB && !lit ? "#8a8a8a" : "#242424");
    // numbers
    let nr, col, fs = R * g.f_num;
    if (isB) { nr = orb + rr + R * g.n_out; col = "#E27005"; }
    else if (zone === "rim" && g.rim_num_out) { nr = orb + rr + R * g.n_in; col = "#333"; }
    else { nr = orb - rr - R * g.n_in; col = "#333"; }
    const [nx, ny] = P(nr, ang);
    s += `<text x="${nx}" y="${ny + fs*0.34}" text-anchor="middle" fill="${col}"
      font-family="Montserrat, sans-serif" font-weight="${isB?600:400}" font-size="${fs}">${lab}</text>`;
  }
  return s + "</svg>";
}

/* ---------------- card faces ---------------- */
function headerHTML(d, ch, n) {
  const deg = d.degrees[String(pc(d, ch.roots[0]))] || "";
  return `<div class="hdr">
    <div class="l">${esc(d.name)}<br><span class="num">#${n}</span>
      ${deg ? `&nbsp;<span class="deg">${esc(deg)}</span>` : ""}</div>
    <div class="r">${esc(ch.subtitle)}</div></div>`;
}
function nameHTML(ch, big) {
  const len = (ch.main + ch.sup).length;
  const size = big ? `clamp(34px, ${Math.min(19, 120/len)}vw, ${len > 7 ? 64 : 92}px)` : "inherit";
  return `<div class="bigname" style="font-size:${size}">${esc(ch.main)}${ch.sup ? `<sup>${esc(ch.sup)}</sup>` : ""}</div>`;
}
function linesHTML(d, ch) {
  const C = d.colors, rpc = pc(d, ch.roots[0]);
  const seg = (arr, render) => arr.map(render).join(`<span class="sepc"> - </span>`);
  const notes = seg(ch.fields, f => {
    const [nm, oc] = d.fields[f];
    const col = pc(d, f) === rpc ? C.root : C.tone;
    return `<span style="color:${col}">${esc(nm)}<sub>${oc}</sub></span>`;
  });
  const nums = seg(ch.fields, f => {
    const col = pc(d, f) === rpc ? C.root : C.tone;
    return `<span style="color:${col}">${esc(d.fields[f][5])}</span>`;
  });
  const nb = ch.fields.filter(f => d.fields[f][3] === "bottom").length;
  return `<div class="lines">
    ${nb ? `<div class="badge">${nb} BOTTOM NOTE${nb > 1 ? "S" : ""}</div>` : ""}
    <div class="notesline">${notes}</div>
    <div class="numline">${nums}</div></div>`;
}
function render() {
  if (!order.length) return;
  const d = deck(), n = order[idx] + 1, ch = d.chords[order[idx]];
  document.documentElement.style.setProperty("--root", d.colors.root);
  document.documentElement.style.setProperty("--tone", d.colors.tone);
  document.documentElement.style.setProperty("--ga", d.colors.ga);
  document.documentElement.style.setProperty("--gb", d.colors.gb);

  const answer = headerHTML(d, ch, n) +
    `<div class="diagwrap">${pan(d, ch)}</div>` + linesHTML(d, ch);
  const question = headerHTML(d, ch, n) +
    `<div class="prompt">${nameHTML(ch, true)}
     <div class="hint">Tap to reveal the notes</div></div>`;
  const questionB = headerHTML(d, { ...ch, subtitle: "WHICH CHORD IS THIS?" }, n) +
    `<div class="diagwrap">${pan(d, ch)}</div>
     <div class="lines"><div class="hint" style="margin:0 0 12px">Tap to reveal the name</div></div>`;
  const answerB = headerHTML(d, ch, n) +
    `<div class="prompt">${nameHTML(ch, true)}</div>` + linesHTML(d, ch);

  document.getElementById("front").innerHTML = mode === "A" ? question : questionB;
  document.getElementById("back").innerHTML  = mode === "A" ? answer   : answerB;
  document.getElementById("count").textContent = `${idx + 1} / ${order.length}`;
  document.getElementById("card").classList.toggle("flip", flipped);
}

/* ---------------- deck / order ---------------- */
function setOrder() {
  const n = deck().chords.length;
  order = [...Array(n).keys()];
  if (shuffled) for (let i = n - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]];
  }
  idx = 0; flipped = false;
}
function buildChips() {
  const nav = document.getElementById("decks");
  nav.innerHTML = "";
  for (const d of DECKS) {
    const b = document.createElement("button");
    b.className = "chip" + (d.id === deckId ? " on" : "");
    b.style.setProperty("--dga", d.colors.ga);
    b.style.setProperty("--dgb", d.colors.gb);
    b.innerHTML = `<span class="dot"></span>${esc(d.name)}`;
    b.onclick = () => { deckId = d.id; save(); setOrder(); buildChips(); render(); };
    nav.appendChild(b);
  }
}

/* ---------------- interaction ---------------- */
const card = document.getElementById("card");
function flip() { flipped = !flipped; render(); }
function step(dir) {
  idx = (idx + dir + order.length) % order.length;
  flipped = false; render();
}
card.addEventListener("click", flip);
card.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); } });
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.getElementById("shuffle").onclick = function () {
  shuffled = !shuffled; setOrder(); render();
  this.textContent = "Shuffle: " + (shuffled ? "on" : "off");
  this.classList.toggle("on", shuffled);
};
document.getElementById("modeA").onclick = () => setMode("A");
document.getElementById("modeB").onclick = () => setMode("B");
function setMode(m) {
  mode = m; flipped = false; save();
  document.getElementById("modeA").classList.toggle("on", m === "A");
  document.getElementById("modeB").classList.toggle("on", m === "B");
  render();
}
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
});
let tx = null;
card.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
card.addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 55) step(dx < 0 ? 1 : -1);
}, { passive: true });

/* ---------------- go ---------------- */
deckId = deck().id; setOrder(); buildChips(); setMode(mode);
</script>
</body>
</html>
