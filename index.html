<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- interactive-widget=resizes-content: when the soft keyboard opens, shrink the
     LAYOUT viewport rather than only the visual one, so 100dvh (the scale
     page's height) shrinks with it and the page sits above the keyboard instead
     of behind it (queue row 212). Chromium honours it; browsers that do not
     ignore the token and keep the default resizes-visual, which is why the
     page's primary sits in a reserved footer outside the scroll rather than
     relying on this token alone. -->
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Handpan Chord Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Bitter:wght@400;700&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#242424; --sep:#8a8a8a; --paper:#ffffff;
  --table:#1a1815; --table2:#26221c;
  --root:#0B7B75; --tone:#DD8F00; --ga:#0B7B75; --gb:#DD8F00;
  --card-w:min(88vw, 46vh, 420px);
  /* ---- the spacing ramp ------------------------------------------------
     One value (9px, and 1-2px in the chrome) used to do every job here, so
     nothing grouped and nothing separated - which is what the owner reported
     on an iPhone 14 and on desktop alike: "there is not enough spacing between
     each ui component". Four steps, each with exactly ONE job:

       --sp-1   inside a group: a label to the control it names
       --sp-2   between peers in one group: chips, mode buttons, mirror pair
       --sp-3   between groups: the rows of the sheet, the rows of the header
       --sp-4   around a surface, and between a scrolling body and its footer

     If something seems to need a fifth step it is usually two groups, not one
     gap. The desktop step-up below is the same ramp with more air; it is
     deliberately gated on BOTH axes so that no phone viewport - portrait or
     landscape - ever picks it up and spends the chrome budget on it. */
  --sp-1:4px; --sp-2:8px; --sp-3:14px; --sp-4:22px;
}
@media (min-width:640px) and (min-height:700px){
  :root{--sp-1:6px; --sp-2:12px; --sp-3:20px; --sp-4:28px}
}
/* A phone in landscape has 390 CSS px of height and the sheet is capped at 85%
   of it, so air there costs the SCROLLING BODY its whole height - the primary
   is outside the scroll, so the first thing an over-generous ramp does is push
   the box the user is typing into out of sight. The ramp keeps its proportions
   and gives back roughly a third; the rhythm still reads because it is the
   RATIOS that group things, not the absolute values. */
@media (max-height:520px){
  :root{--sp-1:3px; --sp-2:6px; --sp-3:9px; --sp-4:14px}
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
/* Row 95: .decks (:108-ish) and the sheet (:414, :452) already set
   overscroll-behavior:contain on themselves, but nothing stopped a HORIZONTAL
   drag on the card - the swipe target - from falling through to the root and
   on to the browser's own overscroll gesture (Android Chrome's back
   navigation from a centre drag; the iPhone 14/iOS 26.6 back-swipe is the
   same class of gesture from a screen edge). Both touch listeners are
   `{ passive: true }` so JS cannot preventDefault() its way out of this - the
   only fix is CSS on the root, scoped to the X axis only so vertical
   scrolling (the sheet, .decks) is untouched. */
html{overscroll-behavior-x:none}
html,body{height:100%}
body{
  margin:0; font-family:"Nunito Sans", system-ui, sans-serif; color:#eae6df;
  background: radial-gradient(120% 90% at 50% 8%, var(--table2) 0%, var(--table) 62%);
  display:flex; flex-direction:column; align-items:center;
  min-height:100dvh;
  /* All four edges, not two (queue row 223c and the notch). The meta tag sets
     viewport-fit=cover, so the page is laid out edge to edge and iOS hands the
     insets back through env(). Top and bottom were already reserved; LEFT and
     RIGHT are the pair that is non-zero in LANDSCAPE - the notch on one side,
     the rounded corner on the other - which is the orientation the header
     query above has just made worth using. Each inset is floored at the
     original padding with max(), so a device that reports no inset at all
     (every desktop, and Chromium in the e2e harness) measures exactly what it
     measured before: 10px / 12px / 12px / 12px. */
  padding:max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  user-select:none;
}
/* ---- the chrome budget -------------------------------------------------
   `main` is flex:1 and .scene is height:min(100%, ...), so on every viewport
   where the VERTICAL axis binds - which is most phones once Safari's toolbar
   is showing, and every phone in landscape - a pixel added to the header or
   the footer comes off the CARD, one for one.

   Raising .mode and .shuffle to the 44px minimum grew the header by 18.5px
   and the footer by 11px. That 29.5px was paid for HERE, by squeezing the
   margins between the title, the deck row, the mode row and the card down to
   1-2px - which is exactly the crowding the owner then reported ("there is not
   enough spacing between each ui component"), on the phone and on the desktop.

   The room to undo that came from MOVING "+ ADD" into the deck strip as its
   first chip (see .chip.add below). That retired a whole second row - a 44px
   chip plus a 6px gap, 50px of header - and the ramp above spends 45.5px of it
   putting real gaps back: h1 2 -> 8, .modebar 1.5 -> 14, header 1 -> 14,
   footer 1 -> 14. The net is 4.5px OFF the chrome, so the card gets very
   slightly bigger at every viewport where the vertical axis binds, and the
   header reads as three separated groups instead of one block.

   Desktop takes the wider rung of the ramp (the media query above), which is
   gated on both axes so no phone viewport in the CHROME_BUDGET table can reach
   it.

   tests/e2e.test.js "the header and footer stay inside their pixel budget"
   pins this against measured numbers. assertCardFits CANNOT: it derives its
   expectation from the current main height, so it moves with the regression.
   ------------------------------------------------------------------------ */
header{width:100%; max-width:520px; text-align:center; margin-bottom:var(--sp-3)}
h1{font-family:Marcellus, serif; font-weight:400; font-size:clamp(20px,5.5vw,27px);
   letter-spacing:.04em; margin:0 0 var(--sp-2); color:#f4f0e8}
/* The chip row scrolls horizontally and never wraps; auto margins on the end
   chips keep it centred while it fits, without making either end unreachable
   once it overflows. The right edge fades so a cut-off chip reads as "more". */
.decks{display:flex; gap:var(--sp-2); flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none;
  -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(90deg,#000 0 calc(100% - 22px), transparent 100%);
  mask-image:linear-gradient(90deg,#000 0 calc(100% - 22px), transparent 100%)}
.decks::-webkit-scrollbar{display:none}
/* On a desktop the 520px column that suits the card is the wrong measure for
   the deck strip: four chips already overflow it and the fade makes a machine
   with 1280px of width look as cramped as a phone. Widen the header - and only
   the header - so the strip uses the room that is actually there. The card is
   sized by --card-w and is untouched by this. */
@media (min-width:640px){
  header{max-width:min(92vw, 900px)}
}
.decks > :first-child{margin-left:auto}
.decks > :last-child{margin-right:auto}
.chip{
  flex:0 0 auto; min-height:44px; display:inline-flex; align-items:center;
  border:1.5px solid transparent; border-radius:999px; padding:7px 13px 6px;
  font:600 11px/1 "Nunito Sans"; letter-spacing:.09em; color:#d5cec2; background:#272219;
  cursor:pointer; position:relative; white-space:nowrap;
}
.chip.add{background:none; border:1.5px dashed #5a5142; color:#a79d8b}
/* "+ ADD" is the FIRST chip in the strip, in normal flow with the deck chips
   (owner, 2026-09: "'Add' call to action can be inline as first option with the
   different scale selections to save vertical space"). Being first, it is on
   screen at rest at every width; being in flow, it costs no second row - and
   the ~50px of header that row used to take is what pays for the spacing ramp
   at the top of this stylesheet.

   The cost this arrangement DOES carry, named so nobody has to rediscover it:
   past three or four decks the strip overflows, and buildChips scrolls the
   SELECTED chip into view - so after generating a deck "+ ADD" is parked off
   the left edge until the user flicks back. That is a scroll away, not a dead
   end, which is the trade the owner asked for.

   Row 214 - the history, kept because the lesson is still live. An earlier fix
   for an unreachable "+ ADD" pinned it OVER the strip with position:sticky.
   An overlay is only ever on TOP of the chips, never beside them, so a deck
   chip could come to rest underneath it - fully visible and no longer tappable:
   elementFromPoint at the centre of "D AMARA 9" returned the pinned button, and
   tapping the deck opened the create sheet instead of switching decks. The
   defect was the OVERLAP, not the position: a chip in normal flow INSIDE the
   strip overlaps nothing, so no chip can rest beneath it, and nothing here may
   ever reintroduce position:sticky, a negative margin or a z-index that lifts
   this button off the line. tests/e2e.test.js "no deck chip ever rests under
   + ADD, at any width, state or scroll" hit-tests every chip at three points
   and is what holds that.

   The other arrangement rejected at the time - a fixed column BESIDE the strip
   - was rejected on WIDTH: at 380-390px a reserved column narrows the
   scrollport enough to push the last built-in deck out of it. A chip that
   scrolls WITH the others reserves nothing, so that objection does not reach
   this one either.

   In normal flow "+ ADD" also cannot lag behind iOS momentum scrolling, needs
   no safe-area inset of its own (the strip is centred and capped at 520px, far
   inside any notch), and takes no touch-action override, so a swipe that starts
   on it still scrolls the strip. */
/* The pencil on a SELECTED CUSTOM chip (queue row 218). A second tap on that
   one chip is the only way into the Edit sheet, and until now a selected
   custom chip looked exactly like a selected built-in, which does nothing
   when tapped - so the owner had to guess. The glyph says which chip has a
   second action.
   It is generated CONTENT on the chip, not an element: the chip is already a
   44px target with an onclick that does exactly this, so a child would only
   add a smaller target inside the pill - and, as a real node, it would put
   the glyph inside the chip's textContent, where every reader of the chip's
   LABEL (the tests, and anything that ever reads a chip to announce it) would
   then have to know to skip it. A ::after cannot leak that way. buildChips
   marks the chip with .editable and sets aria-label="Edit <name>", which is
   what a screen reader gets; the glyph is decoration.
   Row 262 is why it appears nowhere else: any affordance on a NON-selected
   chip invites a fix that opens Edit from one, and deleteDeck still drops
   focus to <body> on that path. */
.chip.editable::after{content:"\270E"; margin-left:6px; font-size:12px; line-height:1;
  opacity:.85}
.chip .dot{display:inline-block; width:9px; height:9px; border-radius:50%;
  margin-right:6px; vertical-align:-1px; background:linear-gradient(180deg,var(--dga) 0 50%,var(--dgb) 50% 100%)}
.chip.on{color:#fff; border-image:linear-gradient(180deg,var(--dga) 0 50%,var(--dgb) 50% 100%) 1;
  border-radius:999px; border:1.5px solid var(--dga);
  box-shadow:0 0 0 1px color-mix(in srgb, var(--dgb) 55%, transparent)}
.modebar{display:flex; gap:var(--sp-2); justify-content:center; margin-top:var(--sp-3)}
/* min-height, NOT an oversized ::after overlay. The two are not equivalent:
   an overlay 44px tall on a 25.5px button hangs 9.25px past each edge, and
   .modebar has --sp-3 of margin above it and `main` below, so in landscape -
   where the ramp is at its narrowest rung and the card is already the binding
   axis - the overlay would lie over the card. An overlay that
   reaches outside its element is the row-214 defect in another costume. Making
   the box itself 44px cannot steal from a neighbour: normal flow gives it the
   room. Precedent: .chip, button.nav, #scale-generate and #scale-delete
   are already sized this way. The label stays optically where it was via flex centring; the vertical
   padding is now inert but is kept so the button still measures 25.5px if the
   min-height is ever removed. */
.mode{border:1px solid #433b2c; border-radius:8px; background:#211d16; color:#c4bcab;
  font:600 10.5px/1 "Nunito Sans"; letter-spacing:.08em; padding:7px 11px 6px; cursor:pointer;
  min-height:44px; display:inline-flex; align-items:center; justify-content:center}
.mode.on{background:#f1ece1; color:#272219; border-color:#f1ece1}
/* ---- landscape: the header is ONE row ---------------------------------
   Queue row 245, owner decision. Held sideways, an iPhone 14 is 390px tall
   and the STACKED header spent 134 of them - the title, the deck strip and
   the mode bar are three rows plus their gaps - so `main` was left 138.3px
   and the fit rule capped the card at 100.2px wide. The row offered two
   paths and the owner took this one: shrink the header in landscape.

   The deck strip and the mode bar go side by side instead of on top of each
   other: in landscape the horizontal axis is the one with room to spare
   (844px against 390), which is exactly the axis a stack refuses to use.
   Measured: header 134 -> 44, chrome 251.67 -> 158.67, and the card at
   844x390 goes 100.16 -> 167.5px wide, +67%.

   The title is the one thing that goes, and only VISUALLY - it keeps its box
   in the accessibility tree, so the page still has its h1 and the landmark
   still has its name. It has to go, and shrinking it is not enough: the deck
   strip needs 463px for its chips and the mode bar takes 241 of the 643
   available at 667x375, so a title of ANY width leaves the strip overflowing.
   An overflowing strip is not merely tight - selecting a deck scrolls the
   chip that opened the sheet out from under the thumb, which is what
   "in landscape every control stays tappable" caught when the title was
   merely made small.

   With the title out the strip gets the whole width, and on the two WIDER
   rows it then fits: measured 2026-09-15, .decks scrollWidth/clientWidth is
   652/652 at 926x428 and 1006/1006 at 1280x500, custom deck included. The
   two narrow rows still overflow and SCROLL - .decks is overflow-x:auto, so
   an over-wide strip is a scroll and never a clip. With one custom deck on
   the strip that is 611/570 at 844x390 (41px) and 611/393 at 667x375
   (218px); with the three built-ins alone 667x375 is 463/393 (70px), which
   is just the arithmetic three lines up. The title was never what stood
   between this row and a strip that fits, and chasing those 41px with a
   layout change is not worth what it would cost the card (owner, 2026-09).
   Both ends stay reachable, which is the thing that actually has to hold
   here: the auto margins on the end chips centre the row while it fits and
   collapse once it does not. tests/e2e.test.js "the landscape deck strip
   scrolls rather than clips, at both ends" pins that, and pins the sign of
   the overflow so this paragraph cannot quietly go stale again.

   The 44px floor on .chip and .mode is untouched - the row is as tall as the
   targets in it, which is the whole 44px and not a pixel more. The header
   also drops its 520px measure here: the strip needs the real width, and the
   card is sized by --card-w, so widening the header cannot touch it.

   Gated on max-height, NOT on orientation. Portrait's acceptance condition
   for row 245 is that it stays byte-identical, and no portrait phone in the
   CHROME_BUDGET table is under 520px tall, so the query cannot reach one -
   the same gate, and the same reasoning, as the spacing ramp at the top of
   this stylesheet. tests/e2e.test.js pins both halves: "the header shrinks
   in landscape and hands the room to the card" measures the gain, and
   "portrait is byte-identical" measures the absence of a cost.
   ------------------------------------------------------------------------ */
@media (max-height:520px){
  header{display:flex; align-items:center; gap:var(--sp-3); margin-bottom:var(--sp-2);
    max-width:none}
  /* Visually hidden, NOT display:none: the h1 stays in the accessibility
     tree, so the document keeps its heading and the header keeps its name.
     The clip-rect pair is the old and the current spelling of the same
     thing; both are here because Safari honoured clip long before it
     honoured clip-path. */
  h1{position:absolute; width:1px; height:1px; margin:0; padding:0; border:0;
    overflow:hidden; white-space:nowrap; clip:rect(0 0 0 0); clip-path:inset(50%)}
  /* The strip takes what is left. min-width:0 is what lets it: a flex item's
     automatic minimum is its content, so without it the strip would refuse to
     shrink and push the mode bar off the row. */
  .decks{flex:1 1 auto; min-width:0}
  .modebar{flex:0 0 auto; margin-top:0}
}
main{flex:1; display:flex; align-items:center; justify-content:center; width:100%; min-height:0}
/* The card is sized from whichever axis runs out first.
   --card-w caps the WIDTH (88vw, 46vh, 420px), but taking it as the width and
   letting aspect-ratio derive the height is a one-way constraint, and in
   landscape the height is the axis that runs out: at 844x390 `main` has 113.8px
   to give while 46vh asks for a 179.4-wide card, i.e. a 247.7-tall one. The
   ~134px of overflow was split above and below by align-items:center, laying
   the card over the header and the footer - five controls (both mode buttons,
   SHUFFLE, the counter and + ADD) had perfect on-screen rects
   that elementFromPoint resolved to the card.
   So the HEIGHT is the definite axis and the width is derived from it:
   height = min(what the box has, what --card-w would have asked for), which
   makes the used width min(available-height x 63/87, --card-w). Portrait is
   arithmetically untouched - at 380x800 the box offers 529.8px, worth a 383.6
   wide card, so the 88vw cap of 334.4 still binds and the card is byte-identical.
   NOT `max-height:100%; width:auto; max-width:var(--card-w)`: that leaves both
   axes indefinite and, since .card and both .faces are percentage/absolutely
   sized, the scene has no intrinsic width to fall back on and measures 0x0 at
   every viewport, portrait included. Every control hit-tests clean with no card
   on the page - which is why the test asserts the card is MAXIMAL, not merely
   contained. */
.scene{height:min(100%, calc(var(--card-w) * 87 / 63)); width:auto; max-width:100%;
  aspect-ratio:63/87; perspective:1400px}
.card{position:relative; width:100%; height:100%; transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.2,.7,.25,1); cursor:pointer;
  /* The 12px radius lives on .face, but .card:active's ring is a box-shadow
     and a box-shadow takes the radius of the element it is ON - so without
     this the press ring is a hard rectangle around a rounded card, with a
     square nub of ring at each corner. It clips nothing: .card paints no
     background and no border, and .face already carries the same radius. */
  border-radius:12px}
.card.flip{transform:rotateY(180deg)}
@media (prefers-reduced-motion: reduce){ .card{transition:none} }
.face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:var(--paper); border-radius:12px; overflow:hidden;
  box-shadow:0 12px 34px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.4);
  display:flex; flex-direction:column;
}
.face::before{content:""; position:absolute; inset:0; border-radius:12px; padding:3.2px;
  background:var(--ga);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none}
.back{transform:rotateY(180deg)}
.hdr{display:flex; justify-content:space-between; align-items:flex-start;
  padding:11px 13px 0; color:var(--ink)}
.hdr .l{font:600 9px/1.5 "Nunito Sans"; letter-spacing:.12em; color:var(--ink)}
/* Was var(--sep) (#8a8a8a), 3.45:1 on the paper. #757575 is 4.61:1.
   Fixed here rather than by darkening the token: --sep resolves to the same
   #8a8a8a the DIAGRAM uses for a receded bottom-shell label, but the diagram
   does not READ the token - it hardcodes the literal "#8a8a8a" in JS (search
   for it below, in the label() call). Retuning --sep would therefore have
   silently split one grey into two rather than moved both, and the diagram's
   grey is ground truth. Note the consequence: --sep now has NO consumer at
   all, in CSS or in JS. It is a dead token, left in place only because
   removing it is a restyle beyond these three rows. */
.hdr .l .num{color:#757575; font-weight:400}
.hdr .l .deg{color:var(--root); font-weight:600; letter-spacing:.06em}
.hdr .r{font:600 8px/1.3 "Nunito Sans"; letter-spacing:.11em; color:var(--ink);
  text-align:right; max-width:55%; text-transform:uppercase}
/* Sits below .hdr, not inside it - .hdr's height is unaffected. Opens the
   deck's committed PDFs as-is (D9): no generation, no build step. */
.prints{display:flex; justify-content:flex-end; gap:var(--sp-2); padding:2px 13px 0}
.prints a{font:600 7px/1.4 "Nunito Sans"; letter-spacing:.08em; color:var(--tone);
  text-decoration:none; white-space:nowrap}
.prints a:hover, .prints a:focus-visible{text-decoration:underline}
/* A custom deck's controls are <button>/<select>, not links. They read as the
   same row: same type, same colour, same position - only the element differs,
   because there is no PDF to point an href at. */
.prints button, .prints select{font:600 7px/1.4 "Nunito Sans";
  letter-spacing:.08em; color:var(--tone); background:none; border:0; padding:0;
  margin:0; white-space:nowrap; cursor:pointer; -webkit-appearance:none;
  appearance:none}
.prints button:hover, .prints button:focus-visible,
.prints select:hover, .prints select:focus-visible{text-decoration:underline}
/* 44px is the touch target the rest of the app uses; these sit inside a card
   face that is only 87mm tall, so the target is grown with padding on the ROW
   rather than on each control, which would break the type rhythm above. */
.prints button:active, .prints select:active{color:var(--ink)}
.prompt{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:0 16px 26px}
.bigname{font-family:Marcellus, serif; color:#545454; line-height:.95; text-align:center}
.bigname sup{font-size:.5em; vertical-align:.55em}
/* #b6ae9f was 2.20:1 on the white paper - and this line ("TAP TO REVEAL THE
   NOTES") is the only instruction a first-run user gets, so it is the one
   string on the card that must be legible before anything else is understood.
   #6f6658 is the same warm grey darkened to 5.65:1, comfortably past the 4.5:1
   WCAG AA needs at this size. It is a UI grey, not a deck palette colour, so
   the design system is untouched. */
.hint{margin-top:14px; font:600 9.5px/1.6 "Nunito Sans"; letter-spacing:.14em; color:#6f6658;
  text-transform:uppercase}
.diagwrap{flex:1; display:flex; align-items:center; justify-content:center; min-height:0;
  padding:2px 6px 0}
.diagwrap svg{width:100%; height:100%; max-height:100%}
.lines{padding:0 8px 13px; text-align:center}
.badge{font:600 9px/1 "Nunito Sans"; letter-spacing:.14em; color:#E27005; margin-bottom:6px}
.notesline{font-family:Bitter, serif; font-weight:400;
  font-size:clamp(12px,4.4vw,19px); line-height:1.25; white-space:nowrap}
.numline{font-family:Bitter, serif; font-weight:400;
  font-size:clamp(12px,4.2vw,18px); line-height:1.2; white-space:nowrap}
.notesline sub{font-size:.62em}
/* The note/number-line separators: #9a949f was 2.95:1 on the paper. #75707c
   keeps the same cool cast at 4.81:1 and stays clearly recessive against the
   root/tone colours it sits between. */
.sepc{color:#75707c}
footer{width:100%; max-width:520px; display:flex; align-items:center;
  justify-content:space-between; gap:var(--sp-2); margin-top:var(--sp-3)}
button.nav{flex:0 0 auto; width:56px; height:44px; border-radius:10px; border:1px solid #433b2c;
  background:#211d16; color:#eae6df; font-size:18px; cursor:pointer}
button.nav:active{background:#2e281e}
.mid{flex:1; text-align:center}
.count{font:600 11px/1 "Nunito Sans"; letter-spacing:.12em; color:#c4bcab}
/* Was 95.2 x 11.5 - the smallest interactive target in the app, and the one
   that toggles a mode the user must be able to turn OFF. Same reasoning as
   .mode: the box grows, nothing is overlaid. The 7px top margin is folded into
   the 44px box, so .mid grows 25.5px - but footer is align-items:center around
   two 44px nav buttons, so only 11px of that reaches the page. That 11px is
   paid back in the chrome budget above.
   It does NOT leave the counter where it was: "1 / 18" rises 18.25px at
   390x844 relative to the old footer, and the visible gap between it and
   "SHUFFLE: OFF" opens from 7px to 16.25px, because the label is now centred
   in a 44px box instead of sitting 7px under the counter. That is a real
   visual change, accepted as the price of the target. */
.shuffle{margin-top:0; min-height:44px; display:inline-flex; align-items:center;
  justify-content:center; background:none; border:none; color:#a79d8b; cursor:pointer;
  font:600 9.5px/1 "Nunito Sans"; letter-spacing:.13em; text-transform:uppercase}
.shuffle.on{color:#f1ece1}
/* --ring is how far the ring paints OUTSIDE the border box: the offset plus
   the stroke. Anything that clips its children (a scroll container, and
   overflow-y:auto makes overflow-x auto too) has to reserve that much or the
   ring loses its left and right sides and reads as a broken border - which is
   what the owner reported on 2026-09-11. Kept next to the rule that sets it,
   because the two numbers have to move together. */
:root{--ring:4px}
:focus-visible{outline:2px solid #e3b25c; outline-offset:2px}

/* ---- the scale page (Phase 3, made a page in Stage 2) ----
   #scale-sheet is the page layer: it carries the dialog role and fills the
   viewport, and its single child is the surface. It is OPAQUE and the same
   ink as the surface, not a translucent backdrop - going full-screen was the
   owner's first request, and a page with the practice screen showing through
   its margins is still a drawer. Nothing behind it is visible, which is also
   why the layer-tap-to-close gesture is gone: there is no backdrop to aim at,
   and on a wide viewport the flanks beside the surface are page, not scrim. */
#scale-sheet{position:fixed; inset:0; z-index:30; background:#1f1b15;
  display:flex; align-items:flex-end; justify-content:center}
[hidden]{display:none !important}
/* The page surface. The owner called the drawer this replaced "particularly
   cramped": every gap in it was the same 9px and the surface had 14px of
   padding, so the label, the box, the parse line, the preview and the message
   all sat at one distance and read as one undifferentiated block. The ramp does
   the separating now - --sp-4 around the surface and between the scrolling body
   and its footer, --sp-3 between the body's groups, --sp-1 inside a group
   between a label and the control it names - and the structure is unchanged
   apart from the height: header, scroll, reserved footer. */
.sheetsurf{width:100%; max-width:520px; background:#1f1b15;
  height:100dvh; max-height:100dvh; overflow-y:auto; overscroll-behavior:contain;
  padding:var(--sp-3) var(--sp-4) max(var(--sp-4), env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:var(--sp-4)}
/* The header row: BACK, then the page title. Outside .sheetbody like the
   footer, so the way out of the page is never scrolled off the top - which is
   the drawer's grab handle replaced by something that does a job. */
.sheethead{flex:0 0 auto; display:flex; align-items:center; gap:var(--sp-3)}
#scale-title{margin:0; font:600 13px/1.4 "Nunito Sans"; letter-spacing:.09em;
  color:#eae6df; text-transform:uppercase}
/* The surface fills the viewport, so on the Edit page, in landscape, or with
   a soft keyboard up its content is taller than the cap. Before .sheetbody
   existed the WHOLE surface scrolled, which put the sheet's only primary -
   #scale-generate, last in the flow - below the fold: at 844x390 it started
   245px down, and with a keyboard-shrunk viewport GENERATE CARDS was off-screen
   entirely (queue rows 211, 212). It read as a dead end rather than as
   something scrollable, because scrollTop is 0 on open and iOS overlay
   scrollbars stay invisible until touched.
   So the scroll moved INSIDE: everything above the primary scrolls in
   .sheetbody and the primary (with DELETE THIS DECK, which follows it on the
   Edit path) sits in the fixed remainder below. A reserved footer, not a
   sticky one: a sticky primary overlaps the palette swatches MID-SCROLL (at
   scrollTop 188-228 of a 259 max on the Edit sheet, all six swatches hit-test
   to #scale-generate, not to themselves), so it trades a button below the fold
   for six 44px targets a finger cannot reach at some scroll offsets. A
   reserved footer occludes nothing at any offset.
   The SHRINK is load-bearing: the body has to give way to the footer instead
   of keeping its content height, or the footer is pushed past the cap again
   (flex-shrink:0 here reproduces the original bug exactly). It needs no
   min-height:0 to do that - a scroll container's automatic minimum size is
   already 0, so overflow-y is the same declaration doing both jobs.
   .sheetsurf keeps overflow-y:auto as the backstop for the degenerate case
   where the footer alone exceeds the cap. */
/* The inline padding is NOT spacing - it is the room the focus ring needs to
   paint in. #scale-box is width:100% so it fills the content box exactly, and
   a ring 4px outside that box falls outside the scrollport and is clipped,
   with scrollWidth === clientWidth so there is not even a scrollbar to reach
   it. The negative margin gives the padding back to the layout, so nothing
   moves: the rows still align with the surface's own padding. */
.sheetbody{overflow-y:auto; overscroll-behavior:contain; display:flex; flex-direction:column; gap:var(--sp-3);
  padding-inline:var(--ring); margin-inline:calc(-1 * var(--ring))}
/* A label, its control and the line that explains the control are ONE group:
   --sp-1 inside, and the group is separated from the next by .sheetbody. */
.fieldrow{display:flex; flex-direction:column; gap:var(--sp-1)}
.sheetlabel{font:600 9.5px/1.5 "Nunito Sans"; letter-spacing:.13em; color:#a79d8b;
  text-transform:uppercase}
#scale-box{width:100%; min-height:48px; padding:12px var(--sp-3); color:#eae6df;
  font-family:Bitter, serif; font-weight:400; font-size:16px;
  background:#151310; border:1px solid #433b2c; border-radius:8px}
#scale-box.bad{border-color:#E27005}
/* Two things beyond type. The margin: .fieldrow's --sp-1 binds a label to the
   control it names, but this line COMMENTS on what was typed and wants the
   next step up - expressed as the difference so the ramp still owns both
   numbers at every breakpoint. The min-height: it reserved this line back when
   updateParse() blanking it on an invalid parse jumped the sheet, and since
   2026-09-21 it is INERT - the :empty rule below takes an empty parse line out
   of the flow before any floor can apply, and #scale-refusal takes the identical
   box on exactly the keystrokes this line goes blank. What holds the row open
   now is syncParseState()'s exclusivity (CONTENT, not a floor), which is what
   e_refusal_row_collapses mutates. Kept as the floor that takes over if that
   :empty rule is ever scoped differently. */
#scale-parse{font-family:Bitter, serif; font-weight:400; font-size:12px; line-height:1.55;
  color:#c4bcab; overflow-wrap:anywhere;
  margin-top:calc(var(--sp-2) - var(--sp-1)); min-height:1.55em}
/* The parse line and the refusal SHARE one reserved line, and that is what
   pays for bringing a refusal up here (2026-09-21). They are mutually
   exclusive because showParse() and showRefusal() are the only two writers
   and each blanks the other - so whichever is empty stops occupying the row
   and the other stands in its place, at the identical box (same 1.55
   line-height, same 1.55em floor, same margin). The fieldrow therefore costs
   exactly what it cost before, which the Edit sheet needs: its slack at
   380x780 was 20.9px and a second reserved line is 22px.
   The exclusivity has to be STRUCTURAL, not a coincidence of call order.
   The first cut of this shared the row with #scale-msg, the sheet's general
   message area, and two of its other callers write while the parse line is
   full: openEditSheet()'s pan warnings, and runGenerate()'s duplicate-scale
   refusal on a seed that parsed fine. Both took two rows, stepped the pan
   26.59px under the finger, and put #scale-layout-row's bottom at 785.69
   against a 780px viewport - below the fold, the exact cost this row exists
   to avoid. #scale-msg is back below the pan and never enters this row. */
#scale-parse:empty, #scale-refusal:empty{display:none}
/* The pan mock sits on a light plate because the pan is drawn in card ink -
   black rim, #242424 labels - and the sheet surface is dark. Capped so the
   whole sheet still fits a 380px phone without the preview pushing GENERATE
   CARDS below the fold.
   300px, not the 184px this shipped at through Stage 2 (Stage 1 prose, carried
   as Stage 2 review nit 8). The plate stopped being a thumbnail when Stage 3
   made it the LAYOUT control's target: every note on it is now a tap target,
   and a target's size is the whole of whether it can be hit. 300px is what a
   380px page has to give after the surface's own padding. It does NOT reach
   the 44px floor on a 17-field Pygmy pan - that needs 379.45px, which no
   380px viewport has - and per Stage 1 AC3 non-overlap wins there: the
   targets stay disjoint and Pygmy's cap at 34.8px stands. */
#scale-preview{align-self:center; width:100%; max-width:300px; padding:var(--sp-2);
  border-radius:12px; background:#f1ece1; border:1px solid #433b2c}
/* Not-current: the placeholder example before anything is typed, and the last
   render held through an invalid parse. ONE treatment for both, because the
   invalid case already shouts in two other channels (#scale-box.bad's orange
   border and the orange message) - what separates them is the accessible name,
   set in JS. The whole plate dims, not the SVG inside it: an undimmed
   #f1ece1 plate on a #1f1b15 sheet is the loudest thing in the drawer, and on
   an empty box that is an example nobody typed. .62 and not lower because the
   pan is role="img" content, so the rim ink has to keep its contrast. */
#scale-preview.stale{opacity:.62}
#scale-preview svg{display:block; width:100%; height:auto}
/* Geometry deliberately IDENTICAL to #scale-parse above, because this sits
   between the scale field and the pan preview and the two take turns in one
   row: the line-height and the margin drifting from the parse line's values
   shows up as the pan stepping when a seed goes bad.
   min-height is the ONE part that is inert while the :empty rule above stands
   - a #scale-refusal holding text is never shorter than a line, and an empty
   one leaves the flow before the floor can apply. It is kept as the floor
   that takes over if that rule is ever scoped differently, and it is
   deliberately NOT what the pan test rests on; the mutant for that test drops
   #scale-parse:empty instead. A refusal long enough to wrap still steps the
   pan one line; core.js:125 caps an interpolated bad token at 12 characters,
   and that is the only input that reaches two lines at 380px.
   No font fallback stack on purpose: system-ui renders wider here and pushed
   a one-line refusal to 37.19px, i.e. into the wrap case, on every device
   without Nunito Sans loaded. */
#scale-refusal{font-family:"Nunito Sans"; font-weight:400;
  font-size:12px; line-height:1.55; color:#c4bcab; overflow-wrap:anywhere;
  margin-top:calc(var(--sp-2) - var(--sp-1)); min-height:1.55em}
#scale-refusal.err{color:#E27005}
#scale-msg{font:400 12px/1.5 "Nunito Sans"; min-height:1.5em; color:#c4bcab;
  overflow-wrap:anywhere}
#scale-msg.err, .announce.err{color:#E27005}
#scale-msg.warn, .announce.warn{color:#e3b25c}
#scale-msg.ok, .announce.ok{color:#a4c9a0}
.ctlrow{display:flex; align-items:center; justify-content:space-between;
  gap:var(--sp-3); flex-wrap:wrap}
.mirror{display:flex; gap:var(--sp-2)}
/* The reserved footer - since 2026-09-17 the primary alone, plus the Edit-only
   delete row - is what the sheet guarantees is reachable without scrolling, so
   it gets a hairline rather than only a gap: at a scroll offset where the body
   still has more to give, the rule is what says "this part does not move".
   The rule hangs off the SCROLLPORT's bottom edge, not off the first pinned
   element. It used to be `.sheetsurf > .ctlrow`, and when the mirror/palette
   row moved into .sheetbody that direct-child selector stopped matching
   anything - the divider disappeared with no test to notice, since this was
   the file's only border-top. The boundary it describes is .sheetbody's own
   edge, so that is where it belongs: moving a child across it cannot unhook it
   again. Pinned by "a hairline divides the pinned footer from the scroll". */
.sheetbody{border-bottom:1px solid #332c22}
/* Landscape on a phone: 390px of height, and every pixel of chrome on the page
   comes straight off the scrolling body. The footer's breathing room above its
   own hairline is .sheetsurf's gap, already dropped to --sp-3 above; this
   returns the primary to the 44px floor. The hairline stays: it is what says
   the footer does not scroll, and it costs one pixel. */
@media (max-height:520px){
  #scale-generate{min-height:44px}
  /* Text fields go back to the 44px floor with tighter padding: on the Edit
     sheet there are two of them above the fold and the box the caret lands in
     is the lower one, so four pixels each is the difference between opening at
     rest and opening already scrolled. */
  #scale-box, #scale-name, #scale-degrees{min-height:44px; padding:9px var(--sp-3)}
  .sheetbody{gap:var(--sp-2)}
  .sheetsurf{gap:var(--sp-3); padding-top:var(--sp-2)}
  /* A 390px-tall viewport leaves the body a couple of hundred px, and the
     plate is now always in the flow rather than only after a valid parse, so
     at 300px it would be most of the scrollport. The pan stays readable at 120px - it is a
     where-do-the-notes-sit mock, not the card. */
  #scale-preview{max-width:120px}
}
/* Desktop: the sheet was pinned at the phone's 520px whatever the viewport,
   which on a 1440px screen is a narrow column floating in the middle of a wide
   backdrop while the header beside it runs to min(92vw, 900px). 52vw tracks
   the viewport between a 520px floor (the phone measurement, so nothing gets
   NARROWER) and a 680px cap (past that the seed's line length stops being
   comfortable and the side margins read as slack).
   The plate goes with it. Nothing else in the drawer scales with width - the
   seed is a short string and only the parse line wraps - so a wider sheet
   around a 300px plate is a wider EMPTY band, not a better composition. 340px
   is as far as it goes: beyond that the mock starts competing with the card.
   Gated on both axes like the ramp, so no phone in landscape picks it up. */
@media (min-width:640px) and (min-height:700px){
  .sheetsurf{max-width:clamp(520px, 52vw, 680px)}
  #scale-preview{max-width:340px}
}
/* No min-height here: .mode carries the 44px minimum for every .mode on the
   page, sheet buttons included. */
/* The swatch BUTTON is the 44px target and the 14px dot is painted inside it,
   rather than a 14px button carrying a larger invisible ::after overlay.
   The overlay version measured correct on every rect and was still wrong: six
   44px overlays on a 24px pitch (14px dot + 10px gap) overlapped by 20px, and
   in a hit test the later sibling wins, so the right half of every swatch but
   the last belonged to its NEIGHBOUR - a thumb 15px right of Palette 3 chose
   Palette 4 with no feedback. An overlay bigger than its element also cannot
   be laid out against: it can hang off the row's right edge (the last one did,
   at x=380 on a 380px viewport) and any scroll container would clip it.
   A target that IS the element has neither failure mode, at any alignment.
   The dot keeps its 14px spec; the visible gap widens to 30px, which is the
   pitch 44px targets require. */
#scale-swatches{display:flex; gap:0; align-items:center}
#scale-swatches .dot{width:44px; height:44px; border:none; padding:0; background:none;
  position:relative; cursor:pointer}
#scale-swatches .dot::after{content:""; position:absolute; left:50%; top:50%;
  width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%;
  background:linear-gradient(180deg,var(--dga) 0 50%,var(--dgb) 50% 100%)}
#scale-swatches .dot.sel::after{box-shadow:0 0 0 2px #f1ece1}
#scale-generate{width:100%; min-height:52px; border-radius:10px; cursor:pointer;
  border:1px solid #f1ece1; background:#f1ece1; color:#272219;
  font:600 11.5px/1 "Nunito Sans"; letter-spacing:.12em}
#scale-generate:disabled{opacity:.5; cursor:default}
/* ---- Edit state (Phase 4). The rows below are the ONLY difference between
   the create sheet and the Edit sheet; SAVE CHANGES reuses #scale-generate so
   there is never a second primary button on the surface. */
.editrow{display:flex; flex-direction:column; gap:var(--sp-1)}
#scale-name, #scale-degrees{width:100%; min-height:48px; padding:12px var(--sp-3); color:#eae6df;
  background:#151310; border:1px solid #433b2c; border-radius:8px}
#scale-name{font-family:Bitter, serif; font-weight:400; font-size:16px}
#scale-degrees{font:400 16px/1.2 "Nunito Sans"}
/* ---- LAYOUT correction (Phase 5, moved onto the pan in Stage 3). Every
   control here is a SECONDARY: the sheet's only full-width primary stays
   #scale-generate. The PAN is the selection and a single tab stop; its arrow
   keys walk the notes, so there is no drag-only path to any of this. */
#scale-layout-row{gap:var(--sp-2)}
/* The hint reads as prose, so it takes the parse line's Bitter rather than the
   label's letter-spaced caps - it is a sentence to read once, not a control
   label to scan. Dimmer than #scale-parse: that line reports on what is in the
   box and changes as you type, this one never changes. */
.sheethint{margin:0; font-family:Bitter, serif; font-weight:400; font-size:11.5px;
  line-height:1.5; color:#a79d8b; overflow-wrap:anywhere}
#scale-layout-row .ctlrow{gap:var(--sp-2); flex-wrap:wrap}
/* The selection ring is drawn in the SVG (pan(), .pansel) rather than in CSS:
   it has to sit on ONE note at the radius that note was drawn at, which is a
   solved number no selector can reach. What CSS owns is the focus treatment of
   the pan as a whole. */
#scale-preview[tabindex]{cursor:pointer; border-radius:12px}
#scale-preview[tabindex]:focus-visible{outline:2px solid #f1ece1; outline-offset:2px}
/* iOS has no hover and this app turns the tap highlight off, so a note that is
   already selected would otherwise answer a tap with nothing at all. The hit
   target is transparent by design (it is smaller than the note it covers), so
   the press flash fills it rather than restyling the note. */
#scale-preview .panhit:active{fill:rgba(226,112,5,.22)}
#scale-layout-reset{background:none; border:none; color:#a79d8b; cursor:pointer;
  min-height:44px; padding:0 4px;
  font:600 9.5px/1.5 "Nunito Sans"; letter-spacing:.13em; text-transform:uppercase}
/* Quiet, never a primary: auto width, so the sheet's only full-width button
   stays #scale-generate. */
#scale-delete-row{align-items:center}
/* Amber to match #scale-delete[data-armed] and #scale-msg.warn - one colour
   for "about to do something you cannot undo". :empty leaves the flow so an
   idle DELETE row is exactly the height it was before this line existed. */
#scale-del-note{font-family:"Nunito Sans"; font-weight:400; font-size:12px;
  line-height:1.55; color:#e3b25c; overflow-wrap:anywhere}
#scale-del-note:empty{display:none}
#scale-delete{width:auto; min-height:44px; padding:12px 14px; background:none; border:none;
  color:#a79d8b; font:600 9.5px/1.5 "Nunito Sans"; letter-spacing:.13em;
  text-transform:uppercase; cursor:pointer}
.announce{width:100%; max-width:520px; margin-top:var(--sp-2); text-align:center;
  font:400 11.5px/1.45 "Nunito Sans"; color:#c4bcab; min-height:1.45em}

/* ---- press feedback (queue row 223f) ----------------------------------
   `*{-webkit-tap-highlight-color:transparent}` at the top of this stylesheet
   removes the ONLY touch feedback iOS gives by default, and until now
   button.nav:active was the app's only :active rule - so on the owner's
   phone every other control gave a tap back exactly nothing. A phone has no
   hover: :active is not an extra polish channel there, it is the entire
   press channel, and without it a tap that missed and a tap that landed look
   identical for the whole time the finger is down.

   One block rather than a declaration tacked onto each rule, because the
   thing being guaranteed is coverage - "every interactive control", pinned
   by tests/e2e.test.js "every interactive control has a press state", which
   sweeps the stylesheet for :active selectors and matches them against every
   button and role=button on the page. A new control added without a press
   state reddens that test; a new control added to this block is one line.

   Each rule moves a property the control already uses, so nothing here is a
   new colour in the design system: the dark controls lighten toward their
   own hover-less pressed shade, the light primary darkens, and the quiet
   text buttons come up to full ink.

   The CARD is a box-shadow and not a transform or a filter: .card carries
   transform-style:preserve-3d and a .45s transform transition, so a pressed
   transform would animate for 450ms (not feedback) and would fight
   .card.flip's own rotateY, while a filter flattens the 3D context and takes
   backface-visibility with it. A shadow paints in the element's own plane
   and touches neither. */
.chip:active{background:#332c22}
.mode:active{background:#2e281e}
.mode.on:active{background:#ddd7cb; border-color:#ddd7cb}
.shuffle:active{color:#eae6df}
.card:active{box-shadow:0 0 0 3px rgba(234,230,223,.22)}
#scale-generate:active{background:#ddd7cb; border-color:#ddd7cb}
#scale-generate:disabled:active{background:#f1ece1; border-color:#f1ece1}
#scale-swatches .dot:active::after{box-shadow:0 0 0 2px #a79d8b}
#scale-swatches .dot.sel:active::after{box-shadow:0 0 0 2px #f1ece1}
#scale-swatches .dot:active{opacity:.75}
#scale-layout-reset:active, #scale-delete:active{color:#eae6df}
/* Armed is a state the eye can read without the label: the same amber the
   announcer uses for a warning. */
#scale-delete[data-armed]{color:#e3b25c}
/* The armed rule outranks the shared :active one - same specificity, later in
   the file - so without this the armed button is the only control on the page
   that does not answer a press. Confirming a delete is the press that most
   needs the acknowledgement. */
#scale-delete[data-armed]:active{color:#eae6df}

/* ---- the print sheet (Workstream B) ---------------------------------------
   This block is deliberately LAST in the <style> element. It redefines
   `.face::before` for printed cards, and `tests/test_render_agreement.py:238`
   reads that rule with a whole-file regex that takes the FIRST match - so the
   screen rule at :320 has to stay the one it finds. Nothing goes below here.
   The grid's card and gutter sizes are NOT in this block: printGridCSS()
   writes them from PRINT_GEOM into #printgeom, so there is one definition
   site for them (AC-B3). ------------------------------------------------- */
#printroot{display:none}
#printroot .printpage{position:relative; display:flex; align-items:center;
  justify-content:center; break-after:page; page-break-after:always}
#printroot .printpage:last-child{break-after:auto; page-break-after:auto}
#printroot .printsheet{display:grid}
#printroot .printcell{position:relative; overflow:hidden}
/* The faces are authored at a screen width and scaled down to the card's
   physical size; the wrapper carries the transform so the grid cell keeps its
   printed dimensions. It must stay IN FLOW: out of flow (position:absolute)
   Chrome clips it at every page break, so each page but the last loses its
   bottom row's diagram. `relative` and not `static` because .printcell .face
   is absolutely positioned and needs this element as its containing block -
   under static the face would resolve against .printcell and shrink twice. */
#printroot .printscale{position:relative; top:0; left:0; transform-origin:top left}
#printroot .printcell .face{position:absolute; inset:0; box-shadow:none;
  backface-visibility:visible; -webkit-backface-visibility:visible}
#printroot .printname{padding:0 13px; font-family:Marcellus, Georgia, serif;
  font-size:26px; line-height:1.1; color:var(--name); text-align:center}
#printroot .printblurb{padding:0 13px 10px; text-align:center;
  font:400 9px/1.5 "Nunito Sans", sans-serif; color:var(--sep)}
#printroot .printkeys{display:flex; justify-content:center; gap:var(--sp-2);
  font:400 9px/1 "Nunito Sans", sans-serif; letter-spacing:.06em; color:var(--ink)}
#printroot .printkeys .ring{display:inline-block; width:9px; height:9px;
  margin-right:5px; border-radius:50%; border:2px solid var(--ink);
  vertical-align:-1px}
#printroot .blankrule{height:1px; margin:14px 18px; background:#e0e0e0}
@media print{
  *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  /* height:100% is a PERCENTAGE, not a page-box literal: the platform
     resolves it against whatever page area it actually chose, which is the
     one number we are never allowed to assume. It gives .printpage free
     space to centre the sheet in; min-height (emitted by printGridCSS) is
     the floor that stops the block ever being shorter than the sheet, which
     is what made every sheet paginate onto two pages. Floor and fill
     together - neither alone is correct. */
  html,body{height:100%; min-height:0; overflow:visible}
  body.printing #printroot, body.printing #printroot .printpage{height:100%}
  /* The safe-area padding is an on-screen notch reservation and has no meaning
     on paper; left in, it shifts every page by the device's insets. */
  body{margin:0; padding:0; background:#fff; display:block}
  body.printing > header, body.printing > main, body.printing > .announce,
  body.printing > #scale-sheet, body.printing > footer{display:none !important}
  body.printing #printroot{display:block}
  /* B0 finding: the masked `.face::before` frame flattens to a SOLID block in
     Chrome's print export. Re-express it as an inset ring, which survives. */
  #printroot .printcell .face::before{display:none}
  #printroot .printcell .face{box-shadow:inset 0 0 0 3.2px var(--ga)}
}
</style>
</head>
<body>
<header>
  <h1>Handpan Chord Cards</h1>
  <!-- "+ ADD" is authored as the strip's first child and buildChips keeps it
       there on every rebuild - see the .chip.add comment for why it is inside
       the strip and why it must stay in normal flow. -->
  <nav class="decks" id="decks">
    <button class="chip add" type="button" id="deck-add" aria-haspopup="dialog">+ ADD</button>
  </nav>
  <div class="modebar">
    <button class="mode on" id="modeA" aria-pressed="true">NAME &rarr; NOTES</button>
    <button class="mode" id="modeB" aria-pressed="false">NOTES &rarr; NAME</button>
  </div>
</header>

<main>
  <div class="scene">
    <!-- Both faces stay in the DOM (the flip is a CSS transform), so the one
         turned away is aria-hidden and the one showing is the card's
         accessible description - otherwise the card reads as the question and
         the answer at once. render() keeps both in step with `flipped`. -->
    <div class="card" id="card" role="button" aria-label="Flip card" tabindex="0"
         aria-describedby="front">
      <div class="face front" id="front"></div>
      <div class="face back" id="back" aria-hidden="true"></div>
    </div>
  </div>
</main>

<footer>
  <button class="nav" id="prev" aria-label="Previous card">&larr;</button>
  <div class="mid">
    <!-- polite, not assertive: stepping is the user's own action, so the new
         position should follow the card, never interrupt it. -->
    <div class="count" id="count" aria-live="polite"></div>
    <button class="shuffle" id="shuffle">Shuffle: off</button>
  </div>
  <button class="nav" id="next" aria-label="Next card">&rarr;</button>
</footer>

<!-- The practice-screen live region. It is a sibling of the landmarks the
     sheet makes inert, so a success message announced as the sheet closes is
     still read out. -->
<div class="announce" role="status" aria-live="polite"></div>

<div id="scale-sheet" role="dialog" aria-modal="true" aria-labelledby="scale-title" hidden>
  <div class="sheetsurf">
   <!-- The page header. BACK is a real <button>, which is what lets showSheet()
        move focus here on open without raising a soft keyboard - the owner's
        second request was to see the whole page before typing, and focusing
        the box is what took that away. It is also the page's accessible name
        (aria-labelledby above), so the title is announced rather than being
        decoration beside an aria-label nobody can see. -->
   <div class="sheethead">
     <button class="mode" type="button" id="scale-back"
             aria-label="Back to the practice screen">&larr; BACK</button>
     <h2 id="scale-title">Add a scale</h2>
   </div>
   <!-- The scrolling part. The primary below it is deliberately OUTSIDE, so it
        cannot be pushed under the fold by a tall Edit sheet or a short
        viewport - see .sheetbody in the stylesheet. DOM order is unchanged. -->
   <div class="sheetbody">
    <div class="editrow" id="scale-name-row" hidden>
      <label class="sheetlabel" for="scale-name">DECK NAME</label>
      <input id="scale-name" type="text" autocapitalize="characters" autocorrect="off"
             autocomplete="off" spellcheck="false" maxlength="40">
    </div>
    <!-- The label, the box and the live parse line are ONE group (.fieldrow),
         so they sit --sp-1 apart and the next group is --sp-3 away. With the
         preset row gone (owner, 2026-09: "I don't know if we need the preset
         options"), this label, this placeholder and PARSE_HINT are the ONLY
         teaching of the seed grammar there is - keep all three saying the same
         thing, and keep the placeholder a seed that actually parses. -->
    <div class="fieldrow">
      <label class="sheetlabel" for="scale-box">SCALE: DING, THEN TOP NOTES, | BOTTOM NOTES</label>
      <input id="scale-box" type="text" autocapitalize="off" autocorrect="off"
             autocomplete="off" spellcheck="false" enterkeyhint="go"
             placeholder="(D) A C D E F G A C">
      <div id="scale-parse"></div>
      <!-- Owner feedback, 2026-09-21: a refusal rendered below the pan is
           below the fold on an iPhone 14 with the keyboard up, so the user
           retypes a seed whose reason they never saw. It belongs directly
           under the field it is about, inside the same .fieldrow group.
           This element carries SEED REFUSALS ONLY - it is not the sheet's
           message area. #scale-msg keeps that job, below the pan, because a
           warning or a success notice is not about the field and must not
           compete for this row. Refusals never go through say(): sharing one
           reserved line with the parse line only works while exactly one of
           the two is filled, and showRefusal()/showParse() are what make that
           true rather than hoping every caller happens to agree. It carries
           its own aria-live because #scale-sheet is aria-modal, which puts
           the page-level .announce outside the dialog and out of reach. -->
      <div id="scale-refusal" aria-live="polite"></div>
    </div>
    <!-- The pan mock: where the notes actually land - ding, rim zig-zag, inner
         pair, dashed bottom ring in x-ray view - drawn by the SAME pan()
         renderer the cards use, with no chord chosen, so what is previewed
         cannot drift from what GENERATE CARDS produces. -->
    <div id="scale-preview" role="img"
         aria-label="Preview of where the notes sit on the pan" hidden></div>
    <!-- D5: the generated layout is a guess; this corrects it. Edit path only -
         there is nothing to correct until a pan has been solved.

         The controls sit DIRECTLY under the pan they move, and the pan IS the
         selection: Stage 3 deleted #scale-slots, the parallel list of position
         chips that stood in for it. The owner could not tell what ROTATE and
         MOVE did because the thing they moved was not on screen - the chips
         reordered and the pan behind the sheet did not visibly change. One
         target, one group, both above the fold at 380px. -->
    <div class="editrow" id="scale-layout-row" hidden>
      <span class="sheetlabel" id="scale-layout-label">LAYOUT</span>
      <!-- Stage 4 AC3. The owner's words were "I'm not sure what any of these
           intend to do since I can't see the layout of the pan change in real
           time". Stage 3 answered the second half by putting the mock in the
           flow; this sentence answers the first, and it has to live HERE - a
           comment in this file teaches nobody, and a doc is not on the phone
           the correction is made on. It names the gesture before the buttons
           because nothing either button does means anything until a note is
           chosen. -->
      <p class="sheethint" id="scale-layout-hint">Tap a note on the pan above, then ROTATE turns its whole ring one seat on, and MOVE swaps just that note with its neighbour. The pan follows every press.</p>
      <div class="ctlrow" role="group" aria-labelledby="scale-layout-label"
           aria-describedby="scale-layout-hint">
        <div class="mirror">
          <button class="mode" type="button" id="scale-rot-l"
                  aria-label="Rotate the selected note's ring one position back">ROTATE &larr;</button>
          <button class="mode" type="button" id="scale-rot-r"
                  aria-label="Rotate the selected note's ring one position on">ROTATE &rarr;</button>
        </div>
        <div class="mirror">
          <button class="mode" type="button" id="scale-move-l"
                  aria-label="Move the selected note one position back">MOVE &larr;</button>
          <button class="mode" type="button" id="scale-move-r"
                  aria-label="Move the selected note one position on">MOVE &rarr;</button>
        </div>
        <button id="scale-layout-reset" type="button"
                aria-label="Reset the layout to the generated one">RESET</button>
      </div>
    </div>
    <!-- Above the control row, so the soft keyboard never covers it. Warnings,
         success notices and deck-gone messages - everything say() writes.
         Seed refusals go to #scale-refusal up in the .fieldrow instead. -->
    <div id="scale-msg" aria-live="polite"></div>
    <!-- D10: the parent-scale override. Edit path only - the create path infers. -->
    <div class="editrow" id="scale-degrees-row" hidden>
      <label class="sheetlabel" for="scale-degrees">DEGREES</label>
      <select id="scale-degrees"></select>
    </div>
    <!-- Inside .sheetbody, in the scroll. It used to be pinned below the
         scrollport with the primary, on the argument that everything outside
         .sheetbody is what the sheet guarantees without scrolling - so the
         palette and the mirror toggle were guaranteed too.
         The owner overruled that on 2026-09-17 after photographing an
         iPhone 14 / iOS 26.6 with the keyboard up: "only generate cards
         button should be part of the bottom drawer. As of current design the
         keyboard pushes the bottom drawer up and covers the input field."
         A pinned row is not free - .sheetbody SHRINKS to make room for it
         (see the .sheetbody comment above), and under a real keyboard there
         is almost nothing left to shrink. With this row pinned, a 336px iOS
         keyboard leaves the Edit page a 12px scrollport for a 48px seed
         field; with it in the scroll, 159px. Guaranteeing the swatches cost
         the field the owner was typing into.
         So only #scale-generate (and the Edit-only delete row) stay pinned.
         The swatches and the mirror toggle lose their reachable-without-
         scrolling guarantee - that is the trade the owner chose. DOM order is
         unchanged. Moving this </div> back up is
         tests/mutants/e_sheet_ctlrow_pinned_again.patch, which dies on "with
         a real keyboard up, the seed box is not clipped by the sheet's own
         scroller"; moving it DOWN past the primary is
         tests/mutants/e_sheet_primary_back_in_the_scroll.patch, which dies on
         "GENERATE CARDS is reachable without scrolling at every phone
         viewport". -->
    <div class="ctlrow">
      <div class="mirror">
        <button class="mode" type="button" id="scale-mirror-l" aria-pressed="false">LEFT-FIRST</button>
        <button class="mode on" type="button" id="scale-mirror-r" aria-pressed="true">RIGHT-FIRST</button>
      </div>
      <div id="scale-swatches" role="group" aria-label="Card palette"></div>
    </div>
   </div>
    <button id="scale-generate" type="button" disabled>GENERATE CARDS</button>
    <div class="editrow" id="scale-delete-row" hidden>
      <button id="scale-delete" type="button">DELETE THIS DECK</button>
      <!-- The arming warning lives NEXT TO THE BUTTON it is about, not in
           the sheet's message area. #scale-refusal sits above the pan
           preview, and arming DELETE there moved the pan out from under it:
           disarmDelete() runs on the pointerdown, the warning cleared, the
           pan sprang back up, and the click that followed landed on a
           different note. That is the same tap-swallowing queue rows 91 and
           117 are about, by a new route. The seed field's refusals and this
           button's confirmation were only ever sharing one line by accident;
           below the button is also where the owner is already looking. -->
      <div id="scale-del-note" aria-live="polite"></div>
    </div>
  </div>
</div>

// (which deck, which mode) and is SHARED with whatever a later feature adds to
// it, so save() reads-modifies-writes rather than replacing it. Saved scales
// are a list, own their own key, and hold the SEED - the canonical scale string
// plus its options - never the built deck, which is derived (D14).
const STORE_KEY = "hpfc";
const SCALES_KEY = "hpfc.scales";

// so a sibling feature (or a hand-edited value) can leave any JSON type here,
// and a non-string id that reached the boot tail would throw on .indexOf and
// take the share-link handler at the end of the script down with it.
let deckId = typeof store.deck === "string" ? store.deck : "hijaz";

// guard for versions the app reads back out of storage, never a second parser.
// A version that is not a finite number is untrusted junk, not a newer app: the
// section 2 enum is closed and BAD_NOTE is its rejection for malformed input.
function checkShareVersion(v) {
  if (typeof v !== "number" || !isFinite(v)) {
    return { ok: false, code: "BAD_NOTE",
             reason: HPE.core.REASONS.BAD_NOTE.reason.split("<X>").join(String(v).slice(0, 12)) };

function openShare(text) {

  if (!res.ok) { say(res.reason, "err"); return res; }

  const built = generateDeck(HPE.core.formatSeed(res.value.fields), res.value.options);

// A list of seed records under SCALES_KEY, each {v, s, o}: the format version,
// the canonical scale string and the seed options. Rebuilt into CUSTOM at boot,
// so a custom deck survives a reload.

  const raw = readStore(SCALES_KEY);

// record out and pushing the new one would send an options-only edit to the end
// of the row on the next boot while it sat in place until then.

  const rec = { v: SHARE_VERSION, s: HPE.core.formatSeed(seed.fields), o: seed.options };
  const out = [];

    if (r && r.s === rec.s) { if (!placed) { out.push(rec); placed = true; } }

function selectDeck(id) {
  // buildChips() below throws the whole strip away and builds it again, so any
  // focus resting ON the strip is about to be invalidated: the chip that was
  // clicked is detached outright, and "+ ADD" - where closeScaleSheet() has
  // just put focus after GENERATE / SAVE CHANGES / DELETE - is now pointing at
  // "make another deck" rather than the deck that was just made. Either way
  // the caret must be re-homed onto the chip for the deck now showing, and it
  // has to happen AFTER the rebuild. Focus that was never on the strip (boot,
  // a share link) is left exactly where it was.
  const a = document.activeElement;
  const rehome = !!a && a !== document.body &&
    (a.id === "deck-add" || !!(a.closest && a.closest("#decks")));
