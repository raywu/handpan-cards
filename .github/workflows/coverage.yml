name: coverage

# Manual only. Measures what the whole suite executes (node V8 coverage, browser
# precise coverage and CSS rule usage over CDP, python line coverage) and merges
# it into artifacts/coverage-report.json. It gates nothing and runs on no PR.
on:
  workflow_dispatch:

jobs:
  coverage:
    name: full-suite coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      # Installed by this manual job only; requirements-ci.txt is untouched.
      - run: pip install coverage
      - name: Node suites, one process per file, browser coverage on
        run: |
          mkdir -p artifacts/cov/node artifacts/cov/browser artifacts/cov/python artifacts/cov/nodepy
          export HPC_COVERAGE_DIR="$PWD/artifacts/cov/browser"
          for f in tests/*.test.js; do
            n=$(basename "$f" .test.js)
            mkdir -p "artifacts/cov/node/$n"
            if ! NODE_V8_COVERAGE="$PWD/artifacts/cov/node/$n" node --test "$f"; then
              echo "FAILED $f"
              # Re-run with neither the hook nor V8 coverage: red there too is a real failure;
              # green there and red here is caused by measurement. A browser suite red only
              # under the hook is the plan's stop condition and fails this job.
              if env -u HPC_COVERAGE_DIR node --test "$f" >/dev/null 2>&1; then
                if grep -q "helpers/cdp" "$f" || [ "$f" = tests/e2e.test.js ]; then
                  echo "$f" >> artifacts/cov/hook-induced-failed.txt
                else
                  echo "$f" >> artifacts/cov/instrumentation-failed.txt
                fi
              else
                echo "$f" >> artifacts/cov/node-failed.txt
              fi
            fi
          done
          exit 0
      - name: Python suites, one coverage file per module, node children measured too
        run: |
          for f in tests/test_*.py; do
            n=$(basename "$f" .py)
            mkdir -p "artifacts/cov/nodepy/$n"
            NODE_V8_COVERAGE="$PWD/artifacts/cov/nodepy/$n" python -m coverage run --data-file="artifacts/cov/python/$n.data" --include='tools/*,src/*' -m unittest "tests.$n" || { echo "FAILED $f"; echo "$f" >> artifacts/cov/python-failed.txt; }
            python -m coverage json --data-file="artifacts/cov/python/$n.data" -o "artifacts/cov/python/$n.json" || true
          done
          exit 0
      - name: Merge
        if: always()
        run: |
          args=""
          for d in artifacts/cov/node/*/ artifacts/cov/nodepy/*/; do args="$args --node $d"; done
          node tools/coverage_merge.js $args --browser artifacts/cov/browser --python artifacts/cov/python --out artifacts/coverage-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: artifacts/coverage-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-raw
          path: artifacts/cov
      - name: Fail on a failure the measurement did not cause
        if: always()
        run: |
          for f in hook-induced-failed node-failed python-failed; do
            if [ -s "artifacts/cov/$f.txt" ]; then echo "$f:"; cat "artifacts/cov/$f.txt"; bad=1; fi
          done
          [ -s artifacts/cov/instrumentation-failed.txt ] && { echo "measurement-only failures (not gated):"; cat artifacts/cov/instrumentation-failed.txt; }
          exit ${bad:-0}
