name: coverage

# Manual only. Measures what the whole suite executes (node V8 coverage, browser
# precise coverage and CSS rule usage over CDP, python line coverage) and merges
# it into artifacts/coverage-report.json. It gates nothing and runs on no PR.
on:
  workflow_dispatch:
  push:
    branches: [claude/refactor-4-cov]

jobs:
  coverage:
    name: full-suite coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      # Installed by this manual job only; requirements-ci.txt is untouched.
      - run: pip install coverage
      - name: Node suites, one process per file, browser coverage on
        run: |
          mkdir -p artifacts/cov/node artifacts/cov/browser artifacts/cov/python
          export HPC_COVERAGE_DIR="$PWD/artifacts/cov/browser"
          failed=0
          for f in tests/*.test.js; do
            n=$(basename "$f" .test.js)
            mkdir -p "artifacts/cov/node/$n"
            NODE_V8_COVERAGE="$PWD/artifacts/cov/node/$n" node --test "$f" || { echo "FAILED $f"; failed=1; }
          done
          exit $failed
      - name: Python suites, one coverage file per module
        run: |
          failed=0
          for f in tests/test_*.py; do
            n=$(basename "$f" .py)
            python -m coverage run --data-file="artifacts/cov/python/$n.data" --include='tools/*,src/*' -m unittest "tests.$n" || { echo "FAILED $f"; failed=1; }
            python -m coverage json --data-file="artifacts/cov/python/$n.data" -o "artifacts/cov/python/$n.json" || true
          done
          exit $failed
      - name: Merge
        if: always()
        run: |
          args=""
          for d in artifacts/cov/node/*/; do args="$args --node $d"; done
          node tools/coverage_merge.js $args --browser artifacts/cov/browser --python artifacts/cov/python --out artifacts/coverage-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: artifacts/coverage-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-raw
          path: artifacts/cov
