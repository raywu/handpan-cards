name: editor RC browser QA

on:
  push:
    branches: [claude/rc-upgrade]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-rc-browser-qa
  cancel-in-progress: true

jobs:
  editor-rc:
    if: github.ref == 'refs/heads/claude/rc-upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare exact publisher output
        env:
          CF_PAGES_BRANCH: claude/rc-upgrade
        run: sh tools/publish.sh "$RUNNER_TEMP/editor-publisher"
      - name: Exercise the deployed revision
        run: python3 tools/run_editor_rc.py "$RUNNER_TEMP/editor-publisher/index.html" artifacts
      - name: Report editor browser cases
        if: always()
        run: |
          printf 'Publisher commit `%s`\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/report_editor_browser.py artifacts/editor-rc.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-rc-results
          path: artifacts/
